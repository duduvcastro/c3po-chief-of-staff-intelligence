name: F2-F6 new control plane fixture proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-candidate-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen package and run only new fixture cases
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 PROVA_CANDIDATO.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f2-f6-candidate-result
          path: |
            RESULT.json
            MANIFEST.json
          if-no-files-found: error
          retention-days: 7
