# Component proof only. No transport credentials, binder preparation or host dispatch.
name: capture-owner-response-proof
on:
  workflow_dispatch:
  push:
    branches: [ops/capture-owner-response-proof-20261007]
permissions:
  contents: read
jobs:
  owner-response:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Offline signature response component
        working-directory: capture-owner-response
        run: python -I -B run_offline_tests.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capture-owner-response-component-proof
          path: capture-owner-response/COMPONENT_TEST_RESULT.json
          if-no-files-found: error
          retention-days: 30
