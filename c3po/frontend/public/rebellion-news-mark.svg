<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" role="img" aria-label="Rebellion News Star Wars Rebels emblem">
  <defs>
    <radialGradient id="panel" cx="50%" cy="42%" r="74%">
      <stop offset="0" stop-color="#272018"/>
      <stop offset=".58" stop-color="#111116"/>
      <stop offset="1" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="edge" x1="14" y1="12" x2="115" y2="117" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset=".28" stop-color="#d39924"/>
      <stop offset=".66" stop-color="#6d3e0a"/>
      <stop offset="1" stop-color="#f3c452"/>
    </linearGradient>
    <filter id="wordmark-shadow" x="-12%" y="-20%" width="124%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#000000" flood-opacity=".9"/>
    </filter>
    <filter id="signal-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="11" fill="url(#panel)"/>
  <rect x="4" y="4" width="120" height="120" rx="8" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
  <rect x="9" y="9" width="110" height="110" rx="5" fill="none" stroke="#574318" stroke-width="1"/>
  <path d="M16 19h24M88 19h24M16 109h24M88 109h24" fill="none" stroke="#d9a12f" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M18 25h92M18 101h92" fill="none" stroke="#6d501b" stroke-width=".8" opacity=".7"/>

  <image x="7" y="31" width="114" height="58" preserveAspectRatio="xMidYMid meet" xlink:href="rebellion-news-wordmark.png?v=2" href="rebellion-news-wordmark.png?v=2" filter="url(#wordmark-shadow)"/>

  <circle cx="64" cy="108" r="6" fill="#48110f" stroke="#f0c956" stroke-width="1.4" filter="url(#signal-glow)"/>
  <circle cx="64" cy="108" r="3.1" fill="#cf3028"/>
  <circle cx="63" cy="107" r="1.1" fill="#ffe9a3"/>
</svg>
