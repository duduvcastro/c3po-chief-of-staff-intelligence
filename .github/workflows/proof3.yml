name: e04-codex-linux-proof3
on:
  push:
    branches: ['ops/codex-epoch04-proof3-20261009']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: run suites
        run: |
          set +e
          python3 --version | tee py.txt
          find l12r3c gate4 veto2 reg_l12 reg_veto -type f \( -name '*.py' -o -name '*.service' \) -print0 | sort -z | xargs -0 sha256sum > SOURCES.sha256
          (cd l12r3c && python3 -B -s -m unittest -v test_ledger_delta.py test_outer_delta.py test_parent_loss_delta.py) > l12r3c.log 2>&1; e1=$?
          (cd gate4 && python3 -B -s -m unittest -v test_phase_delta.py test_session_window_delta.py) > gate4.log 2>&1; e2=$?
          (cd veto2 && python3 -B -s -m unittest -v test_veto_delta_r2.py) > veto2.log 2>&1; e3=$?
          (cd reg_l12 && python3 -B -s -m unittest -v test_finite_batch.py test_image_capacity_gate.py test_bootstrap_delta.py) > reg_l12.log 2>&1; e4=$?
          (cd reg_veto && python3 -B -s -m unittest -v test_veto_emitter.py) > reg_veto.log 2>&1; e5=$?
          python3 - "$e1" "$e2" "$e3" "$e4" "$e5" <<'PY'
          import json,sys,hashlib,platform,re
          def tail(p):
              t=open(p).read(); m=re.findall(r'^Ran (\d+) tests?',t,re.M); return {'ran':int(m[-1]) if m else None,'ok':t.rstrip().endswith('OK'),'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest()}
          e=list(map(int,sys.argv[1:]))
          names=['l12r3c','gate4','veto2','reg_l12','reg_veto']
          r={'schema':'FABLE_E04_CODEX_LINUX_PROOF_V3','python':platform.python_version(),'platform':platform.platform(),
             'sources_sha256':hashlib.sha256(open('SOURCES.sha256','rb').read()).hexdigest(),'informative_only':['reg_l12','reg_veto']}
          for n,x in zip(names,e): r[n]={'exit':x,**tail(n+'.log')}
          r['pass']=all(r[n]['exit']==0 for n in names[:3])
          open('RESULT.json','w').write(json.dumps(r,sort_keys=True,indent=1)); print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e04-proof3
          path: |
            RESULT.json
            SOURCES.sha256
            py.txt
            *.log
      - name: fail if required suites failed
        run: python3 -c "import json,sys; sys.exit(0 if json.load(open('RESULT.json'))['pass'] else 1)"
