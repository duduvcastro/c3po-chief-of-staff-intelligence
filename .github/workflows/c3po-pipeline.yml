name: C3PO pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to validate and deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: c3po-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYRIGHT_VERSION: "1.1.411"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"

jobs:
  sensitive-files:
    name: Sensitive files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Reject credentials and private runtime data
        run: python3 .github/scripts/check_sensitive_files.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Install pinned gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the working tree for secret material
        run: ./gitleaks dir . --no-banner --redact --config .gitleaks.toml

      - name: Prove the scanner still catches adversarial fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/adversarial"
          printf 'LEAKED_API_KEY=ghp_%s%s\n' 'AbCdEfGh12345678' 'IjKlMnOp90QrStUv' \
            > "$RUNNER_TEMP/adversarial/leaked.env.example"
          printf 'PAYMENT_API_KEY="%s%s"\n' 'a1b2c3d4e5f6a7b8' 'c9d0e1f2a3b4c5d6' \
            > "$RUNNER_TEMP/adversarial/constants.py"
          if ./gitleaks dir "$RUNNER_TEMP/adversarial" --no-banner --redact --config .gitleaks.toml; then
            echo "::error::adversarial fixtures were NOT detected - the allowlist is too wide"
            exit 1
          fi
          echo "both adversarial fixtures correctly detected"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c3po/backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: c3po/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: pytest -q

  python-type-check:
    name: Python type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c3po/backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: c3po/backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Pyright
        run: npm install --global pyright@${PYRIGHT_VERSION}

      - name: Run type check
        run: pyright --pythonpath "$(command -v python)"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c3po/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Validate production Docker images
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          docker build \
            --file c3po/backend/Dockerfile \
            --tag c3po/backend:pr-validation \
            c3po
          docker build \
            --file c3po/frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_C3PO_API_URL= \
            --build-arg "NEXT_PUBLIC_C3PO_BUILD_SHA=$GITHUB_SHA" \
            --tag c3po/web:pr-validation \
            c3po/frontend

  deploy-production:
    name: Deploy production
    needs: [sensitive-files, secret-scan, backend-tests, python-type-check, frontend-build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Record deployment revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build production images outside the server
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          docker build \
            --file c3po/backend/Dockerfile \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag c3po/backend:production \
            c3po
          docker build \
            --file c3po/frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_C3PO_API_URL= \
            --build-arg "NEXT_PUBLIC_C3PO_BUILD_SHA=$REVISION" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag c3po/web:production \
            c3po/frontend
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' c3po/backend:production)" = "$REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' c3po/web:production)" = "$REVISION"

      - name: Package production images
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          docker save c3po/backend:production c3po/web:production \
            | gzip -1 > "/tmp/c3po-images-$REVISION.tar.gz"
          sha256sum "/tmp/c3po-images-$REVISION.tar.gz" \
            > "/tmp/c3po-images-$REVISION.tar.gz.sha256"

      - name: Package tracked source
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: git archive --format=tar.gz --output="/tmp/c3po-release-$REVISION.tar.gz" HEAD

      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          scp -i ~/.ssh/c3po_deploy \
            "/tmp/c3po-release-${{ steps.revision.outputs.sha }}.tar.gz" \
            "/tmp/c3po-images-${{ steps.revision.outputs.sha }}.tar.gz" \
            "/tmp/c3po-images-${{ steps.revision.outputs.sha }}.tar.gz.sha256" \
            "$USER@$HOST:/tmp/"

      - name: Stage push and Watch alert configuration
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
          PUSH_PRIVATE: ${{ secrets.C3PO_PUSH_VAPID_PRIVATE_KEY }}
          PUSH_PUBLIC: ${{ secrets.C3PO_PUSH_VAPID_PUBLIC_KEY }}
          NTFY_AUTH_USERS: ${{ secrets.C3PO_NTFY_AUTH_USERS }}
          NTFY_TOPIC: ${{ secrets.C3PO_NTFY_TOPIC }}
          NTFY_PUBLISH_TOKEN: ${{ secrets.C3PO_NTFY_PUBLISH_TOKEN }}
          NTFY_SUBSCRIBE_TOKEN: ${{ secrets.C3PO_NTFY_SUBSCRIBE_TOKEN }}
        run: |
          test -n "$PUSH_PRIVATE"
          test -n "$PUSH_PUBLIC"
          test -n "$NTFY_AUTH_USERS"
          test -n "$NTFY_TOPIC"
          test -n "$NTFY_PUBLISH_TOKEN"
          test -n "$NTFY_SUBSCRIBE_TOKEN"
          umask 077
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import shlex

          values = {
              "C3PO_PUSH_VAPID_PRIVATE_KEY": os.environ["PUSH_PRIVATE"],
              "C3PO_PUSH_VAPID_PUBLIC_KEY": os.environ["PUSH_PUBLIC"],
              "C3PO_NTFY_BASE_URL": "https://ntfy.eduardocastro.com.br",
              "C3PO_NTFY_TOPIC": os.environ["NTFY_TOPIC"],
              "C3PO_NTFY_PUBLISH_TOKEN": os.environ["NTFY_PUBLISH_TOKEN"],
          }
          if any("\n" in value or "\r" in value for value in values.values()):
              raise SystemExit("notification secrets must be single-line values")
          if not re.fullmatch(r"[A-Za-z0-9_-]{16,128}", values["C3PO_NTFY_TOPIC"]):
              raise SystemExit("C3PO_NTFY_TOPIC has an invalid format")
          token_pattern = re.compile(r"tk_[A-Za-z0-9]{29}")
          publish_token = values["C3PO_NTFY_PUBLISH_TOKEN"]
          subscribe_token = os.environ["NTFY_SUBSCRIBE_TOKEN"]
          if not token_pattern.fullmatch(publish_token):
              raise SystemExit("C3PO_NTFY_PUBLISH_TOKEN has an invalid format")
          if not token_pattern.fullmatch(subscribe_token) or subscribe_token == publish_token:
              raise SystemExit("C3PO_NTFY_SUBSCRIBE_TOKEN must be valid and distinct")
          auth_users = os.environ["NTFY_AUTH_USERS"]
          if "\n" in auth_users or "\r" in auth_users:
              raise SystemExit("C3PO_NTFY_AUTH_USERS must be a single-line value")

          pathlib.Path("/tmp/c3po-notifications.env").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          topic = values["C3PO_NTFY_TOPIC"]
          ntfy_values = {
              "NTFY_AUTH_USERS": auth_users,
              "NTFY_AUTH_ACCESS": f"c3po-publisher:{topic}:wo,dudu-devices:{topic}:ro",
              "NTFY_AUTH_TOKENS": (
                  f"c3po-publisher:{publish_token}:c3po-backend,"
                  f"dudu-devices:{subscribe_token}:apple-devices"
              ),
          }
          pathlib.Path("/tmp/c3po-ntfy.env").write_text(
              "".join(f"{key}={shlex.quote(value)}\n" for key, value in ntfy_values.items()),
              encoding="utf-8",
          )
          PY
          scp -i ~/.ssh/c3po_deploy \
            /tmp/c3po-notifications.env \
            "$USER@$HOST:/tmp/c3po-notifications-${{ steps.revision.outputs.sha }}.env"
          scp -i ~/.ssh/c3po_deploy \
            /tmp/c3po-ntfy.env \
            "$USER@$HOST:/tmp/c3po-ntfy-${{ steps.revision.outputs.sha }}.env"
          rm -f /tmp/c3po-notifications.env /tmp/c3po-ntfy.env

      - name: Deploy and verify
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "REVISION='$REVISION' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR=/opt/chief-of-staff-digital
          ARCHIVE="/tmp/c3po-release-${REVISION}.tar.gz"
          IMAGE_ARCHIVE="/tmp/c3po-images-${REVISION}.tar.gz"
          IMAGE_SHA256="${IMAGE_ARCHIVE}.sha256"
          RELEASE_DIR="/tmp/c3po-release-${REVISION}"
          NOTIFICATION_ENV="/tmp/c3po-notifications-${REVISION}.env"
          NTFY_ENV="/tmp/c3po-ntfy-${REVISION}.env"
          PREVIOUS_REVISION=$(cat "$APP_DIR/.deploy-version" 2>/dev/null || printf 'unknown')

          cd /tmp
          sha256sum --check "$IMAGE_SHA256"

          current_backend=$(docker inspect --format '{{.Image}}' \
            "$(docker compose --env-file "$APP_DIR/.env" -f "$APP_DIR/c3po/compose.yml" ps -q api)" \
            2>/dev/null || true)
          current_web=$(docker inspect --format '{{.Image}}' \
            "$(docker compose --env-file "$APP_DIR/.env" -f "$APP_DIR/c3po/compose.yml" ps -q web)" \
            2>/dev/null || true)
          docker image rm c3po/backend:rollback c3po/web:rollback >/dev/null 2>&1 || true
          if [ -n "$current_backend" ]; then
            docker image tag "$current_backend" c3po/backend:rollback
          fi
          if [ -n "$current_web" ]; then
            docker image tag "$current_web" c3po/web:rollback
          fi

          gzip -dc "$IMAGE_ARCHIVE" | docker load
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' c3po/backend:production)" = "$REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' c3po/web:production)" = "$REVISION"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

          rsync -a --delete \
            --exclude='.env' \
            --exclude='.deploy-version' \
            --exclude='.deployments/' \
            --exclude='output/' \
            --exclude='outputs/' \
            --exclude='tmp/' \
            --exclude='c3po/data/' \
            --exclude='c3po/ntfy.env' \
            --exclude='whatsapp_session/' \
            "$RELEASE_DIR/" "$APP_DIR/"

          python3 - "$APP_DIR/.env" "$NOTIFICATION_ENV" "$NTFY_ENV" "$APP_DIR/c3po/ntfy.env" <<'PY'
          import pathlib
          import shutil
          import sys

          target = pathlib.Path(sys.argv[1])
          staged = pathlib.Path(sys.argv[2])
          updates = dict(
              line.split("=", 1)
              for line in staged.read_text(encoding="utf-8").splitlines()
              if line and "=" in line
          )
          existing = target.read_text(encoding="utf-8").splitlines()
          output = []
          seen = set()
          for line in existing:
              key = line.split("=", 1)[0] if "=" in line else ""
              if key in updates:
                  output.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  output.append(line)
          for key, value in updates.items():
              if key not in seen:
                  output.append(f"{key}={value}")
          target.write_text("\n".join(output) + "\n", encoding="utf-8")
          target.chmod(0o600)
          staged.unlink()

          ntfy_staged = pathlib.Path(sys.argv[3])
          ntfy_target = pathlib.Path(sys.argv[4])
          ntfy_target.parent.mkdir(parents=True, exist_ok=True)
          with ntfy_staged.open("rb") as source, ntfy_target.open("wb") as destination:
              shutil.copyfileobj(source, destination)
          ntfy_target.chmod(0o600)
          ntfy_staged.unlink()
          PY

          cd "$APP_DIR"
          docker pull binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
          docker compose --env-file .env -f docker-compose.yml exec -T caddy \
            caddy validate --config /etc/caddy/Caddyfile
          C3PO_BUILD_SHA="$REVISION" docker compose --env-file .env -f c3po/compose.yml config --quiet
          C3PO_BUILD_SHA="$REVISION" docker compose --env-file .env -f c3po/compose.yml up -d --no-build
          docker compose --env-file .env -f docker-compose.yml exec -T caddy \
            caddy reload --config /etc/caddy/Caddyfile

          # Each service initializes the idempotent schema under one advisory lock.
          # Allow a cold, serialized startup to finish before declaring the deploy bad.
          healthy=false
          for attempt in $(seq 1 90); do
            web_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
            api_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/health || true)
            ntfy_status=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose --env-file .env -f c3po/compose.yml ps -q ntfy)" \
              2>/dev/null || true)
            if [ "$web_code" = "200" ] \
              && { [ "$api_code" = "200" ] || [ "$api_code" = "401" ]; } \
              && [ "$ntfy_status" = "healthy" ]; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [ "$healthy" = true ]; then
            unauthenticated_publish_code=$(
              docker compose --env-file .env -f c3po/compose.yml exec -T api \
                python -c 'import httpx; print(httpx.post("http://c3po-ntfy:80/c3po-deny-probe", content=b"probe", timeout=2).status_code)'
            )
            case "$unauthenticated_publish_code" in
              401|403) ;;
              *)
                echo "ntfy deny-all gate failed" >&2
                healthy=false
                ;;
            esac
          fi

          if [ "$healthy" = true ]; then
            printf '%s\n' "$REVISION" > .deploy-version
            rm -rf "$RELEASE_DIR" "$ARCHIVE" "$IMAGE_ARCHIVE" "$IMAGE_SHA256"
            docker image prune --force >/dev/null
            docker builder prune --force >/dev/null
            exit 0
          fi

          echo "health gate failed; restoring the prior container images" >&2
          if docker image inspect c3po/backend:rollback c3po/web:rollback >/dev/null 2>&1; then
            docker image tag c3po/backend:rollback c3po/backend:production
            docker image tag c3po/web:rollback c3po/web:production
            C3PO_BUILD_SHA="$PREVIOUS_REVISION" docker compose --env-file .env -f c3po/compose.yml up -d --no-build
            rollback_healthy=false
            for attempt in $(seq 1 60); do
              web_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
              api_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/health || true)
              if [ "$web_code" = "200" ] && { [ "$api_code" = "200" ] || [ "$api_code" = "401" ]; }; then
                rollback_healthy=true
                break
              fi
              sleep 5
            done
            if [ "$rollback_healthy" = true ]; then
              echo "rollback health gate restored the prior images" >&2
            else
              echo "rollback images loaded but health gate did not recover" >&2
            fi
          else
            echo "rollback images are unavailable" >&2
          fi

          docker compose --env-file .env -f c3po/compose.yml ps
          docker compose --env-file .env -f c3po/compose.yml logs --tail=120 api web ntfy
          exit 1
          REMOTE
