name: C3PO pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to validate and deploy
        required: true
        default: main
        type: string
      deploy:
        description: Deploy after validation
        required: true
        default: true
        type: boolean
      remediation:
        description: Require zero fixable critical/high findings
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: c3po-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYRIGHT_VERSION: "1.1.411"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"

jobs:
  sensitive-files:
    name: Sensitive files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Reject credentials and private runtime data
        run: python3 .github/scripts/check_sensitive_files.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Install pinned gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the working tree for secret material
        run: ./gitleaks dir . --no-banner --redact --config .gitleaks.toml

      - name: Prove the scanner still catches adversarial fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/adversarial"
          printf 'LEAKED_API_KEY=ghp_%s%s\n' 'AbCdEfGh12345678' 'IjKlMnOp90QrStUv' \
            > "$RUNNER_TEMP/adversarial/leaked.env.example"
          printf 'PAYMENT_API_KEY="%s%s"\n' 'a1b2c3d4e5f6a7b8' 'c9d0e1f2a3b4c5d6' \
            > "$RUNNER_TEMP/adversarial/constants.py"
          if ./gitleaks dir "$RUNNER_TEMP/adversarial" --no-banner --redact --config .gitleaks.toml; then
            echo "::error::adversarial fixtures were NOT detected - the allowlist is too wide"
            exit 1
          fi
          echo "both adversarial fixtures correctly detected"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c3po/backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: c3po/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: pytest -q

  python-type-check:
    name: Python type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c3po/backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: c3po/backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Pyright
        run: npm install --global pyright@${PYRIGHT_VERSION}

      - name: Run type check
        run: pyright --pythonpath "$(command -v python)"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c3po/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Derive the container security rebuild token
        working-directory: ${{ github.workspace }}
        run: |
          token=$(sha256sum c3po/security/container-rebuild-trigger.json | cut -d ' ' -f 1)
          printf 'C3PO_SECURITY_REBUILD=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Verify deterministic security lockfile
        if: github.event_name == 'workflow_dispatch' && inputs.remediation && startsWith(github.ref_name, 'automation/dependency-security-')
        run: |
          git fetch --no-tags origin main
          python3 ../../scripts/c3po_dependency_security.py --root ../.. --verify-lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency fixes against current advisories
        if: github.event_name == 'workflow_dispatch' && inputs.remediation && startsWith(github.ref_name, 'automation/dependency-security-')
        run: |
          rc=0
          pnpm audit --json > "$RUNNER_TEMP/dependency-audit.json" || rc=$?
          test "$rc" -le 1
          python3 ../../scripts/c3po_dependency_security.py --root ../.. \
            --audit-result "$RUNNER_TEMP/dependency-audit.json"

      - name: Test browser telemetry privacy and limits
        run: node --experimental-strip-types --test tests/sentry-privacy.test.mjs

      - name: Test company logo identities
        run: pnpm test:logos

      - name: Test portfolio acquisition cost
        run: pnpm test:portfolio

      - name: Build frontend
        env:
          # Synthetic ingestion identifier: exercises enabled SDK/CSP compilation.
          # Static builds do not initialize the browser SDK or send events.
          NEXT_PUBLIC_SENTRY_DSN: https://012345abcdef@o123.ingest.us.sentry.io/456
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0.01"
        run: pnpm build

      - name: Validate production Docker images
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.remediation)
        working-directory: ${{ github.workspace }}
        run: |
          docker build \
            --file c3po/backend/Dockerfile \
            --build-arg "C3PO_SECURITY_REBUILD=$C3PO_SECURITY_REBUILD" \
            --tag c3po/backend:pr-validation \
            c3po
          docker build \
            --file c3po/frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_C3PO_API_URL= \
            --build-arg "NEXT_PUBLIC_C3PO_BUILD_SHA=$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=https://012345abcdef@o123.ingest.us.sentry.io/456 \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=ci \
            --build-arg NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=0.01 \
            --build-arg "C3PO_SECURITY_REBUILD=$C3PO_SECURITY_REBUILD" \
            --tag c3po/web:pr-validation \
            c3po/frontend
          docker build \
            --file c3po/database/Dockerfile \
            --build-arg "C3PO_SECURITY_REBUILD=$C3PO_SECURITY_REBUILD" \
            --tag c3po/database:pr-validation \
            c3po
          docker run --rm --entrypoint gosu c3po/database:pr-validation \
            nobody true

      - name: Exercise the backend image runtime (Alpine)
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.remediation)
        working-directory: ${{ github.workspace }}
        # `shell: bash` runs with `-eo pipefail`, so a failing docker/pip/smoke/
        # pytest producer fails the step even though the output goes through tee.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backend-runtime"
          docker image inspect c3po/backend:pr-validation \
            > "$RUNNER_TEMP/backend-runtime/image-inspect.json"
          docker image inspect c3po/backend:pr-validation --format '{{.Id}} {{.Architecture}} {{.Os}}' \
            | tee "$RUNNER_TEMP/backend-runtime/image-id.txt"
          # `pip check` runs at build time (Dockerfile); the runtime image must not carry pip at all.
          docker run --rm --network none --entrypoint python c3po/backend:pr-validation \
            -B -c 'import importlib.util, sys; absent = importlib.util.find_spec("pip") is None; print("pip check ran at build time; pip absent from runtime image:", absent); sys.exit(0 if absent else 1)' \
            | tee "$RUNNER_TEMP/backend-runtime/pip-check.log"
          docker run --rm --network none --entrypoint python \
            -e PYTHONPATH=/app \
            -e C3PO_SMOKE_NON_PRODUCTION=1 \
            -e "C3PO_SMOKE_SOURCE_HEAD=$GITHUB_SHA" \
            c3po/backend:pr-validation -B /app/tests/alpine_runtime_smoke.py \
            | tee "$RUNNER_TEMP/backend-runtime/smoke.json"
          docker run --rm --network none --entrypoint python \
            --volume "$GITHUB_WORKSPACE:/legacy:ro" --workdir /app \
            c3po/backend:pr-validation \
            -B -m pytest -q -p no:cacheprovider --import-mode=importlib -o pythonpath=/app \
            /legacy/c3po/backend/tests/test_api.py \
            /legacy/c3po/backend/tests/test_read_cache.py \
            /legacy/c3po/backend/tests/test_r2d2_risk_monitor.py \
            /legacy/c3po/backend/tests/test_r2d2_delayed_quote_protection.py \
            /legacy/c3po/backend/tests/test_market_data.py \
            /legacy/c3po/backend/tests/test_r2d2_exit_policy_truth.py \
            | tee "$RUNNER_TEMP/backend-runtime/pytest.log"

      - name: Exercise the Massive supervisor unit against the backend image
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.remediation)
        working-directory: ${{ github.workspace }}
        # Renders ExecStartPre and ExecStart from the repository unit template and runs
        # them on a real engine with no network, no token and no manifest: the image
        # check must print the pinned ID, and the supervisor must refuse with 78 before
        # any claim. Outside the session window the refusal is SUPERVISOR_SESSION/WINDOW;
        # inside it the missing dated manifest refuses first. The run uses --init, so
        # the engine must provide docker-init.
        # Every guard is explicit (`|| exit 1`); nothing here relies on `set -e`.
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/backend-runtime"
          mkdir -p "$out" || exit 1
          [ -x /usr/bin/docker ] || { echo "docker is not at /usr/bin/docker" >&2; exit 1; }
          id="$(docker image inspect --format '{{.Id}}' c3po/backend:pr-validation)" || exit 1
          [[ "$id" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected image id: $id" >&2; exit 1; }
          base="$(sudo mktemp -d)" || exit 1
          [[ "$base" == /* && "$base" != *@* ]] || exit 1
          sudo install -d -m 0700 -o 0 -g 0 "$base/data/journal" "$base/state" "$base/etc" \
            "$base/etc/manifests" "$base/etc/docker-cli" || exit 1
          init="$(docker info --format '{{.InitBinary}}')" || exit 1
          [ -n "$init" ] || { echo "the engine reports no init binary" >&2; exit 1; }
          echo "engine init binary: $init"
          python3 - "$id" "$base" "$out" <<'PY' || exit 1
          import re, shlex, sys
          image, base, out = sys.argv[1:]
          unit = open("c3po/deployment/massive-supervisor/c3po-massive.service", encoding="utf-8").read()
          joined = unit.replace("\\\n", " ").splitlines()
          lines = [line for line in joined if line.startswith("ExecStart=")]
          checks = [line for line in joined if line.startswith("ExecStartPre=/")]
          values = {
              "@IMAGE_ID@": image,
              "@HOST_JOURNAL_ROOT@": base + "/data/journal",
              "@CONTAINER_JOURNAL_ROOT@": "/app/day-d-data/r2d2-v2-massive-epoch03",
              "@HOST_STATE_ROOT@": base + "/state",
              "@HOST_CONFIG_DIR@": base + "/etc",
              "@NETWORK@": "none",
          }
          if len(lines) != 1 or set(re.findall(r"@[A-Z_]+@", unit)) != set(values):
              sys.exit("unit template no longer matches the six documented substitutions")
          if len(checks) != 1:
              sys.exit("unit template no longer has exactly one mandatory ExecStartPre")
          def render(command):
              for name, value in values.items():
                  command = command.replace(name, value)
              if "@" in command:
                  sys.exit("a placeholder survived the render")
              return shlex.split(command)
          argv = render(lines[0][len("ExecStart="):])
          check = render(checks[0][len("ExecStartPre="):])
          if argv[:2] != ["/usr/bin/docker", "run"] or argv.count(image) != 1 or "--init" not in argv:
              sys.exit("rendered ExecStart is not a docker run --init of the pinned image id")
          if check != ["/usr/bin/docker", "image", "inspect", "--format", "{{.Id}}", image]:
              sys.exit("rendered ExecStartPre is not the image check of the pinned image id")
          for name, value in (("supervisor-argv.bin", argv), ("supervisor-check-argv.bin", check)):
              with open(out + "/" + name, "w", encoding="utf-8") as output:
                  output.write("\0".join(value) + "\0")
          PY
          mapfile -d '' -t argv < "$out/supervisor-argv.bin" || exit 1
          mapfile -d '' -t check < "$out/supervisor-check-argv.bin" || exit 1
          [ "${#argv[@]}" -ge 30 ] || { echo "rendered ExecStart is too short" >&2; exit 1; }
          [ "${#check[@]}" -eq 6 ] || { echo "rendered ExecStartPre has the wrong length" >&2; exit 1; }
          printf '%q ' "${argv[@]}" > "$out/supervisor-command.txt" || exit 1
          seen="$(sudo env "DOCKER_CONFIG=$base/etc/docker-cli" "${check[@]}")" || { echo "the rendered image check failed" >&2; exit 1; }
          [ "$seen" = "$id" ] || { echo "the rendered image check printed $seen, expected $id" >&2; exit 1; }
          absent="sha256:$(printf '%064d' 0)" || exit 1
          if sudo env "DOCKER_CONFIG=$base/etc/docker-cli" "${check[@]:0:5}" "$absent" > /dev/null 2>&1; then
            echo "the image check accepted an image id that does not exist" >&2; exit 1
          fi
          rc=0
          sudo env "DOCKER_CONFIG=$base/etc/docker-cli" "${argv[@]}" \
            > "$out/supervisor-stdout.log" 2> "$out/supervisor-stderr.log" || rc=$?
          cat "$out/supervisor-stdout.log" || exit 1
          cat "$out/supervisor-stderr.log" >&2 || exit 1
          echo "supervisor exit status: $rc" | tee "$out/supervisor-exit.txt" || exit 1
          [ "$rc" -eq 78 ] || { echo "expected the terminal refusal 78, got $rc" >&2; exit 1; }
          python3 - "$out/supervisor-stdout.log" <<'PY' || exit 1
          import json, sys
          lines = open(sys.argv[1], encoding="utf-8").read().splitlines()
          if len(lines) != 1:
              sys.exit("expected exactly one stdout line, got %d" % len(lines))
          event = json.loads(lines[0])
          expected = {"status": "DATA_GAP", "reason": "SUPERVISOR_REFUSED", "provider_connected": False, "restart_allowed": False}
          codes = {"SUPERVISOR_SESSION", "SUPERVISOR_WINDOW", "SUPERVISOR_FILE_UNAVAILABLE"}
          if any(event.get(key) != value for key, value in expected.items()) or event.get("code") not in codes:
              sys.exit("unexpected refusal receipt")
          PY
          left="$(sudo find "$base/state" "$base/data/journal" -mindepth 1)" || exit 1
          [ -z "$left" ] || { echo "refusal left a claim or a journal object" >&2; exit 1; }
          containers="$(docker ps -a --filter 'name=^c3po-massive$' -q)" || exit 1
          [ -z "$containers" ] || { echo "leftover c3po-massive container" >&2; exit 1; }

      - name: Render the compose capacity mount on a real engine
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.remediation)
        working-directory: ${{ github.workspace }}
        # `docker compose config` loads, interpolates and validates the project with the
        # command form the deploy uses. The empty root .env stands in for the host file
        # (Compose needs it for --env-file and for env_file) and is removed again. Three
        # host states are rendered: variable unset, variable empty, variable set to an
        # example path; a bare word must be refused. With a path the placeholder volume
        # is unused, and Compose leaves unused top-level volumes out of the render: the
        # checker requires the declaration only for the placeholder states.
        # This proves the render only. `config` creates nothing, so the step cannot show
        # what `up` creates on a host (the placeholder volume, a bind source): that is
        # first measured by the read-back after the deploy. It proves nothing about the
        # capacity tree, the capacity settings or the planner either.
        # Every guard is explicit (`|| exit 1`); nothing here relies on `set -e`.
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/backend-runtime"
          check=c3po/deployment/capacity-mount/check_compose_render.py
          var=C3PO_R2D2_V2_CAPACITY_MOUNT_SOURCE
          example=/srv/example-capacity-tree
          compose=(docker compose --env-file .env -f c3po/compose.yml)
          mkdir -p "$out" || exit 1
          [ ! -e .env ] || { echo "unexpected .env in the workspace" >&2; exit 1; }
          trap 'rm -f .env' EXIT
          : > .env || exit 1
          docker compose version | tee "$out/compose-version.txt" || exit 1
          env -u "$var" "${compose[@]}" config --format json > "$out/compose-capacity-unset.json" || exit 1
          env "$var=" "${compose[@]}" config --format json > "$out/compose-capacity-empty.json" || exit 1
          env "$var=$example" "${compose[@]}" config --format json > "$out/compose-capacity-bind.json" || exit 1
          python3 "$check" placeholder "$out/compose-capacity-unset.json" || exit 1
          python3 "$check" placeholder "$out/compose-capacity-empty.json" || exit 1
          python3 "$check" "bind=$example" "$out/compose-capacity-bind.json" || exit 1
          if env "$var=not-a-path" "${compose[@]}" config --quiet 2> "$out/compose-capacity-bare-word.err"; then
            echo "a bare word was accepted as the capacity mount source" >&2
            exit 1
          fi
          cat "$out/compose-capacity-bare-word.err" || exit 1

      - name: Exercise the reader unit refusal against the backend image
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.remediation)
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        # Renders the reader unit template (ExecCondition, ExecStartPre, ExecStart, ExecStop)
        # and runs the image check and the start on a real engine with no network and no
        # database: throwaway root-owned 0700 directories; data, journal and capacity are bound
        # read-only, the journal one at the container journal root that pins.env names, and of
        # the configuration directory only its launcher subdirectory is bound, read-only (the
        # configuration directory itself is never mounted); the three environment files have
        # both collection flags off.
        # The journal directory is empty and nothing opens it here. The launcher must end
        # in 78 with exactly one REFUSED line: READER_SESSION or READER_WINDOW outside the
        # session windows of the epoch, READER_DISABLED inside one. A second start with
        # another launcher hash in pins.env must end in READER_LAUNCHER_PIN: the pin file
        # reaches the process, and the launcher hashes the bytes it was mounted with.
        # The step reads nothing private: the database line of the smoke carries no value.
        # Every guard is explicit; nothing here relies on `set -e`.
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/backend-runtime"
          mkdir -p "$out" || exit 1
          show() {
            local item
            for item in "$out"/reader-refusal-*.txt "$out"/reader-refusal-*.log; do
              [ -f "$item" ] || continue
              echo "----- $item"; cat "$item"; echo
            done
          }
          fail() { echo "$1" >&2; show >&2; exit 1; }
          launcher=c3po/deployment/reader/reader_launcher.py
          [ -x /usr/bin/docker ] || fail "docker is not at /usr/bin/docker"
          [ -f "$launcher" ] || fail "the reader launcher is not in the checkout"
          id="$(docker image inspect --format '{{.Id}}' c3po/backend:pr-validation)" || fail "the validation image is absent"
          [[ "$id" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "unexpected image id: $id"
          pin="$(sha256sum "$launcher" | cut -d ' ' -f 1)" || fail "the launcher could not be hashed"
          [[ "$pin" =~ ^[0-9a-f]{64}$ ]] || fail "unexpected launcher hash"
          echo "$pin" > "$out/reader-refusal-launcher-sha256.txt" || fail "the launcher hash could not be recorded"
          stage="$(mktemp -d)" || fail "no staging directory"
          base="$(sudo mktemp -d)" || fail "no throwaway directory"
          [[ "$base" == /* && "$base" != *@* ]] || fail "unusable throwaway directory"
          sudo install -d -m 0700 -o 0 -g 0 "$base/data" "$base/journal" "$base/capacity" "$base/etc" \
            "$base/etc/docker-cli" "$base/etc/launcher" || fail "the throwaway directories could not be created"
          python3 - "$id" "$base" "$out" "$stage" reader-refusal "$pin" false <<'PY' || fail "the reader unit could not be rendered"
          import re, shlex, sys
          image, base, out, stage, prefix, pin, flag = sys.argv[1:]
          if re.fullmatch(r"[0-9a-f]{64}", pin) is None or flag not in ("true", "false"):
              sys.exit("unexpected launcher hash or flag value")
          unit = open("c3po/deployment/reader/c3po-reader.service", encoding="utf-8").read()
          joined = unit.replace("\\\n", " ").splitlines()
          values = {
              "@IMAGE_ID@": image,
              "@HOST_DATA_ROOT@": base + "/data",
              "@HOST_JOURNAL_ROOT@": base + "/journal",
              "@CONTAINER_JOURNAL_ROOT@": "/c3po-journal",
              "@HOST_CAPACITY_ROOT@": base + "/capacity",
              "@HOST_CONFIG_DIR@": base + "/etc",
              "@NETWORK@": "none",
          }
          if set(re.findall(r"@[A-Z_]+@", unit)) != set(values):
              sys.exit("unit template no longer matches the seven documented substitutions")
          def rendered(key, lead, count):
              # Lines of one key whose command starts with `lead`; the optional-failure dash is not part of the command.
              found = [line[len(key) + 1:].lstrip("-") for line in joined if line.startswith(key + "=" + lead)]
              if len(found) != count:
                  sys.exit("unit template no longer has %d %s line(s) starting with '%s'" % (count, key, lead))
              result = []
              for command in found:
                  for name, value in values.items():
                      command = command.replace(name, value)
                  if "@" in command:
                      sys.exit("a placeholder survived the render")
                  result.append(shlex.split(command))
              return result
          argv, = rendered("ExecStart", "/", 1)
          check, = rendered("ExecStartPre", "/", 1)
          stop, = rendered("ExecStop", "-/", 1)
          files = [base + "/etc/" + name + ".env" for name in ("secret", "pins", "activation")]
          if argv[:2] != ["/usr/bin/docker", "run"] or argv.count(image) != 1 or "--init" not in argv:
              sys.exit("rendered ExecStart is not a docker run --init of the pinned image id")
          if argv[argv.index(image):] != [image, "python", "-I", "-B", "/c3po-reader/reader_launcher.py"]:
              sys.exit("rendered ExecStart does not end in the launcher command")
          if [argv[at + 1] for at, value in enumerate(argv) if value == "--env-file"] != files:
              sys.exit("rendered ExecStart does not read exactly the three environment files")
          # The journal is its own read-only bind, at the container path that pins.env names below; never under the data bind.
          binds = [(values["@HOST_DATA_ROOT@"], "/app/day-d-data"),
                   (values["@HOST_JOURNAL_ROOT@"], values["@CONTAINER_JOURNAL_ROOT@"]),
                   (values["@HOST_CAPACITY_ROOT@"], "/c3po-capacity"),
                   (values["@HOST_CONFIG_DIR@"] + "/launcher", "/c3po-reader")]
          if [argv[at + 1] for at, value in enumerate(argv) if value == "--mount"] != [
                  "type=bind,source=%s,target=%s,readonly" % bind for bind in binds]:
              sys.exit("rendered ExecStart does not have exactly the four read-only binds")
          if rendered("ExecCondition", "/", 3) != [["/usr/bin/test", "-f", path] for path in files]:
              sys.exit("rendered ExecCondition lines do not name the three environment files")
          if check != ["/usr/bin/docker", "image", "inspect", "--format", "{{.Id}}", image]:
              sys.exit("rendered ExecStartPre is not the image check of the pinned image id")
          if stop != ["/usr/bin/docker", "stop", "-t", "25", "c3po-reader"]:
              sys.exit("rendered ExecStop is not the stop of the reader container")
          for name, value in (("argv", argv), ("check-argv", check), ("stop-argv", stop)):
              with open(out + "/" + prefix + "-" + name + ".bin", "w", encoding="utf-8") as output:
                  output.write("\0".join(value) + "\0")
          # Synthetic, non-private values in the documented order of pins.env.
          zero = "0" * 64
          pins = [
              "C3PO_BUILD_SHA=" + zero[:40],
              "C3PO_R2D2_V2_SHADOW_RELEASE_FILE=/app/day-d-data/smoke/release.json",
              "C3PO_R2D2_V2_SHADOW_RELEASE_SHA=" + zero,
              "C3PO_R2D2_V2_SHADOW_SOURCE_DIR=/app/day-d-data/smoke/source",
              "C3PO_R2D2_MICROSTRUCTURE_RAW_DIR=/app/day-d-data/provider=eodhd/microstructure/raw",
              "C3PO_R2D2_V2_MASSIVE_JOURNAL_DIR=" + values["@CONTAINER_JOURNAL_ROOT@"],
              "C3PO_R2D2_V2_CAPACITY_REQUIRED=true",
              "C3PO_R2D2_V2_CAPACITY_VETO_MODE=DISPATCH_AND_DERIVATION_ONLY",
              "C3PO_R2D2_V2_CAPACITY_CONFIG_FILE=/c3po-capacity/config/smoke.json",
              "C3PO_R2D2_V2_CAPACITY_CONFIG_SHA=" + zero,
              "C3PO_R2D2_V2_SHADOW_POLL_SECONDS=1.0",
          ]
          def pinned(value):
              return "\n".join(pins + ["C3PO_READER_LAUNCHER_SHA256=" + value]) + "\n"
          database = "C3PO_DATABASE_URL=\n"
          flags = "".join("C3PO_R2D2_V2_%s_ENABLED=%s\n" % (name, flag) for name in ("SHADOW", "MASSIVE_BARS"))
          for name, body in (("secret", database), ("pins", pinned(pin)), ("pins-other", pinned(zero)), ("activation", flags)):
              with open(stage + "/" + name + ".env", "x", encoding="utf-8") as output:
                  output.write(body)
          PY
          mapfile -d '' -t argv < "$out/reader-refusal-argv.bin" || fail "the rendered ExecStart could not be read"
          mapfile -d '' -t check < "$out/reader-refusal-check-argv.bin" || fail "the rendered ExecStartPre could not be read"
          [ "${#argv[@]}" -ge 46 ] || fail "rendered ExecStart is too short"
          [ "${#check[@]}" -eq 6 ] || fail "rendered ExecStartPre has the wrong length"
          printf '%q ' "${argv[@]}" > "$out/reader-refusal-command.txt" || fail "the rendered command could not be recorded"
          sudo install -m 0600 -o 0 -g 0 "$launcher" "$base/etc/launcher/reader_launcher.py" || fail "the launcher could not be placed"
          for name in secret pins activation; do
            sudo install -m 0600 -o 0 -g 0 "$stage/$name.env" "$base/etc/$name.env" || fail "$name.env could not be placed"
            sudo /usr/bin/test -f "$base/etc/$name.env" || fail "the rendered condition on $name.env does not hold"
          done
          seen="$(sudo env "DOCKER_CONFIG=$base/etc/docker-cli" "${check[@]}")" || fail "the rendered image check failed"
          [ "$seen" = "$id" ] || fail "the rendered image check printed $seen, expected $id"
          refusal() {
            # $1 names the run, the rest are the codes it may end in.
            local name="$1" rc=0
            shift
            sudo env "DOCKER_CONFIG=$base/etc/docker-cli" "${argv[@]}" \
              > "$out/reader-refusal-$name-stdout.log" 2> "$out/reader-refusal-$name-stderr.log" || rc=$?
            echo "reader exit status ($name): $rc" > "$out/reader-refusal-$name-exit.txt" || return 1
            [ "$rc" -eq 78 ] || { echo "expected the terminal refusal 78, got $rc" >&2; return 1; }
            python3 - "$out/reader-refusal-$name-stdout.log" "$@" <<'PY' || return 1
          import json, sys
          lines = open(sys.argv[1], encoding="utf-8").read().splitlines()
          if len(lines) != 1:
              sys.exit("expected exactly one stdout line, got %d" % len(lines))
          event = json.loads(lines[0])
          if set(event) != {"status", "code", "restart_allowed", "session", "at"}:
              sys.exit("unexpected fields in the refusal notice")
          if event["status"] != "REFUSED" or event["restart_allowed"] is not False or event["code"] not in sys.argv[2:]:
              sys.exit("unexpected refusal notice")
          print("refusal code: " + event["code"])
          PY
            cat "$out/reader-refusal-$name-stdout.log" "$out/reader-refusal-$name-exit.txt" || return 1
          }
          refusal flags-off READER_SESSION READER_WINDOW READER_DISABLED || fail "the reader did not refuse as documented"
          sudo install -m 0600 -o 0 -g 0 "$stage/pins-other.env" "$base/etc/pins.env" || fail "pins.env could not be replaced"
          refusal other-pin READER_LAUNCHER_PIN || fail "another launcher hash in pins.env was not refused"
          left="$(sudo find "$base/data" "$base/journal" "$base/capacity" -mindepth 1)" || fail "the mount sources could not be listed"
          [ -z "$left" ] || fail "the refusal left an object in a mount source"
          containers="$(docker ps -a --filter 'name=^c3po-reader$' -q)" || fail "the containers could not be listed"
          [ -z "$containers" ] || fail "leftover c3po-reader container"

      - name: Exercise the reader stop against the backend image
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.remediation)
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        # Runs the rendered ExecStart of the reader unit on a real engine with one change:
        # the command is a driver that calls the launcher's own main() with its two test
        # seams, a clock frozen one hour before the open of the first session in the image
        # and a sleeping stand-in instead of the worker. Both flags are on (the constant
        # bytes of activation.env); no worker, no network and no database are involved.
        # Once the stand-in is visible in the container, the engine must list exactly the four
        # read-only binds of the rendered start, the journal one among them, and the rendered
        # ExecStop (docker stop) must end the start with exit 0, a STARTING and a STOPPED
        # notice with the child ended by SIGTERM and not killed, no container and no stand-in
        # process left. The journal directory is empty: the bind is listed, nothing opens it.
        # What it does not exercise: the worker itself, systemd, and the launcher's own
        # clock and phases (the refusal step above runs the unmodified command).
        # Every guard is explicit; nothing here relies on `set -e`.
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/backend-runtime"
          mkdir -p "$out" || exit 1
          show() {
            local item
            for item in "$out"/reader-stop-*.txt "$out"/reader-stop-*.log; do
              [ -f "$item" ] || continue
              echo "----- $item"; cat "$item"; echo
            done
          }
          fail() {
            echo "$1" >&2; show >&2
            docker rm --force c3po-reader > /dev/null 2>&1 || true
            exit 1
          }
          launcher=c3po/deployment/reader/reader_launcher.py
          marker=c3po-reader-stand-in-worker
          [ -x /usr/bin/docker ] || fail "docker is not at /usr/bin/docker"
          [ -f "$launcher" ] || fail "the reader launcher is not in the checkout"
          command -v pgrep > /dev/null || fail "pgrep is not available"
          id="$(docker image inspect --format '{{.Id}}' c3po/backend:pr-validation)" || fail "the validation image is absent"
          [[ "$id" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "unexpected image id: $id"
          pin="$(sha256sum "$launcher" | cut -d ' ' -f 1)" || fail "the launcher could not be hashed"
          [[ "$pin" =~ ^[0-9a-f]{64}$ ]] || fail "unexpected launcher hash"
          stage="$(mktemp -d)" || fail "no staging directory"
          base="$(sudo mktemp -d)" || fail "no throwaway directory"
          [[ "$base" == /* && "$base" != *@* ]] || fail "unusable throwaway directory"
          sudo install -d -m 0700 -o 0 -g 0 "$base/data" "$base/journal" "$base/capacity" "$base/etc" \
            "$base/etc/docker-cli" "$base/etc/launcher" || fail "the throwaway directories could not be created"
          python3 - "$id" "$base" "$out" "$stage" reader-stop "$pin" true <<'PY' || fail "the reader unit could not be rendered"
          import re, shlex, sys
          image, base, out, stage, prefix, pin, flag = sys.argv[1:]
          if re.fullmatch(r"[0-9a-f]{64}", pin) is None or flag not in ("true", "false"):
              sys.exit("unexpected launcher hash or flag value")
          unit = open("c3po/deployment/reader/c3po-reader.service", encoding="utf-8").read()
          joined = unit.replace("\\\n", " ").splitlines()
          values = {
              "@IMAGE_ID@": image,
              "@HOST_DATA_ROOT@": base + "/data",
              "@HOST_JOURNAL_ROOT@": base + "/journal",
              "@CONTAINER_JOURNAL_ROOT@": "/c3po-journal",
              "@HOST_CAPACITY_ROOT@": base + "/capacity",
              "@HOST_CONFIG_DIR@": base + "/etc",
              "@NETWORK@": "none",
          }
          if set(re.findall(r"@[A-Z_]+@", unit)) != set(values):
              sys.exit("unit template no longer matches the seven documented substitutions")
          def rendered(key, lead, count):
              # Lines of one key whose command starts with `lead`; the optional-failure dash is not part of the command.
              found = [line[len(key) + 1:].lstrip("-") for line in joined if line.startswith(key + "=" + lead)]
              if len(found) != count:
                  sys.exit("unit template no longer has %d %s line(s) starting with '%s'" % (count, key, lead))
              result = []
              for command in found:
                  for name, value in values.items():
                      command = command.replace(name, value)
                  if "@" in command:
                      sys.exit("a placeholder survived the render")
                  result.append(shlex.split(command))
              return result
          argv, = rendered("ExecStart", "/", 1)
          check, = rendered("ExecStartPre", "/", 1)
          stop, = rendered("ExecStop", "-/", 1)
          files = [base + "/etc/" + name + ".env" for name in ("secret", "pins", "activation")]
          if argv[:2] != ["/usr/bin/docker", "run"] or argv.count(image) != 1 or "--init" not in argv:
              sys.exit("rendered ExecStart is not a docker run --init of the pinned image id")
          if argv[argv.index(image):] != [image, "python", "-I", "-B", "/c3po-reader/reader_launcher.py"]:
              sys.exit("rendered ExecStart does not end in the launcher command")
          if [argv[at + 1] for at, value in enumerate(argv) if value == "--env-file"] != files:
              sys.exit("rendered ExecStart does not read exactly the three environment files")
          # The journal is its own read-only bind, at the container path that pins.env names below; never under the data bind.
          binds = [(values["@HOST_DATA_ROOT@"], "/app/day-d-data"),
                   (values["@HOST_JOURNAL_ROOT@"], values["@CONTAINER_JOURNAL_ROOT@"]),
                   (values["@HOST_CAPACITY_ROOT@"], "/c3po-capacity"),
                   (values["@HOST_CONFIG_DIR@"] + "/launcher", "/c3po-reader")]
          if [argv[at + 1] for at, value in enumerate(argv) if value == "--mount"] != [
                  "type=bind,source=%s,target=%s,readonly" % bind for bind in binds]:
              sys.exit("rendered ExecStart does not have exactly the four read-only binds")
          if rendered("ExecCondition", "/", 3) != [["/usr/bin/test", "-f", path] for path in files]:
              sys.exit("rendered ExecCondition lines do not name the three environment files")
          if check != ["/usr/bin/docker", "image", "inspect", "--format", "{{.Id}}", image]:
              sys.exit("rendered ExecStartPre is not the image check of the pinned image id")
          if stop != ["/usr/bin/docker", "stop", "-t", "25", "c3po-reader"]:
              sys.exit("rendered ExecStop is not the stop of the reader container")
          for name, value in (("argv", argv), ("check-argv", check), ("stop-argv", stop)):
              with open(out + "/" + prefix + "-" + name + ".bin", "w", encoding="utf-8") as output:
                  output.write("\0".join(value) + "\0")
          # Synthetic, non-private values in the documented order of pins.env.
          zero = "0" * 64
          pins = [
              "C3PO_BUILD_SHA=" + zero[:40],
              "C3PO_R2D2_V2_SHADOW_RELEASE_FILE=/app/day-d-data/smoke/release.json",
              "C3PO_R2D2_V2_SHADOW_RELEASE_SHA=" + zero,
              "C3PO_R2D2_V2_SHADOW_SOURCE_DIR=/app/day-d-data/smoke/source",
              "C3PO_R2D2_MICROSTRUCTURE_RAW_DIR=/app/day-d-data/provider=eodhd/microstructure/raw",
              "C3PO_R2D2_V2_MASSIVE_JOURNAL_DIR=" + values["@CONTAINER_JOURNAL_ROOT@"],
              "C3PO_R2D2_V2_CAPACITY_REQUIRED=true",
              "C3PO_R2D2_V2_CAPACITY_VETO_MODE=DISPATCH_AND_DERIVATION_ONLY",
              "C3PO_R2D2_V2_CAPACITY_CONFIG_FILE=/c3po-capacity/config/smoke.json",
              "C3PO_R2D2_V2_CAPACITY_CONFIG_SHA=" + zero,
              "C3PO_R2D2_V2_SHADOW_POLL_SECONDS=1.0",
          ]
          def pinned(value):
              return "\n".join(pins + ["C3PO_READER_LAUNCHER_SHA256=" + value]) + "\n"
          database = "C3PO_DATABASE_URL=\n"
          flags = "".join("C3PO_R2D2_V2_%s_ENABLED=%s\n" % (name, flag) for name in ("SHADOW", "MASSIVE_BARS"))
          for name, body in (("secret", database), ("pins", pinned(pin)), ("pins-other", pinned(zero)), ("activation", flags)):
              with open(stage + "/" + name + ".env", "x", encoding="utf-8") as output:
                  output.write(body)
          PY
          cat > "$stage/stop_driver.py" <<'PY' || fail "the driver could not be written"
          import importlib.util, os, sys
          from datetime import date, timedelta
          here = os.path.dirname(os.path.abspath(__file__))
          spec = importlib.util.spec_from_file_location("c3po_reader_launcher", os.path.join(here, "reader_launcher.py"))
          launcher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(launcher)
          sys.path.insert(0, launcher.APP_ROOT)
          from app.r2d2_v2_calendar import ShadowCalendar
          from app.r2d2_v2_epoch_assembler import SESSIONS
          # One hour before the open of the first session: inside the pre-open phase, for as long as the smoke runs.
          frozen = ShadowCalendar().details(date.fromisoformat(sorted(SESSIONS)[0]))["open"] - timedelta(hours=1)
          stand_in = [sys.executable, "-I", "-B", "-c", "import time; time.sleep(3600)", "c3po-reader-stand-in-worker"]
          raise SystemExit(launcher.main([], utcnow=lambda: frozen, child_argv=stand_in))
          PY
          mapfile -d '' -t argv < "$out/reader-stop-argv.bin" || fail "the rendered ExecStart could not be read"
          mapfile -d '' -t stop < "$out/reader-stop-stop-argv.bin" || fail "the rendered ExecStop could not be read"
          [ "${#argv[@]}" -ge 46 ] || fail "rendered ExecStart is too short"
          [ "${#stop[@]}" -eq 5 ] || fail "rendered ExecStop has the wrong length"
          last=$(( ${#argv[@]} - 1 ))
          [ "${argv[$last]}" = /c3po-reader/reader_launcher.py ] || fail "rendered ExecStart does not end in the launcher"
          argv[$last]=/c3po-reader/stop_driver.py
          printf '%q ' "${argv[@]}" > "$out/reader-stop-command.txt" || fail "the command could not be recorded"
          sudo install -m 0600 -o 0 -g 0 "$launcher" "$base/etc/launcher/reader_launcher.py" || fail "the launcher could not be placed"
          sudo install -m 0600 -o 0 -g 0 "$stage/stop_driver.py" "$base/etc/launcher/stop_driver.py" || fail "the driver could not be placed"
          for name in secret pins activation; do
            sudo install -m 0600 -o 0 -g 0 "$stage/$name.env" "$base/etc/$name.env" || fail "$name.env could not be placed"
          done
          sudo env "DOCKER_CONFIG=$base/etc/docker-cli" "${argv[@]}" \
            > "$out/reader-stop-stdout.log" 2> "$out/reader-stop-stderr.log" &
          runner=$!
          running=0
          for _ in $(seq 1 120); do
            if docker top c3po-reader > "$out/reader-stop-top.txt" 2> /dev/null \
              && [ "$(grep -c -- "$marker" "$out/reader-stop-top.txt")" -eq 1 ]; then
              running=1
              break
            fi
            sudo kill -0 "$runner" 2> /dev/null || break
            sleep 0.5
          done
          [ "$running" -eq 1 ] || fail "the stand-in child never appeared in the container"
          init="$(docker inspect --format '{{.HostConfig.Init}}' c3po-reader)" || fail "the container could not be inspected"
          [ "$init" = true ] || fail "the container does not run under docker-init"
          docker inspect --format '{{json .Mounts}}' c3po-reader > "$out/reader-stop-mounts.txt" \
            || fail "the mounts of the container could not be read"
          python3 - "$out/reader-stop-argv.bin" "$out/reader-stop-mounts.txt" <<'PY' || fail "the engine does not list the four read-only binds of the rendered unit"
          import json, sys
          argv = open(sys.argv[1], encoding="utf-8").read().split("\0")
          wanted = []
          for at, value in enumerate(argv):
              if value == "--mount":
                  fields = argv[at + 1].split(",")
                  pairs = dict(field.split("=", 1) for field in fields if "=" in field)
                  if set(pairs) != {"type", "source", "target"} or pairs["type"] != "bind":
                      sys.exit("a rendered mount is not a bind with a source and a target")
                  if [field for field in fields if "=" not in field] != ["readonly"]:
                      sys.exit("a rendered mount is not read-only")
                  wanted.append([pairs["source"], pairs["target"], False])
          # The engine's own list: every bind of the running container, with what it may write.
          listed = json.loads(open(sys.argv[2], encoding="utf-8").read())
          seen = [[item.get("Source"), item.get("Destination"), item.get("RW")] for item in listed if item.get("Type") == "bind"]
          if len(wanted) != 4 or sorted(map(json.dumps, seen)) != sorted(map(json.dumps, wanted)):
              sys.exit("the engine lists other binds than the rendered unit")
          PY
          started=$SECONDS
          sudo env "DOCKER_CONFIG=$base/etc/docker-cli" "${stop[@]}" > "$out/reader-stop-docker-stop.log" 2>&1 \
            || fail "the rendered ExecStop failed"
          rc=0
          wait "$runner" || rc=$?
          elapsed=$(( SECONDS - started ))
          echo "reader exit status after docker stop: $rc, after ${elapsed}s" > "$out/reader-stop-exit.txt" \
            || fail "the exit status could not be recorded"
          cat "$out/reader-stop-stdout.log" "$out/reader-stop-exit.txt" || fail "the notices could not be read"
          [ "$rc" -eq 0 ] || fail "expected exit 0 after docker stop, got $rc"
          [ "$elapsed" -lt 20 ] || fail "the stop took ${elapsed}s: the child was not ended by SIGTERM"
          python3 - "$out/reader-stop-stdout.log" "$pin" <<'PY' || fail "unexpected notices"
          import json, sys
          path, pin = sys.argv[1:]
          events = [json.loads(line) for line in open(path, encoding="utf-8").read().splitlines()]
          if [event.get("status") for event in events] != ["STARTING", "STOPPED"]:
              sys.exit("expected one STARTING and one STOPPED notice, got %d line(s)" % len(events))
          starting, stopped = events
          # Every value below reached the process through pins.env, and the notice exists only
          # because activation.env set both flags. Nothing here shows that secret.env was read.
          pins = {"phase": "PRE_OPEN", "build_sha": "0" * 40, "release_sha": "0" * 64, "capacity_config_sha": "0" * 64,
                  "capacity_required": True, "launcher_sha256": pin, "launcher_pinned": True}
          if any(starting.get(name) != value for name, value in pins.items()):
              sys.exit("the STARTING notice does not carry the pins of the environment files")
          ended = {"reason": "SIGNAL", "phase": "PRE_OPEN", "child_signal": "SIGTERM", "child_exit": None, "killed": False,
                   "status_lines": 0, "status_withheld": 0, "dropped_lines": 0}
          if any(stopped.get(name, "absent") != value for name, value in ended.items()):
              sys.exit("the STOPPED notice does not show a child ended by SIGTERM")
          PY
          containers="$(docker ps -a --filter 'name=^c3po-reader$' -q)" || fail "the containers could not be listed"
          [ -z "$containers" ] || fail "leftover c3po-reader container"
          if pgrep -f -- "$marker" > "$out/reader-stop-left.txt"; then
            fail "the stand-in child is still running"
          fi
          left="$(sudo find "$base/data" "$base/journal" "$base/capacity" -mindepth 1)" || fail "the mount sources could not be listed"
          [ -z "$left" ] || fail "the run left an object in a mount source"

      - name: Exercise the manifest writer off path against the backend image
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.remediation)
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        # Feeds the capacity-day manifest writer on standard input to `python -I -B -` in a
        # container of the validation image, with the option set its document prescribes for
        # the dispatch, no network, only the writable bind of the manifest directory, and the
        # shadow flag off. The script must find the application of the image, print exactly
        # one receipt line with REFUSED / MANIFEST_SHADOW_OFF, print nothing on standard
        # error, end in 3, and leave the manifest directory empty and no container.
        # Nothing private is read: the smoke has no database, no release and no capacity tree.
        # Every guard is explicit; nothing here relies on `set -e`.
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/backend-runtime"
          mkdir -p "$out" || exit 1
          show() {
            local item
            for item in "$out"/writer-off-*.txt "$out"/writer-off-*.log; do
              [ -f "$item" ] || continue
              echo "----- $item"; cat "$item"; echo
            done
          }
          fail() { echo "$1" >&2; show >&2; exit 1; }
          script=c3po/deployment/capacity-day/manifest_writer.py
          [ -x /usr/bin/docker ] || fail "docker is not at /usr/bin/docker"
          [ -f "$script" ] || fail "the manifest writer is not in the checkout"
          id="$(docker image inspect --format '{{.Id}}' c3po/backend:pr-validation)" || fail "the validation image is absent"
          [[ "$id" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "unexpected image id: $id"
          sha256sum "$script" | cut -d ' ' -f 1 > "$out/writer-off-script-sha256.txt" || fail "the script could not be hashed"
          base="$(sudo mktemp -d)" || fail "no throwaway directory"
          [[ "$base" == /* && "$base" != *,* ]] || fail "unusable throwaway directory"
          sudo install -d -m 0700 -o 0 -g 0 "$base/manifests" "$base/docker-cli" || fail "the throwaway directories could not be created"
          argv=(/usr/bin/docker run --rm -i --name c3po-capacity-day-smoke --pull never --init
            --user 0:0 --network none --read-only --cap-drop ALL --security-opt no-new-privileges
            --mount "type=bind,source=$base/manifests,target=/etc/c3po-bar/manifests"
            --env C3PO_R2D2_V2_SHADOW_ENABLED=false
            "$id" python -I -B - --day 2026-10-05 --manifest-directory /etc/c3po-bar/manifests)
          printf '%q ' "${argv[@]}" > "$out/writer-off-command.txt" || fail "the command could not be recorded"
          rc=0
          sudo env "DOCKER_CONFIG=$base/docker-cli" "${argv[@]}" < "$script" \
            > "$out/writer-off-stdout.log" 2> "$out/writer-off-stderr.log" || rc=$?
          echo "manifest writer exit status: $rc" > "$out/writer-off-exit.txt" || fail "the exit status could not be recorded"
          cat "$out/writer-off-stdout.log" "$out/writer-off-exit.txt" || fail "the receipt could not be read"
          [ "$rc" -eq 3 ] || fail "expected the refusal status 3, got $rc"
          [ ! -s "$out/writer-off-stderr.log" ] || fail "the writer printed on standard error"
          python3 - "$out/writer-off-stdout.log" <<'PY' || fail "unexpected receipt"
          import json, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          if text.count("\n") != 1 or not text.endswith("\n"):
              sys.exit("expected exactly one stdout line")
          expected = {"schema": "R2D2_V2_BAR_MANIFEST_WRITER_RECEIPT_V1", "status": "REFUSED", "code": "MANIFEST_SHADOW_OFF",
                      "session": "2026-10-05", "mode": "PUBLISH"}
          if json.loads(text) != expected:
              sys.exit("the receipt is not the documented off refusal")
          PY
          left="$(sudo find "$base/manifests" -mindepth 1)" || fail "the manifest directory could not be listed"
          [ -z "$left" ] || fail "the off path wrote into the manifest directory"
          containers="$(docker ps -a --filter 'name=^c3po-capacity-day-smoke$' -q)" || fail "the containers could not be listed"
          [ -z "$containers" ] || fail "leftover c3po-capacity-day-smoke container"

      - name: Publish backend runtime check
        if: >-
          always() &&
          (github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.remediation))
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: c3po-backend-runtime-check-${{ github.sha }}
          path: ${{ runner.temp }}/backend-runtime
          if-no-files-found: warn
          retention-days: 14

      - name: Scan pull-request images with pinned Trivy
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.remediation)
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/c3po_trivy_scan.py \
            --scope pull_request_build \
            --revision "$GITHUB_SHA" \
            --image backend=c3po/backend:pr-validation \
            --image web=c3po/web:pr-validation \
            --image database=c3po/database:pr-validation \
            --output "$RUNNER_TEMP/c3po-trivy-pull-request.json"

      - name: Publish pull-request image scan
        if: >-
          always() &&
          (github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.remediation))
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: c3po-trivy-pull-request-${{ github.sha }}
          path: ${{ runner.temp }}/c3po-trivy-pull-request.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require zero fixable C/H in automated remediation
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.remediation) ||
          (github.event_name == 'pull_request' &&
          (startsWith(github.head_ref, 'automation/container-security-rebuild-') ||
          startsWith(github.head_ref, 'automation/controller-positive-dry-run-')))
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/c3po_container_remediation.py verify-zero \
            --report "$RUNNER_TEMP/c3po-trivy-pull-request.json"

  security-remediation-proof:
    name: Security remediation proof
    needs: [sensitive-files, secret-scan, backend-tests, python-type-check, frontend-build]
    if: github.event_name == 'workflow_dispatch' && inputs.remediation && !inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - name: Bind all passing checks to the immutable candidate
        env:
          VALIDATED_REF: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          [[ "$VALIDATED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$VALIDATED_REF" = "$DISPATCH_SHA"

  deploy-production:
    name: Deploy production
    needs: [sensitive-files, secret-scan, backend-tests, python-type-check, frontend-build]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Record deployment revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Derive the container security rebuild token
        run: |
          token=$(sha256sum c3po/security/container-rebuild-trigger.json | cut -d ' ' -f 1)
          printf 'C3PO_SECURITY_REBUILD=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Build production images outside the server
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
          # A DSN is the SDK's public ingestion identifier, never an auth token.
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.C3PO_SENTRY_DSN }}
        run: |
          test -n "$NEXT_PUBLIC_SENTRY_DSN" || {
            echo "::error::C3PO_SENTRY_DSN is required for browser error monitoring"
            exit 1
          }
          docker build \
            --file c3po/backend/Dockerfile \
            --build-arg "C3PO_SECURITY_REBUILD=$C3PO_SECURITY_REBUILD" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag c3po/backend:production \
            c3po
          docker build \
            --file c3po/frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_C3PO_API_URL= \
            --build-arg "NEXT_PUBLIC_C3PO_BUILD_SHA=$REVISION" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=production \
            --build-arg NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=0.01 \
            --build-arg "C3PO_SECURITY_REBUILD=$C3PO_SECURITY_REBUILD" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag c3po/web:production \
            c3po/frontend
          docker build \
            --file c3po/database/Dockerfile \
            --build-arg "C3PO_SECURITY_REBUILD=$C3PO_SECURITY_REBUILD" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag c3po/database:production \
            c3po
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' c3po/backend:production)" = "$REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' c3po/web:production)" = "$REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' c3po/database:production)" = "$REVISION"
          docker run --rm --entrypoint gosu c3po/database:production \
            nobody true

      - name: Scan production build with pinned Trivy
        continue-on-error: true
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          python3 scripts/c3po_trivy_scan.py \
            --scope production_build \
            --revision "$REVISION" \
            --image backend=c3po/backend:production \
            --image web=c3po/web:production \
            --image database=c3po/database:production \
            --output "$RUNNER_TEMP/c3po-trivy-production-build.json"

      - name: Publish production build scan
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: c3po-trivy-production-build-${{ steps.revision.outputs.sha }}
          path: ${{ runner.temp }}/c3po-trivy-production-build.json
          if-no-files-found: warn
          retention-days: 30

      - name: Package production images
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          docker save \
            c3po/backend:production \
            c3po/web:production \
            c3po/database:production \
            | gzip -1 > "/tmp/c3po-images-$REVISION.tar.gz"
          sha256sum "/tmp/c3po-images-$REVISION.tar.gz" \
            > "/tmp/c3po-images-$REVISION.tar.gz.sha256"

      - name: Package tracked source
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: git archive --format=tar.gz --output="/tmp/c3po-release-$REVISION.tar.gz" HEAD

      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          scp -i ~/.ssh/c3po_deploy \
            "/tmp/c3po-release-${{ steps.revision.outputs.sha }}.tar.gz" \
            "/tmp/c3po-images-${{ steps.revision.outputs.sha }}.tar.gz" \
            "/tmp/c3po-images-${{ steps.revision.outputs.sha }}.tar.gz.sha256" \
            "$USER@$HOST:/tmp/"

      - name: Stage push notification configuration
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
          PUSH_PRIVATE: ${{ secrets.C3PO_PUSH_VAPID_PRIVATE_KEY }}
          PUSH_PUBLIC: ${{ secrets.C3PO_PUSH_VAPID_PUBLIC_KEY }}
        run: |
          test -n "$PUSH_PRIVATE"
          test -n "$PUSH_PUBLIC"
          umask 077
          {
            printf 'C3PO_PUSH_VAPID_PRIVATE_KEY=%s\n' "$PUSH_PRIVATE"
            printf 'C3PO_PUSH_VAPID_PUBLIC_KEY=%s\n' "$PUSH_PUBLIC"
          } > /tmp/c3po-push.env
          scp -i ~/.ssh/c3po_deploy \
            /tmp/c3po-push.env \
            "$USER@$HOST:/tmp/c3po-push-${{ steps.revision.outputs.sha }}.env"
          rm -f /tmp/c3po-push.env

      - name: Deploy and verify
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "REVISION='$REVISION' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR=/opt/chief-of-staff-digital
          # Serialize container mutations against the native reboot controller.
          # The report directory may already be root-owned before first install.
          # Open/create in place: never replace the inode of a held flock.
          sudo python3 - "$APP_DIR/runtime/security/deployment.lock" "$(id -u)" "$(id -g)" <<'LOCK_BOOTSTRAP'
          import os
          from pathlib import Path
          import stat
          import sys

          path = Path(sys.argv[1])
          path.parent.mkdir(parents=True, exist_ok=True)
          fd = os.open(path, os.O_CREAT | os.O_RDWR | os.O_NOFOLLOW, 0o644)
          try:
              current = os.fstat(fd)
              if not stat.S_ISREG(current.st_mode) or current.st_nlink != 1:
                  raise RuntimeError('Invalid deployment lock')
              os.fchown(fd, int(sys.argv[2]), int(sys.argv[3]))
              os.fchmod(fd, 0o644)
          finally:
              os.close(fd)
          LOCK_BOOTSTRAP
          exec 9>>"$APP_DIR/runtime/security/deployment.lock"
          flock -w 120 9
          if [ -e /run/c3po-security/reboot.pending ]; then
            echo "Security reboot pending; deployment must retry after recovery" >&2
            exit 1
          fi
          ARCHIVE="/tmp/c3po-release-${REVISION}.tar.gz"
          IMAGE_ARCHIVE="/tmp/c3po-images-${REVISION}.tar.gz"
          IMAGE_SHA256="${IMAGE_ARCHIVE}.sha256"
          RELEASE_DIR="/tmp/c3po-release-${REVISION}"
          PUSH_ENV="/tmp/c3po-push-${REVISION}.env"
          PREVIOUS_REVISION=$(cat "$APP_DIR/.deploy-version" 2>/dev/null || printf 'unknown')

          cd /tmp
          sha256sum --check "$IMAGE_SHA256"

          current_backend=$(docker inspect --format '{{.Image}}' \
            "$(docker compose --env-file "$APP_DIR/.env" -f "$APP_DIR/c3po/compose.yml" ps -q api)" \
            2>/dev/null || true)
          current_web=$(docker inspect --format '{{.Image}}' \
            "$(docker compose --env-file "$APP_DIR/.env" -f "$APP_DIR/c3po/compose.yml" ps -q web)" \
            2>/dev/null || true)
          current_database=$(docker inspect --format '{{.Image}}' \
            "$(docker compose --env-file "$APP_DIR/.env" -f "$APP_DIR/c3po/compose.yml" ps -q db)" \
            2>/dev/null || true)
          docker image rm \
            c3po/backend:rollback \
            c3po/web:rollback \
            c3po/database:rollback \
            >/dev/null 2>&1 || true
          if [ -n "$current_backend" ]; then
            docker image tag "$current_backend" c3po/backend:rollback
          fi
          if [ -n "$current_web" ]; then
            docker image tag "$current_web" c3po/web:rollback
          fi
          if [ -n "$current_database" ]; then
            docker image tag "$current_database" c3po/database:rollback
          fi

          gzip -dc "$IMAGE_ARCHIVE" | docker load
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' c3po/backend:production)" = "$REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' c3po/web:production)" = "$REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' c3po/database:production)" = "$REVISION"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

          rsync -a --delete \
            --exclude='.env' \
            --exclude='.deploy-version' \
            --exclude='.deployments/' \
            --exclude='output/' \
            --exclude='outputs/' \
            --exclude='tmp/' \
            --exclude='runtime/' \
            --exclude='c3po/data/' \
            --exclude='whatsapp_session/' \
            "$RELEASE_DIR/" "$APP_DIR/"

          python3 - "$APP_DIR/.env" "$PUSH_ENV" <<'PY'
          import pathlib
          import sys

          target = pathlib.Path(sys.argv[1])
          staged = pathlib.Path(sys.argv[2])
          updates = dict(
              line.split("=", 1)
              for line in staged.read_text(encoding="utf-8").splitlines()
              if line and "=" in line
          )
          existing = target.read_text(encoding="utf-8").splitlines()
          output = []
          seen = set()
          for line in existing:
              key = line.split("=", 1)[0] if "=" in line else ""
              if key in updates:
                  output.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  output.append(line)
          for key, value in updates.items():
              if key not in seen:
                  output.append(f"{key}={value}")
          target.write_text("\n".join(output) + "\n", encoding="utf-8")
          target.chmod(0o600)
          staged.unlink()
          PY

          cd "$APP_DIR"
          sudo python3 scripts/init-maintenance-gate.py "$APP_DIR"
          C3PO_BUILD_SHA="$REVISION" docker compose --env-file .env -f c3po/compose.yml config --quiet
          C3PO_BUILD_SHA="$REVISION" docker compose --env-file .env -f c3po/compose.yml up -d --no-build

          # Each service initializes the idempotent schema under one advisory lock.
          # Allow a cold, serialized startup to finish before declaring the deploy bad.
          healthy=false
          for attempt in $(seq 1 90); do
            web_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
            api_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/health || true)
            shadow_id=$(docker compose --env-file .env -f c3po/compose.yml ps -q r2d2-shadow-candidate-worker)
            shadow_status=$(docker inspect -f '{{.State.Status}}' "$shadow_id" 2>/dev/null || true)
            if [ "$web_code" = "200" ] \
              && { [ "$api_code" = "200" ] || [ "$api_code" = "401" ]; } \
              && [ "$shadow_status" = "running" ]; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [ "$healthy" = true ]; then
            printf '%s\n' "$REVISION" > .deploy-version
            # Install/update the reviewed native routine on every successful release.
            sudo bash scripts/install-security-daily.sh
            rm -rf "$RELEASE_DIR" "$ARCHIVE" "$IMAGE_ARCHIVE" "$IMAGE_SHA256"
            docker image prune --force >/dev/null
            docker builder prune --force >/dev/null
            exit 0
          fi

          echo "health gate failed; restoring the prior container images" >&2
          if docker image inspect \
            c3po/backend:rollback \
            c3po/web:rollback \
            c3po/database:rollback \
            >/dev/null 2>&1; then
            docker image tag c3po/backend:rollback c3po/backend:production
            docker image tag c3po/web:rollback c3po/web:production
            docker image tag c3po/database:rollback c3po/database:production
            rollback_has_shadow_worker=false
            if docker run --rm --entrypoint python c3po/backend:production \
              -c 'import app.r2d2_shadow_candidate_worker'; then
              rollback_has_shadow_worker=true
            fi
            C3PO_BUILD_SHA="$PREVIOUS_REVISION" docker compose --env-file .env -f c3po/compose.yml up -d --no-build
            if [ "$rollback_has_shadow_worker" != "true" ]; then
              # Only the first rollback target predates this worker. Later
              # rollback images keep the evidence collector running.
              docker compose --env-file .env -f c3po/compose.yml stop r2d2-shadow-candidate-worker
            fi
            rollback_healthy=false
            for attempt in $(seq 1 60); do
              web_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
              api_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/health || true)
              if [ "$web_code" = "200" ] && { [ "$api_code" = "200" ] || [ "$api_code" = "401" ]; }; then
                rollback_healthy=true
                break
              fi
              sleep 5
            done
            if [ "$rollback_healthy" = true ]; then
              echo "rollback health gate restored the prior images" >&2
            else
              echo "rollback images loaded but health gate did not recover" >&2
            fi
          else
            echo "rollback images are unavailable" >&2
          fi

          docker compose --env-file .env -f c3po/compose.yml ps
          docker compose --env-file .env -f c3po/compose.yml logs --tail=120 api web db
          exit 1
          REMOTE
