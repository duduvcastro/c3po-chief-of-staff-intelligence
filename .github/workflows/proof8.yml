name: e04-codex-linux-proof8
on:
  push:
    branches: ['ops/codex-epoch04-proof8-20261009']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: run suites
        run: |
          set +e
          python3 --version | tee py.txt
          find r6 c6i -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum > SOURCES.sha256
          (cd r6 && python3 -I -B run_required_tests.py) > r6.log 2>&1; e1=$?
          (cd c6i && python3 -B -s -m unittest -v test_new_integration_delta) > c6i.log 2>&1; e2=$?
          python3 - "$e1" "$e2" <<'PY'
          import json,sys,hashlib,platform,re
          def tail(p):
              t=open(p).read(); m=re.findall(r'^Ran (\d+) tests?',t,re.M); return {'ran':sum(map(int,m)) if m else None,'ok_lines':len(re.findall(r'^OK',t,re.M)),'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest()}
          e=list(map(int,sys.argv[1:])); names=['r6','c6i']
          r={'schema':'FABLE_E04_CODEX_LINUX_PROOF_V8','python':platform.python_version(),'platform':platform.platform(),
             'sources_sha256':hashlib.sha256(open('SOURCES.sha256','rb').read()).hexdigest()}
          for n,x in zip(names,e): r[n]={'exit':x,**tail(n+'.log')}
          r['pass']=all(r[n]['exit']==0 for n in names)
          open('RESULT.json','w').write(json.dumps(r,sort_keys=True,indent=1)); print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e04-proof8
          path: |
            RESULT.json
            SOURCES.sha256
            py.txt
            *.log
      - name: fail if required suites failed
        run: python3 -c "import json,sys; sys.exit(0 if json.load(open('RESULT.json'))['pass'] else 1)"
