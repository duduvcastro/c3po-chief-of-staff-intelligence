# HOSTOPS02, the K9 families and their neighbours (proof branch ops/hostops02-k9-proof-20261005d): every staged core's suite and the suites of
# the operations assembled from it, on Linux as REAL ROOT and as the runner's ordinary user (each core's own
# linux_root/run.sh); each family's own linux_root/run.sh where it has one; the backend image BUILT FROM THIS CHECKOUT
# (release dd4ec4bb8dab4d8b0372b0f9eabc90bf6443e858) and the real-Docker shapes of the K9 interface note (N-7) and of K12 (U1-U6, U9, U10) on it;
# the systemd shapes of K5 and K13 with stand-in units. One job per group, on its own throwaway runner.
#
# For a THROWAWAY branch that never merges and carries no other workflow. Every job runs on a GitHub-hosted runner that
# is discarded afterwards; nothing here contacts the production host. No secret is used: every token and password in the
# branch is a fake test value; the GitHub token is read-only and is not kept in the checkout (persist-credentials:
# false). No environment, no deploy, no write permission, no pull_request trigger. The two actions are pinned by commit,
# the same two the earlier hostops02 proof jobs used. This file is hostops02-k9/proof/WORKFLOW.yml.txt, byte for byte
# (proof/seals.py compares). Generated by stage_branch.sh from the families file; see hostops02-k9/proof/README.txt.
name: hostops02-k9-proof
on:
  push:
    branches: [ops/hostops02-k9-proof-20261005d]
permissions:
  contents: read
concurrency:
  group: ops-hostops02-k9-proof-20261005d
  cancel-in-progress: false
jobs:
  seals:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: every seal (strict, with each directory's own seal.py check), the links, proof/ and this file
        run: /usr/bin/python3 -I -B hostops02-k9/proof/seals.py
      - name: public-safety scan of hostops02-k9/ and of this workflow
        if: always()
        run: /usr/bin/python3 -I -B hostops02-k9/proof/public_safety.py
      - name: the seal report as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostops02-k9-proof-seals
          if-no-files-found: warn
          retention-days: 30
          path: hostops02-k9/proof/out/
  linux-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        group: [k9, k4e0, k3k9, k5-dbr, k6b, probe, k12, k8, k4-k13, k3-secret-env, runner, shapes]
    env:
      HOSTOPS_THROWAWAY_RUNNER: "yes"
      PROOF_GROUP: ${{ matrix.group }}
    steps:
      - name: checkout (full history, so that the release commit is at hand for git archive and git show)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: every seal before the run (strict)
        run: /usr/bin/python3 -I -B hostops02-k9/proof/seals.py
      - name: the group (its steps run whatever the earlier ones did; exit 0 only when every step is green)
        run: /usr/bin/python3 -I -B hostops02-k9/proof/run_group.py "$PROOF_GROUP"
      - name: every seal after the run (outputs of the job allowed and listed)
        if: always()
        run: /usr/bin/python3 -I -B hostops02-k9/proof/seals.py --after --out "hostops02-k9/proof/out/$PROOF_GROUP/SEALS.after.json"
      - name: the outputs as one artifact per group
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostops02-k9-proof-${{ matrix.group }}
          if-no-files-found: warn
          retention-days: 30
          path: hostops02-k9/proof/out/
