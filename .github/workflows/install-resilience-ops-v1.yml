name: Read interim M1 evidence

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production-safe operation to execute
        required: true
        default: diagnose-kill
        type: choice
        options:
          - diagnose-kill
          - inspect-orphans
          - compare-legacy-day-d-volume
          - preview-orphan-cleanup
          - cleanup-orphans
          - verify-orphan-cleanup
          - inspect-m1-server-source
          - read-m1-incremental

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  read-production-evidence:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Check out the exact query source
        uses: actions/checkout@v6

      - name: Configure production SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect the host evidence for the killed M1 reader
        if: inputs.operation == 'diagnose-kill'
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== dmesg OOM signatures (requested evidence) ==='
          sudo -n dmesg -T \
            | grep -i -E 'oom|out of memory|killed process|memory cgroup' \
            | tail -n 100 || true
          echo '=== kernel journal, 17:14:30-17:16:30 BRT ==='
          sudo -n journalctl -k \
            --since '2026-09-02 17:14:30 -03:00' \
            --until '2026-09-02 17:16:30 -03:00' \
            -o short-iso --no-pager \
            | grep -i -E 'oom|out of memory|killed process|memory cgroup' || true
          echo '=== systemd-oomd journal in the incident window ==='
          sudo -n journalctl -u systemd-oomd \
            --since '2026-09-02 17:14:30 -03:00' \
            --until '2026-09-02 17:16:30 -03:00' \
            -o short-iso --no-pager || true
          echo '=== Docker OOM/kill/die events in the incident window ==='
          docker events \
            --since '2026-09-02T20:14:30Z' \
            --until '2026-09-02T20:16:30Z' \
            --filter type=container \
            --filter event=oom \
            --filter event=kill \
            --filter event=die \
            --format '{{.Time}} {{.Action}} {{.Actor.Attributes.name}}' || true
          echo '=== current memory and swap ==='
          free -h
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
          REMOTE

      - name: Inventory the seven Day-D orphan containers
        if: inputs.operation == 'inspect-orphans'
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          orphans=(
            c3po-day-d-qualification-20241224-drill-v2
            c3po-day-d-qualification-20241224-drill
            c3po-day-d-qualification-20241224-offload
            c3po-day-d-qualification-20241224-download-v2
            c3po-day-d-qualification-20241224-download
            c3po-day-d-minute-offload-20260823
            c3po-day-d-minute-20260823
          )
          for name in "${orphans[@]}"; do
            docker container inspect --size --format \
              'name={{.Name}} project={{index .Config.Labels "com.docker.compose.project"}} service={{index .Config.Labels "com.docker.compose.service"}} oneoff={{index .Config.Labels "com.docker.compose.oneoff"}} state={{.State.Status}} rw_bytes={{.SizeRw}}' \
              "$name"
            docker container inspect --format \
              '{{range .Mounts}}mount type={{.Type}} name={{.Name}} source={{.Source}} destination={{.Destination}} rw={{.RW}}{{println}}{{end}}' \
              "$name"
            docker diff "$name"
          done
          REMOTE

      - name: Compare the legacy Day-D volume with persistent storage
        if: inputs.operation == 'compare-legacy-day-d-volume'
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" 'sudo -n python3 -' <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          legacy = Path('/var/lib/docker/volumes/c3po_c3po_day_d_data/_data')
          persistent = Path('/mnt/day-d-data')

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      value.update(block)
              return value.hexdigest()

          if not legacy.is_dir() or not persistent.is_dir():
              raise SystemExit('required Day-D storage root is missing')
          rows = []
          for source in sorted(path for path in legacy.rglob('*') if path.is_file()):
              relative = source.relative_to(legacy)
              target = persistent / relative
              source_sha = digest(source)
              target_sha = digest(target) if target.is_file() else None
              rows.append({
                  'path': str(relative),
                  'bytes': source.stat().st_size,
                  'sha256': source_sha,
                  'persistent_match': target_sha == source_sha,
              })
          result = {
              'schema': 'C3PO_DAY_D_LEGACY_VOLUME_COMPARISON-v1',
              'legacy_volume': 'c3po_c3po_day_d_data',
              'file_count': len(rows),
              'total_bytes': sum(row['bytes'] for row in rows),
              'matching_persistent_files': sum(row['persistent_match'] for row in rows),
              'files': rows,
              'unmatched_files': [row for row in rows if not row['persistent_match']],
          }
          print(json.dumps(result, sort_keys=True))
          if result['unmatched_files']:
              raise SystemExit('legacy Day-D volume contains evidence absent from persistent storage')
          PY

      - name: Preview the exact Compose orphan cleanup
        if: inputs.operation == 'preview-orphan-cleanup'
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/chief-of-staff-digital
          docker compose --dry-run --env-file .env -f c3po/compose.yml \
            run --rm -T --no-deps --remove-orphans api true
          REMOTE

      - name: Remove only the seven verified Day-D orphan containers
        if: inputs.operation == 'cleanup-orphans'
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/chief-of-staff-digital
          expected=(
            c3po-day-d-minute-20260823
            c3po-day-d-minute-offload-20260823
            c3po-day-d-qualification-20241224-download
            c3po-day-d-qualification-20241224-download-v2
            c3po-day-d-qualification-20241224-drill
            c3po-day-d-qualification-20241224-drill-v2
            c3po-day-d-qualification-20241224-offload
          )
          for name in "${expected[@]}"; do
            test "$(docker inspect --format '{{.State.Status}}' "$name")" = exited
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$name")" = c3po
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.oneoff"}}' "$name")" = True
          done
          preview=$(docker compose --dry-run --env-file .env -f c3po/compose.yml \
            run --rm -T --no-deps --remove-orphans api true 2>&1 || true)
          mapfile -t observed < <(
            printf '%s\n' "$preview" \
              | grep -oE 'c3po-day-d-[A-Za-z0-9-]+' \
              | sort -u
          )
          test "${#observed[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${observed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          sudo -n python3 - <<'PY'
          import hashlib
          from pathlib import Path

          legacy = Path('/var/lib/docker/volumes/c3po_c3po_day_d_data/_data')
          persistent = Path('/mnt/day-d-data')
          for source in sorted(path for path in legacy.rglob('*') if path.is_file()):
              target = persistent / source.relative_to(legacy)
              if not target.is_file():
                  raise SystemExit('legacy evidence is absent from persistent storage')
              def sha(path: Path) -> str:
                  value = hashlib.sha256()
                  with path.open('rb') as handle:
                      for block in iter(lambda: handle.read(1024 * 1024), b''):
                          value.update(block)
                  return value.hexdigest()
              if sha(source) != sha(target):
                  raise SystemExit('legacy evidence differs from persistent storage')
          PY
          docker compose --env-file .env -f c3po/compose.yml \
            run --rm -T --no-deps --remove-orphans api true
          for name in "${expected[@]}"; do
            if docker inspect "$name" >/dev/null 2>&1; then
              echo "orphan container still exists: $name" >&2
              exit 1
            fi
          done
          docker volume inspect c3po_c3po_day_d_data >/dev/null
          test -d /mnt/day-d-data
          printf 'removed_orphan_containers=%s volumes_removed=0\n' "${#expected[@]}"
          REMOTE

      - name: Verify the Day-D orphan cleanup
        if: inputs.operation == 'verify-orphan-cleanup'
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          names=$(docker ps -a --format '{{.Names}}' | grep '^c3po-day-d-' || true)
          test -z "$names"
          docker volume inspect c3po_c3po_day_d_data >/dev/null
          test -d /mnt/day-d-data
          printf 'day_d_orphan_containers=0 legacy_volume_preserved=true persistent_bind_preserved=true\n'
          REMOTE

      - name: Probe canonical equivalence of the server-side M1 source
        if: inputs.operation == 'inspect-m1-server-source'
        env:
          C3PO_PRODUCTION_HOST: ${{ secrets.C3PO_AWS_HOST }}
          C3PO_PRODUCTION_USER: ${{ secrets.C3PO_AWS_USER }}
          C3PO_SSH_KEY: /home/runner/.ssh/c3po_deploy
        run: |
          set +e
          .github/scripts/c3po_interim_m1_server_read.sh /tmp/m1-server-source.json
          status=$?
          set -e
          if [[ "$status" -eq 3 ]]; then
            test ! -e /tmp/m1-server-source.json
            echo 'canonical_equivalent=false m1_emitted=false fallback_required=true'
            exit 0
          fi
          exit "$status"

      - name: Download and verify the pinned factual baseline
        if: inputs.operation == 'read-m1-incremental'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test ! -e /tmp/m1-baseline
          gh run download 33022905030 \
            --repo "$GITHUB_REPOSITORY" \
            --name entry-quality-pr257-factual-33022905030 \
            --dir /tmp/m1-baseline
          baseline_root=/tmp/m1-baseline/33022905030
          test -s "$baseline_root/study/report.json"
          (
            cd "$baseline_root"
            sha256sum -c SHA256SUMS
          )
          PYTHONPATH=.github/scripts python3 - <<'PY'
          import json
          from pathlib import Path
          import c3po_m1_incremental_reducer as reducer

          report = json.loads(Path(
              '/tmp/m1-baseline/33022905030/study/report.json'
          ).read_text(encoding='utf-8'))
          reducer.verify_baseline(report)
          print('baseline_report_sha256=' + report['report_sha256'])
          PY

      - name: Enumerate completed current-policy sessions read-only
        if: inputs.operation == 'read-m1-incremental'
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          set -euo pipefail
          umask 077
          sessions_query=.github/scripts/c3po_m1_current_sessions.sql
          sessions_sha=$(sha256sum "$sessions_query" | cut -d ' ' -f 1)
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "cd /opt/chief-of-staff-digital && \
             docker compose --env-file .env -f c3po/compose.yml exec -T \
               -e 'PGOPTIONS=-c role=pg_read_all_data -c default_transaction_read_only=on -c statement_timeout=120000 -c lock_timeout=5000' \
               db sh -ceu 'exec psql -X --no-psqlrc -qAt -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\"'" \
            < "$sessions_query" > /tmp/m1-sessions.txt
          test -s /tmp/m1-sessions.txt
          if grep -Evq '^2026-(08-(26|27|28|29|30|31)|09-0[1-2])$' /tmp/m1-sessions.txt; then
            echo 'session enumeration returned an unexpected value' >&2
            exit 1
          fi
          test "$(sort -u /tmp/m1-sessions.txt | wc -l | tr -d ' ')" \
            = "$(wc -l < /tmp/m1-sessions.txt | tr -d ' ')"
          printf 'completed_sessions=%s sessions_query_sha256=%s\n' \
            "$(wc -l < /tmp/m1-sessions.txt | tr -d ' ')" "$sessions_sha"

      - name: Recompute M1 one completed session at a time
        if: inputs.operation == 'read-m1-incremental'
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          set -euo pipefail
          umask 077
          query=.github/scripts/c3po_m1_session_snapshot.py
          query_sha=$(sha256sum "$query" | cut -d ' ' -f 1)
          [[ "$query_sha" =~ ^[0-9a-f]{64}$ ]]
          engine_sha=$(sha256sum c3po/backend/app/r2d2_entry_quality_engine.py | cut -d ' ' -f 1)
          study_sha=$(sha256sum c3po/backend/app/r2d2_entry_quality_study.py | cut -d ' ' -f 1)
          epochs_sha=$(sha256sum c3po/docs/ENTRY_QUALITY_STUDY_V1_POLICY_EPOCHS.json | cut -d ' ' -f 1)
          install -m 700 -d /tmp/m1-transient
          while IFS= read -r session; do
            [[ "$session" =~ ^2026-(08-(26|27|28|29|30|31)|09-0[1-2])$ ]]
            snapshot="/tmp/m1-transient/session-${session}.json"
            test ! -e "$snapshot"
            # The preflight and 384 MiB virtual-memory ceiling protect the
            # 1.9 GiB production host.  The process is sequential and runs in
            # the existing API container; it never creates a second API.
            ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" \
              "available=\$(awk '/^MemAvailable:/ {print \$2}' /proc/meminfo); \
               if test \"\$available\" -lt 260000; then \
                 echo \"M1 preflight refused: MemAvailable below 260000 kB\" >&2; exit 75; \
               fi; \
               cd /opt/chief-of-staff-digital && \
               docker compose --env-file .env -f c3po/compose.yml exec -T \
                 -e 'PGOPTIONS=-c role=pg_read_all_data -c default_transaction_read_only=on -c statement_timeout=120000 -c lock_timeout=5000' \
                 -e 'C3PO_EVIDENCE_QUERY_SHA256=$query_sha' \
                 api sh -ceu 'ulimit -v 393216; exec nice -n 10 python - --session \"$session\"'" \
              < "$query" > "$snapshot"
            test -s "$snapshot"
            SNAPSHOT="$snapshot" EXPECTED_ENGINE_SHA="$engine_sha" \
              EXPECTED_STUDY_SHA="$study_sha" EXPECTED_EPOCHS_SHA="$epochs_sha" \
              PYTHONPATH=.github/scripts python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import c3po_m1_incremental_reducer as reducer

          path = Path(os.environ['SNAPSHOT'])
          snapshot = reducer.validate_snapshot(json.loads(path.read_text(encoding='utf-8')))
          expected_sources = {
              'r2d2_entry_quality_engine.py': os.environ['EXPECTED_ENGINE_SHA'],
              'r2d2_entry_quality_study.py': os.environ['EXPECTED_STUDY_SHA'],
          }
          if snapshot['frozen_source_sha256'] != expected_sources:
              raise SystemExit('deployed frozen source differs from the checked-out query contract')
          if snapshot['policy_epochs_sha256'] != os.environ['EXPECTED_EPOCHS_SHA']:
              raise SystemExit('deployed policy epochs differ from the checked-out contract')
          print('validated_session=' + path.stem.removeprefix('session-'))
          PY
          done < /tmp/m1-sessions.txt

      - name: Reduce transient snapshots and reproduce the frozen estimators
        if: inputs.operation == 'read-m1-incremental'
        run: |
          set -euo pipefail
          reducer=.github/scripts/c3po_m1_incremental_reducer.py
          reducer_sha=$(sha256sum "$reducer" | cut -d ' ' -f 1)
          [[ "$reducer_sha" =~ ^[0-9a-f]{64}$ ]]
          mapfile -t snapshots < <(find /tmp/m1-transient -maxdepth 1 -type f \
            -name 'session-*.json' -print | sort)
          test "${#snapshots[@]}" \
            = "$(wc -l < /tmp/m1-sessions.txt | tr -d ' ')"
          args=(
            --baseline-report /tmp/m1-baseline/33022905030/study/report.json
            --output /tmp/m1-interim.json
          )
          for snapshot in "${snapshots[@]}"; do
            args+=(--session-snapshot "$snapshot")
          done
          C3PO_EVIDENCE_REDUCER_SHA256="$reducer_sha" \
            python3 "$reducer" "${args[@]}"
          test -s /tmp/m1-interim.json

      - name: Validate reduced evidence artifact
        if: inputs.operation == 'read-m1-incremental'
        run: |
          PYTHONPATH=.github/scripts python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          import c3po_m1_incremental_reducer as reducer

          path = Path('/tmp/m1-interim.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          checks = {
              'schema': payload.get('schema') == 'C3PO_ENTRY_QUALITY_M1_INCREMENTAL_REDUCED-v1',
              'analysis_interpretable': payload.get('analysis_interpretable') is True,
              'entry_gate_passed': (payload.get('entry_consistency_gate') or {}).get('passed') is True,
              'baseline_pinned': (payload.get('baseline') or {}).get('report_sha256') == '23ede14e5d76cdd70bd1df58fcde62ad9445291eacae4872174b835ac4b94756',
              'source_evidence_present': bool(payload.get('source_evidence')),
              'm1_available': (payload.get('m1') or {}).get('available') is True,
              'h3_present': isinstance(payload.get('h3'), dict),
              'read_only': (payload.get('governance') or {}).get('read_only') is True,
              'raw_rows_absent': (payload.get('governance') or {}).get('raw_rows_retained') is False,
              'ids_absent': (payload.get('governance') or {}).get('entry_identifiers_retained') is False,
              'strategy_change_forbidden': (payload.get('governance') or {}).get('strategy_change_authorized') is False,
              'retention_30d': (payload.get('retention') or {}).get('days') == 30,
              'retention_enforced': (payload.get('retention') or {}).get('enforcement') == 'github_private_artifact_retention',
          }
          failed = sorted(name for name, passed in checks.items() if not passed)
          if failed:
              raise SystemExit('interim evidence validation failed: ' + ', '.join(failed))
          reducer.verify_self_hash(payload, 'artifact_sha256')

          sensitive_key = re.compile(
              r'(password|passwd|secret|token|credential|private.?key|api.?key|endpoint|database.?url|dsn|uri|url)',
              re.I,
          )
          prohibited_value = re.compile(
              r'(postgres(?:ql)?://|https?://|gh[opusr]_[A-Za-z0-9_]+|sk-[A-Za-z0-9_-]+)',
              re.I,
          )

          def walk(value, path='root'):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if sensitive_key.search(str(key)):
                          raise SystemExit(f'sensitive key in reduced artifact: {path}.{key}')
                      walk(child, f'{path}.{key}')
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f'{path}[{index}]')
              elif isinstance(value, str):
                  if prohibited_value.search(value):
                      raise SystemExit(f'prohibited value in reduced artifact: {path}')
                  if re.fullmatch(r'[0-9a-f]{8}-[0-9a-f-]{27,}', value, re.I):
                      raise SystemExit(f'raw identifier in reduced artifact: {path}')

          walk(payload)
          PY

      - name: Seal query and reduced artifact
        if: inputs.operation == 'read-m1-incremental'
        run: |
          set -euo pipefail
          install -m 700 -d /tmp/m1-evidence
          install -m 600 /tmp/m1-interim.json /tmp/m1-evidence/m1-interim.json
          install -m 600 .github/scripts/c3po_m1_session_snapshot.py \
            /tmp/m1-evidence/session-query.py
          install -m 600 .github/scripts/c3po_m1_incremental_reducer.py \
            /tmp/m1-evidence/reducer.py
          install -m 600 .github/scripts/c3po_m1_current_sessions.sql \
            /tmp/m1-evidence/session-enumeration.sql
          cd /tmp/m1-evidence
          sha256sum m1-interim.json session-query.py reducer.py \
            session-enumeration.sql > SHA256SUMS
          sha256sum -c SHA256SUMS
          # Transient snapshots and the raw factual baseline are deliberately
          # excluded from the retainable artefact.
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 5

      - name: Upload the reduced evidence artifact
        if: inputs.operation == 'read-m1-incremental'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: entry-quality-m1-interim-20260902-${{ github.run_id }}
          path: /tmp/m1-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Register the reduced reading and expiry on PR 348
        if: inputs.operation == 'read-m1-incremental'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/m1-interim.json').read_text(encoding='utf-8'))
          m1 = payload['m1']
          summary = m1['summary']
          barrier = summary['barrier']
          h3 = payload['h3']
          gate = payload['entry_consistency_gate']
          baseline = payload['baseline']
          query = payload['query']
          retention = payload['retention']
          comment = '\n'.join([
              '## Leitura interina M1 — evidência reduzida',
              '',
              f"- Run read-only: `{os.environ['GITHUB_RUN_ID']}`",
              '- Papel efetivo PostgreSQL: `pg_read_all_data`; `transaction_read_only=on`; uma sessão encerrada por processo',
              f"- População da época vigente: **{summary['entry_count']} entradas / {summary['session_count']} sessões**",
              f"- Gate global: **PASS**; construídas `{gate['constructed_entry_count']}`, medidas na época vigente `{gate['measured_entry_count']}`",
              f"- UCB unilateral 98,75%: central `{barrier['p_hat_ucb_98_75']}`; conservadora `{barrier['p_hat_cons_ucb_98_75']}`",
              f"- Contagens da barreira: `{json.dumps(barrier['categories'], sort_keys=True)}`",
              f"- Veredito parcial M1: **{barrier['verdict_against_50_percent']}** (`{m1['classification']}`)",
              f"- H3: **{h3['status']}**; células insuficientes `{json.dumps(h3['insufficient_cells'], sort_keys=True)}`",
              f"- Baseline factual pinado: run `{baseline['workflow_run_id']}`, report self-hash `{baseline['report_sha256']}`",
              f"- Consultas de sessão: `{json.dumps(query['session_query_sha256'])}`; reducer sha256 `{query['reducer_sha256']}`",
              f"- Artefato self-hash: `{payload['artifact_sha256']}`",
              f"- Artefato privado reduzido: [download]({os.environ['ARTIFACT_URL']}); digest `{os.environ['ARTIFACT_DIGEST']}`",
              f"- Expurgo automático pelo GitHub: **{retention['expires_at']}** (30 dias); o item de retenção reabre no gate nessa data.",
              '',
              'Sem linhas cruas, posições, valores de trades, credenciais, endpoints ou segredos. Esta leitura é `PILOT_ONLY`; admissão a qualquer canônico e mudança de estratégia continuam humanas.',
              '',
          ])
          Path('/tmp/pr348-m1-comment.md').write_text(comment, encoding='utf-8')
          PY
          gh pr comment 348 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr348-m1-comment.md

      - name: Destroy transient rows on the ephemeral runner
        if: always() && inputs.operation == 'read-m1-incremental'
        run: |
          rm -rf -- /tmp/m1-transient /tmp/m1-baseline
