name: Read interim M1 evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-production-evidence:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Configure production SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Recompute the five-session interim reading read-only
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" 'bash -s' > /tmp/m1-interim.json <<'REMOTE'
          set -euo pipefail
          cd /opt/chief-of-staff-digital
          docker compose --env-file .env -f c3po/compose.yml run --rm -T api python - <<'PY'
          from __future__ import annotations

          import json
          from datetime import datetime, timezone
          from pathlib import Path

          from app.config import get_settings
          from app.r2d2_entry_quality_study import (
              CURRENT_M1_POLICY_EPOCH,
              _report_hash,
              build_report,
          )

          docs = Path('/legacy/c3po/docs')
          manifest, report = build_report(
              settings=get_settings(),
              policy_epochs_path=docs / 'ENTRY_QUALITY_STUDY_V1_POLICY_EPOCHS.json',
              spec_path=docs / 'ENTRY_QUALITY_STUDY_V1.md',
              attestation_path=docs / 'ENTRY_QUALITY_STUDY_V1_RUNNER_ATTESTATION_1.md',
              attestation_two_path=docs / 'ENTRY_QUALITY_STUDY_V1_RUNNER_ATTESTATION_2.md',
              generated_at=datetime.now(timezone.utc),
              dry_run=True,
          )
          if report['report_sha256'] != _report_hash(report, 'report_sha256'):
              raise SystemExit('entry-study report self-hash mismatch')
          epoch = report['policy_epoch_results'].get(CURRENT_M1_POLICY_EPOCH) or {}
          payload = {
              'generated_at': report['generated_at'],
              'dry_run': report['dry_run'],
              'analysis_interpretable': report['analysis_interpretable'],
              'classification': report['classification'],
              'manifest_sha256': manifest['manifest_sha256'],
              'report_sha256': report['report_sha256'],
              'entry_gate_passed': report['entry_consistency_gate']['passed'],
              'cohort': report['cohort'],
              'm1': report['kill_criterion_m1_current_epoch'],
              'h3': (epoch.get('hypotheses') or {}).get('H3'),
              'ledger_candidate_lines': report['ledger_candidate_lines'],
          }
          print(json.dumps(payload, sort_keys=True, default=str))
          PY
          REMOTE

      - name: Validate reduced evidence artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/m1-interim.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          checks = {
              'dry_run': payload.get('dry_run') is True,
              'analysis_interpretable': payload.get('analysis_interpretable') is True,
              'entry_gate_passed': payload.get('entry_gate_passed') is True,
              'report_sha256': len(str(payload.get('report_sha256') or '')) == 64,
              'manifest_sha256': len(str(payload.get('manifest_sha256') or '')) == 64,
              'm1_available': (payload.get('m1') or {}).get('available') is True,
              'h3_present': isinstance(payload.get('h3'), dict),
          }
          failed = sorted(name for name, passed in checks.items() if not passed)
          if failed:
              raise SystemExit('interim evidence validation failed: ' + ', '.join(failed))
          PY

      - name: Upload the reduced evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: entry-quality-m1-interim-20260902
          path: /tmp/m1-interim.json
          if-no-files-found: error
          retention-days: 30
