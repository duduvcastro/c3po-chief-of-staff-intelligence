name: Read interim M1 evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-production-evidence:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Check out the exact query source
        uses: actions/checkout@v6

      - name: Wait for the post-market evidence window
        run: |
          target=$(date -u -d '2026-09-02T20:15:00Z' +%s)
          now=$(date -u +%s)
          remaining=$((target - now))
          if (( remaining > 3600 )); then
            echo "::error::post-market gate is unexpectedly more than one hour away"
            exit 1
          fi
          if (( remaining > 0 )); then
            echo "Waiting ${remaining}s for 17:15 BRT; production credentials are not loaded yet."
            sleep "$remaining"
          fi

      - name: Configure production SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Recompute the five-session interim reading read-only
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          query=.github/scripts/c3po_interim_m1_read.py
          query_sha=$(sha256sum "$query" | cut -d ' ' -f 1)
          test "${#query_sha}" -eq 64
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "cd /opt/chief-of-staff-digital && docker compose --env-file .env -f c3po/compose.yml run --rm -T \
            -e 'PGOPTIONS=-c role=pg_read_all_data -c default_transaction_read_only=on -c statement_timeout=120000 -c lock_timeout=5000' \
            -e 'C3PO_EVIDENCE_QUERY_SHA256=$query_sha' api python -" \
            < "$query" > /tmp/m1-interim.json

      - name: Validate reduced evidence artifact
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('/tmp/m1-interim.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          checks = {
              'schema': payload.get('schema') == 'C3PO_ENTRY_QUALITY_M1_INTERIM_REDUCED-v1',
              'dry_run': payload.get('dry_run') is True,
              'analysis_interpretable': payload.get('analysis_interpretable') is True,
              'entry_gate_passed': payload.get('entry_gate_passed') is True,
              'report_sha256': len(str((payload.get('source_evidence') or {}).get('report_sha256') or '')) == 64,
              'manifest_sha256': len(str((payload.get('source_evidence') or {}).get('manifest_sha256') or '')) == 64,
              'query_sha256': len(str((payload.get('query') or {}).get('sha256') or '')) == 64,
              'dedicated_role': (payload.get('database_access') or {}).get('effective_role') == 'pg_read_all_data',
              'transaction_read_only': (payload.get('database_access') or {}).get('transaction_read_only') is True,
              'zero_ddl_dml': (payload.get('database_access') or {}).get('ddl_or_dml_executed') is False,
              'm1_available': (payload.get('m1') or {}).get('available') is True,
              'h3_present': isinstance(payload.get('h3'), dict),
              'strategy_change_forbidden': (payload.get('partial_verdict') or {}).get('strategy_change_authorized') is False,
              'retention_30d': (payload.get('retention') or {}).get('days') == 30,
          }
          failed = sorted(name for name, passed in checks.items() if not passed)
          if failed:
              raise SystemExit('interim evidence validation failed: ' + ', '.join(failed))

          sensitive_key = re.compile(
              r'(password|passwd|secret|token|credential|private.?key|api.?key|endpoint|database.?url|dsn|uri|url)',
              re.I,
          )
          prohibited_value = re.compile(
              r'(postgres(?:ql)?://|https?://|gh[opusr]_[A-Za-z0-9_]+|sk-[A-Za-z0-9_-]+)',
              re.I,
          )

          def walk(value, path='root'):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if sensitive_key.search(str(key)):
                          raise SystemExit(f'sensitive key in reduced artifact: {path}.{key}')
                      walk(child, f'{path}.{key}')
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f'{path}[{index}]')
              elif isinstance(value, str):
                  if prohibited_value.search(value):
                      raise SystemExit(f'prohibited value in reduced artifact: {path}')
                  if re.fullmatch(r'[0-9a-f]{8}-[0-9a-f-]{27,}', value, re.I):
                      raise SystemExit(f'raw identifier in reduced artifact: {path}')

          walk(payload)
          PY

      - name: Seal query and reduced artifact
        run: |
          install -m 700 -d /tmp/m1-evidence
          install -m 600 /tmp/m1-interim.json /tmp/m1-evidence/m1-interim.json
          install -m 600 .github/scripts/c3po_interim_m1_read.py /tmp/m1-evidence/query.py
          cd /tmp/m1-evidence
          sha256sum m1-interim.json query.py > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload the reduced evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: entry-quality-m1-interim-20260902-${{ github.run_id }}
          path: /tmp/m1-evidence
          if-no-files-found: error
          retention-days: 30
