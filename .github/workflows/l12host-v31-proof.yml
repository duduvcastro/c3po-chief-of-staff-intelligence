# L12-HOST v3.1 Linux proof. Push ONLY this sealed tree (.github/, l12host/, evidence/, SHA256SUMS) to the disposable
# branch ops/fable-l12host-v31-proof-20261009 of a PRIVATE repository (the drafts and the contract name host paths;
# none is a secret). Synthetic only: fake docker for the suites and the root proof; REAL root systemd timers, slot
# services and units, REAL physical install through the installed runtime, a PHYSICAL DOWN session start run by a timer
# (the root proof creates the epoch-04 host paths on the disposable runner). No credential, SSH, provider, SQL, image, real container,
# owner question, signed real lot, secret path or operational job. The job FAILS if any seal, suite or check fails.
name: l12host-v31-proof
on:
  push:
    branches: [ops/fable-l12host-v31-proof-20261009]
permissions:
  contents: read
concurrency:
  group: l12host-v31-proof-20261009
  cancel-in-progress: false
jobs:
  proof:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.9 (pinned setup-python)
        id: py39
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.9'
          check-latest: false
      - name: Python 3.12 (pinned setup-python)
        id: py312
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Exact seals (pushed tree == top-level SHA256SUMS; family seal + vendor pins)
        shell: bash
        env:
          PY312: ${{ steps.py312.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          R=/tmp/l12host-v31-proof-results
          mkdir "$R"
          sha256sum --strict -c SHA256SUMS > "$R/TOP_SEAL_CHECK.txt" || exit 1
          git ls-files | LC_ALL=C sort > "$R/PUSHED_FILES.txt"
          { cut -c67- SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort > "$R/SEALED_FILES.txt"
          diff "$R/PUSHED_FILES.txt" "$R/SEALED_FILES.txt" > "$R/TREE_DIFF.txt" || { echo TREE_NOT_THE_SEALED_SET; exit 1; }
          "$PY312" -I -S -B l12host/verify_family.py > "$R/SEAL_RESULT.json" || exit 1
          sha256sum SHA256SUMS l12host/SHA256SUMS > "$R/SEAL_SHA256.txt"
      - name: Suite on Python 3.12 (setup-python, FD_EXEC_LINUX)
        shell: bash
        env:
          PY312: ${{ steps.py312.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          R=/tmp/l12host-v31-proof-results
          "$PY312" -c 'import sys; print(sys.version)' > "$R/PYTHON312_VERSION.txt"
          L12_TEST_TMP="$RUNNER_TEMP" "$PY312" -I -S -B l12host/tests/test_l12host.py > "$R/TEST_RESULT_PY312.json" 2> "$R/TEST_NAMES_PY312.txt" || exit 1
      - name: Suite on Python 3.9 (setup-python, FD_EXEC_LINUX)
        shell: bash
        env:
          PY39: ${{ steps.py39.outputs.python-path }}
        run: |
          set -euo pipefail
          umask 077
          R=/tmp/l12host-v31-proof-results
          "$PY39" -c 'import sys; assert sys.version_info[:2] == (3, 9); print(sys.version)' > "$R/PYTHON39_VERSION.txt" || exit 1
          L12_TEST_TMP="$RUNNER_TEMP" "$PY39" -I -S -B l12host/tests/test_l12host.py > "$R/TEST_RESULT_PY39.json" 2> "$R/TEST_NAMES_PY39.txt" || exit 1
      - name: Physical install + timer-run UP/DOWN slots + real systemd units as root (fake docker; must COMPLETE)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          R=/tmp/l12host-v31-proof-results
          test -x /usr/bin/python3.12 || { echo SYSTEM_PYTHON312_ABSENT; exit 1; }
          set +e
          sudo -n --preserve-env=GITHUB_ACTIONS /usr/bin/python3.12 -I -S -B l12host/linux_systemd_proof.py > "$R/SYSTEMD_RESULT.json" 2> "$R/SYSTEMD_STDERR.txt"
          rc=$?
          set -e
          sudo -n chown "$(id -u):$(id -g)" "$R/SYSTEMD_RESULT.json" "$R/SYSTEMD_STDERR.txt"
          test "$rc" = 0 || exit 1
          "${{ steps.py312.outputs.python-path }}" -I -S -B -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get("ok") is True and all(d["checks"].values()) else 1)' "$R/SYSTEMD_RESULT.json" || exit 1
          "${{ steps.py312.outputs.python-path }}" -I -S -B l12host/verify_family.py > "$R/SEAL_RESULT_AFTER.json" || exit 1
          sha256sum --strict -c SHA256SUMS > "$R/TOP_SEAL_CHECK_AFTER.txt" || exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: L12HOST_V31_OWN_LINUX_PROOF
          path: /tmp/l12host-v31-proof-results/
          if-no-files-found: error
          retention-days: 7
