name: e04-codex-linux-proof9
on:
  push:
    branches: ['ops/codex-epoch04-proof9-20261009']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: run suites
        run: |
          set +e
          python3 --version | tee py.txt
          find j4 -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum > SOURCES.sha256
          (cd j4 && python3 -B -s -m unittest -v test_hot_protocol_delta) > j4.log 2>&1; e1=$?
          python3 - "$e1" <<'PY'
          import json,sys,hashlib,platform,re
          t=open('j4.log').read(); m=re.findall(r'^Ran (\d+) tests?',t,re.M)
          r={'schema':'FABLE_E04_CODEX_LINUX_PROOF_V9','python':platform.python_version(),'platform':platform.platform(),
             'sources_sha256':hashlib.sha256(open('SOURCES.sha256','rb').read()).hexdigest(),
             'j4':{'exit':int(sys.argv[1]),'ran':int(m[-1]) if m else None,'ok':t.rstrip().endswith('OK'),'sha256':hashlib.sha256(t.encode()).hexdigest()}}
          r['pass']=r['j4']['exit']==0
          open('RESULT.json','w').write(json.dumps(r,sort_keys=True,indent=1)); print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e04-proof9
          path: |
            RESULT.json
            SOURCES.sha256
            py.txt
            *.log
      - name: fail if required suites failed
        run: python3 -c "import json,sys; sys.exit(0 if json.load(open('RESULT.json'))['pass'] else 1)"
