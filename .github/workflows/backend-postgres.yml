name: Backend PostgreSQL checks

# The backend suite runs on the in-memory double; this job runs what only a real PostgreSQL can prove, on a disposable
# server of the production major/minor (postgres 16.15) reached through a local socket under /tmp:
# 1. every migration of c3po/db applied twice to an empty database (the full chain and its idempotency);
# 2. the DSN-gated tests (`C3PO_*_TEST_DSN`), which refuse anything but a /tmp socket.
# No secret, no host, no network beyond the image and the Python packages.

on:
  pull_request:
    paths:
      - "c3po/db/**"
      - "c3po/database/Dockerfile"
      - "c3po/backend/**"
      - ".github/workflows/backend-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-postgres-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # The production database image is built FROM this base (c3po/database/Dockerfile).
  POSTGRES_IMAGE: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
  SOCKET_DIR: /tmp/c3po-pg-socket

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash  # explicit: GitHub then runs bash -eo pipefail, so `pytest | tee` keeps pytest's status
        working-directory: c3po/backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: The disposable server is the production base image
        working-directory: .
        run: |
          grep -Fx "FROM ${POSTGRES_IMAGE}" c3po/database/Dockerfile >/dev/null \
            || { echo "c3po/database/Dockerfile no longer builds FROM ${POSTGRES_IMAGE}: update this workflow" >&2; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: c3po/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Start a disposable PostgreSQL on a local socket
        run: |
          mkdir -p "$SOCKET_DIR"
          chmod 0777 "$SOCKET_DIR"
          docker run -d --name c3po-ci-postgres --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$SOCKET_DIR:/var/run/postgresql" \
            "$POSTGRES_IMAGE"
          # The image's entrypoint runs a temporary server for initdb and then restarts: wait for the init to finish
          # before trusting pg_isready.
          for _ in $(seq 1 90); do
            logs=$(docker logs c3po-ci-postgres 2>&1)
            if [[ "$logs" == *"PostgreSQL init process complete"* ]] \
              && docker exec c3po-ci-postgres pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec c3po-ci-postgres pg_isready -U postgres
          docker exec c3po-ci-postgres psql -U postgres -Atc "SELECT version()"
          docker exec c3po-ci-postgres createdb -U postgres c3po_ci_migrations
          docker exec c3po-ci-postgres createdb -U postgres c3po_ci_tests
          test -S "$SOCKET_DIR/.s.PGSQL.5432"

      - name: Apply every migration twice to an empty database
        env:
          MIGRATED_DSN: host=${{ env.SOCKET_DIR }} dbname=c3po_ci_migrations user=postgres
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg

          from app.config import Settings
          from app.database import Database

          dsn = os.environ["MIGRATED_DSN"]
          migrations = Path("../db").resolve()
          files = sorted(path.name for path in migrations.glob("*.sql") if path.name[:1].isdigit())
          assert files, "no migrations found"
          database = Database(Settings(database_url=dsn, migrations_dir=migrations))
          database.initialize()
          database.initialize()  # idempotent: the deploy applies the whole chain at every container start
          with psycopg.connect(dsn) as connection:
              tables = connection.execute(
                  "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'"
              ).fetchone()[0]
              for table in ("statement_filings", "statement_vintages", "valuation_decisions", "valuation_tp_staleness"):
                  assert connection.execute("SELECT to_regclass(%s)", (f"public.{table}",)).fetchone()[0], table
          print(f"migrations applied twice: {len(files)} files, last {files[-1]}, {tables} public tables")
          PY

      - name: Run the DSN-gated PostgreSQL tests
        env:
          C3PO_PROVIDER_HEALTH_TEST_DSN: host=${{ env.SOCKET_DIR }} dbname=c3po_ci_tests user=postgres
          C3PO_VALUATION_DECISOR_TEST_DSN: host=${{ env.SOCKET_DIR }} dbname=c3po_ci_tests user=postgres
          C3PO_MIGRATED_TEST_DSN: host=${{ env.SOCKET_DIR }} dbname=c3po_ci_migrations user=postgres
        run: |
          mapfile -t files < <(grep -l -E "C3PO_[A-Z_]+_TEST_DSN" tests/test_*.py | sort)
          test "${#files[@]}" -gt 0
          printf 'DSN-gated test files: %s\n' "${files[*]}"
          python -m pytest -q -p no:cacheprovider -rs "${files[@]}" | tee "$RUNNER_TEMP/postgres-tests.log"
          # Every file here is DSN-gated: any skip with the DSNs set is a wiring error, not a pass.
          if grep -E '^SKIPPED|[0-9]+ skipped' "$RUNNER_TEMP/postgres-tests.log"; then
            echo "a PostgreSQL test was skipped although the DSNs are set" >&2
            exit 1
          fi

      - name: Stop PostgreSQL
        if: always()
        working-directory: .
        run: docker rm -f c3po-ci-postgres >/dev/null 2>&1 || true
