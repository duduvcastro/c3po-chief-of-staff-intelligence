name: Ops read-only incidents report

# Daily (08:30 BRT, after the nightly valuation cycle ends at 08:15 BRT) and on dispatch: an AGGREGATE of the open/acknowledged operational incidents and
# of the red/amber LOCAL health cards (governance, incidents, Day D/valuation controls), produced by
# `python -m app.operational_incidents --report-json` inside the running api container of the
# production host through the deploy SSH transport of c3po-pipeline.yml, READ-ONLY:
#   - no file is copied to or written on the host, no container is created, restarted or stopped
#     (`docker compose exec` into the running api), no lock is taken;
#   - the database session is read-only in PostgreSQL itself (PGOPTIONS default_transaction_read_only=on,
#     set here and again by the module); the module never runs the external probes of the panel.
# The runner verifies the EXACT schema before anything leaves it: every key at every level is the
# whitelisted one, every string belongs to a closed vocabulary or is a UTC timestamp, the sha256
# recomputes. Only then are incidents.json and a Portuguese summary.md uploaded, and a one-line
# aggregate is posted on the Fable/Codex channel (C3PO_ESCALATION_ISSUE, default #429) only when an
# incident is open for more than 24 h — at most once per BRT day. The remote stderr stays in the
# runner's temp directory and is never printed: this repository is public.
# Every guard is explicit (`|| exit N`); nothing here relies on `set -e`.

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-readonly-report
  cancel-in-progress: false

jobs:
  read-only-report:
    name: Read-only incidents report
    runs-on: ubuntu-latest
    # Same environment as valuation-readonly-report.yml and the scheduled security-watchdog.yml, which
    # already run unattended with it (no reviewer approval observed). Its protection rules were not read
    # from the API here: if reviewers are ever required, this schedule waits for approval like those.
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      CHANNEL_ISSUE: ${{ vars.C3PO_ESCALATION_ISSUE || '429' }}
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh || exit 1
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy || exit 1
          chmod 600 ~/.ssh/c3po_deploy || exit 1
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts || exit 1
          chmod 600 ~/.ssh/known_hosts || exit 1

      - name: Run the report in the running api container, read-only
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        shell: bash
        run: |
          set -uo pipefail
          raw="$RUNNER_TEMP/raw"
          mkdir -p "$raw" || exit 1
          rc=0
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "bash -s" \
            > "$raw/incidents.json" 2> "$raw/stderr.log" <<'REMOTE' || rc=$?
          set -uo pipefail
          APP_DIR=/opt/chief-of-staff-digital
          cd "$APP_DIR" || exit 10
          if [ -e /run/c3po-security/reboot.pending ]; then
            echo 'Security reboot pending; the report must wait for recovery' >&2
            exit 11
          fi
          compose=(docker compose --env-file .env -f c3po/compose.yml)
          api=$("${compose[@]}" ps -q api) || exit 12
          [ -n "$api" ] || { echo 'api container is not running' >&2; exit 12; }
          state=$(docker inspect -f '{{.State.Status}}' "$api") || exit 12
          [ "$state" = running ] || { echo "api container is $state" >&2; exit 12; }
          exec "${compose[@]}" exec -T \
            -e 'PGOPTIONS=-c default_transaction_read_only=on' \
            api python -m app.operational_incidents --report-json </dev/null
          REMOTE
          lines=$(wc -l < "$raw/stderr.log") || exit 1
          echo "remote exit status: $rc; remote stderr lines (kept private, not printed): $lines"
          [ "$rc" -eq 0 ] || exit 1

      - name: Collect today's channel comments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          [[ "$CHANNEL_ISSUE" =~ ^[0-9]+$ ]] || { echo '::error::C3PO_ESCALATION_ISSUE must be an issue number'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/issues/$CHANNEL_ISSUE" \
            --jq '{state, locked, comments}' > "$RUNNER_TEMP/channel.json" || exit 1
          since=$(date -u -d '-2 days' +%Y-%m-%dT%H:%M:%SZ) || exit 1
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$CHANNEL_ISSUE/comments?since=$since&per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | {body}' \
            | jq -s '[.[].body]' > "$RUNNER_TEMP/channel-comments.json" || exit 1

      - name: Verify the exact schema and keep aggregates only
        id: verify
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/ops-readonly-report"
          mkdir -p "$out" || exit 1
          python3 - "$RUNNER_TEMP/raw/incidents.json" "$out" "$RUNNER_TEMP/channel-comments.json" "$RUNNER_TEMP/channel.json" <<'PY' || exit 1
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          source, out, comments_path, channel_path = Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3]), Path(sys.argv[4])
          SCHEMA = "C3PO-OPS-INCIDENTS-REPORT-v1"
          TOP = {"schema", "generated_at", "build_sha", "incidents", "health", "report_sha256"}
          INCIDENTS = {"scanned", "totals", "groups"}
          TOTALS = {"active", "open", "acknowledged", "critical", "over_24h", "oldest_age_hours"}
          GROUP = {"kind", "source", "severity", "status", "count", "over_24h", "oldest_started_at", "oldest_age_hours", "last_seen_at"}
          HEALTH = {"evaluated", "cards"}
          CARD = {"group", "card", "status"}
          VOCABULARY = {
              "kind": {"governance-vulnerability", "notification:job_failure", "notification:disk_threshold", "other"},
              "source": {"governance", "worker", "host", "other"},
              "severity": {"critical", "attention", "other"},
              "status": {"open", "acknowledged"},
          }
          CARD_VOCABULARY = {
              "group": {"governance", "controls"},
              "card": {"governance_vulnerabilities", "operational_incidents", "valuation_worker_phases", "valuation_v2_1b_cycle",
                       "v3_pre_ab_gate", "day_d_disk_reserve", "b2_zero_cap_evidence", "probe_failed", "unmapped"},
              "status": {"attention", "offline"},
          }
          TIMESTAMP = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+00:00")

          def refuse(message):
              sys.exit(f"the report was refused: {message} (content not printed)")

          def count(value, name):
              if isinstance(value, bool) or not isinstance(value, int) or not 0 <= value <= 100000:
                  refuse(f"{name} is not a non-negative count")
              return value

          def hours(value, name, nullable=False):
              if value is None and nullable:
                  return value
              if isinstance(value, bool) or not isinstance(value, (int, float)) or not 0 <= value <= 1000000:
                  refuse(f"{name} is not a non-negative number of hours")
              return value

          def instant(value, name):
              if not isinstance(value, str) or TIMESTAMP.fullmatch(value) is None:
                  refuse(f"{name} is not a UTC timestamp")
              return value

          def exact(value, keys, name):
              if not isinstance(value, dict) or set(value) != keys:
                  refuse(f"{name}: the keys are not exactly the whitelisted ones")
              return value

          def word(value, allowed, name):
              if not isinstance(value, str) or value not in allowed:
                  refuse(f"{name} is not in its closed vocabulary")
              return value

          if not source.is_file() or source.stat().st_size > 65536:
              refuse("missing or larger than an aggregate can be")
          try:
              report = json.loads(source.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              refuse("not a single JSON document")
          exact(report, TOP, "report")
          if report["schema"] != SCHEMA:
              refuse("unexpected schema")
          instant(report["generated_at"], "generated_at")
          if report["build_sha"] is not None and (not isinstance(report["build_sha"], str) or re.fullmatch(r"[0-9a-f]{40}", report["build_sha"]) is None):
              refuse("build_sha is not a commit sha")
          incidents = exact(report["incidents"], INCIDENTS, "incidents")
          count(incidents["scanned"], "scanned")
          totals = exact(incidents["totals"], TOTALS, "totals")
          for name in TOTALS - {"oldest_age_hours"}:
              count(totals[name], name)
          hours(totals["oldest_age_hours"], "oldest_age_hours", nullable=True)
          if not isinstance(incidents["groups"], list) or len(incidents["groups"]) > 64:
              refuse("groups is not a short list")
          for group in incidents["groups"]:
              exact(group, GROUP, "group")
              for name, allowed in VOCABULARY.items():
                  word(group[name], allowed, name)
              count(group["count"], "count")
              count(group["over_24h"], "over_24h")
              hours(group["oldest_age_hours"], "group oldest_age_hours")
              instant(group["oldest_started_at"], "oldest_started_at")
              instant(group["last_seen_at"], "last_seen_at")
          health = exact(report["health"], HEALTH, "health")
          count(health["evaluated"], "evaluated")
          if not isinstance(health["cards"], list) or len(health["cards"]) > 64:
              refuse("cards is not a short list")
          for card in health["cards"]:
              exact(card, CARD, "card")
              for name, allowed in CARD_VOCABULARY.items():
                  word(card[name], allowed, name)
          body = {key: value for key, value in report.items() if key != "report_sha256"}
          digest = hashlib.sha256(json.dumps(body, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")).hexdigest()
          if report["report_sha256"] != digest:
              refuse("report_sha256 does not recompute")
          if sum(group["count"] for group in incidents["groups"]) != totals["active"] or sum(group["over_24h"] for group in incidents["groups"]) != totals["over_24h"]:
              refuse("the groups do not add up to the totals")

          (out / "incidents.json").write_text(json.dumps(report, sort_keys=True, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          red = sum(card["status"] == "offline" for card in health["cards"])
          amber = sum(card["status"] == "attention" for card in health["cards"])
          brt = datetime.fromisoformat(report["generated_at"]).astimezone(timezone(timedelta(hours=-3)))
          kinds = {"governance-vulnerability": "governança e vulnerabilidades", "notification:job_failure": "falha de job",
                   "notification:disk_threshold": "limite de disco", "other": "outro"}
          lines = [f"## Relatório read-only de incidentes — {brt:%d/%m/%Y %H:%M} BRT", "",
                   f"- Incidentes ativos: {totals['active']} (abertos {totals['open']}, reconhecidos {totals['acknowledged']}, "
                   f"críticos {totals['critical']}); abertos há mais de 24 h: {totals['over_24h']}"
                   + (f"; o mais antigo há {totals['oldest_age_hours']} h" if totals["oldest_age_hours"] is not None else ""),
                   f"- Cartões de saúde locais avaliados: {health['evaluated']}; vermelhos {red}, âmbar {amber}", ""]
          if incidents["groups"]:
              lines += ["| tipo | origem | severidade | estado | quantidade | > 24 h | mais antigo (h) | última observação (UTC) |",
                        "|---|---|---|---|---|---|---|---|"]
              lines += [f"| {kinds[g['kind']]} | {g['source']} | {g['severity']} | {g['status']} | {g['count']} | {g['over_24h']} | "
                        f"{g['oldest_age_hours']} | {g['last_seen_at']} |" for g in incidents["groups"]]
              lines.append("")
          if health["cards"]:
              lines += ["| grupo | cartão | estado |", "|---|---|---|"]
              lines += [f"| {c['group']} | {c['card']} | {'vermelho' if c['status'] == 'offline' else 'âmbar'} |" for c in health["cards"]]
              lines.append("")
          lines.append(f"Somente agregados (sem chaves, títulos, detalhes ou símbolos). report_sha256 `{report['report_sha256']}`; "
                       f"revisão implantada `{report['build_sha']}`.")
          summary = "\n".join(lines) + "\n"
          (out / "summary.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)

          post = False
          if totals["over_24h"] > 0:
              marker = f"<!-- c3po-ops-readonly-report:{brt.date().isoformat()} -->"
              comments = json.loads(comments_path.read_text(encoding="utf-8"))
              channel = json.loads(channel_path.read_text(encoding="utf-8"))
              if not isinstance(comments, list):
                  refuse("the channel comment listing is not a list")
              done = any(isinstance(item, str) and item.split("\n", 1)[0].strip() == marker for item in comments)
              usable = isinstance(channel, dict) and channel.get("state") == "open" and channel.get("locked") is False \
                  and isinstance(channel.get("comments"), int) and channel["comments"] < 2400
              if not done and not usable:
                  print("::warning::the channel is closed, locked or full: the aggregate stays in the artifact only")
              if not done and usable:
                  line = (f"Incidentes abertos há mais de 24 h: {totals['over_24h']} de {totals['active']} ativos "
                          f"({totals['critical']} críticos; o mais antigo há {totals['oldest_age_hours']} h); cartões de saúde "
                          f"vermelhos {red}, âmbar {amber} — [relatório read-only]({os.environ['RUN_URL']})")
                  (out.parent / "ops-readonly-comment.md").write_text(f"{marker}\n{line}\n", encoding="utf-8")
                  post = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"post={'true' if post else 'false'}\n")
          print(f"report_sha256 {report['report_sha256']}; active {totals['active']}; over 24 h {totals['over_24h']}; red {red}; amber {amber}")
          PY
          (cd "$out" && sha256sum incidents.json summary.md > SHA256SUMS) || exit 1

      - name: Publish the aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: ops-readonly-report-${{ github.run_id }}
          path: ${{ runner.temp }}/ops-readonly-report
          if-no-files-found: error
          retention-days: 30

      - name: Post the one-line aggregate to the Fable-Codex channel
        if: steps.verify.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$CHANNEL_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/ops-readonly-comment.md"
