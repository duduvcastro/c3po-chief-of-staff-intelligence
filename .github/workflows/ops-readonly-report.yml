name: Ops read-only incidents report

# Twice a day (03:30 BRT, after the nightly phases, and 08:30 BRT, after the nightly valuation cycle ends at 08:15 BRT) and on
# dispatch: an AGGREGATE of the open/acknowledged operational incidents, of the red/amber LOCAL health cards (governance,
# incidents, Day D/valuation controls) and of the ingestion runs still running after 30 min, produced by
# `python -m app.operational_incidents --report-json` inside the running api container of the
# production host through the deploy SSH transport of c3po-pipeline.yml, READ-ONLY:
#   - no file is copied to or written on the host, no container is created, restarted or stopped
#     (`docker compose exec` into the running api), no lock is taken;
#   - the database session is read-only in PostgreSQL itself (PGOPTIONS default_transaction_read_only=on,
#     set here and again by the module); the module never runs the external probes of the panel.
# The runner verifies the EXACT schema before anything leaves it: every key at every level is the
# whitelisted one, every string belongs to a closed vocabulary or is a UTC timestamp, the sha256
# recomputes. Only then are incidents.json and a Portuguese summary.md uploaded. When a health card is red, a critical
# incident is open or an incident is open for more than 24 h, ONE comment per run (marker
# `<!-- c3po-ops-readonly-report:YYYY-MM-DD:HHMM -->`, BRT day and scheduled slot) lists them on the Fable/Codex channel
# (C3PO_ESCALATION_ISSUE, default #429); a red card or a critical incident also fails the job, so the run shows red in
# Actions. A run that fails for any other reason (host unreachable, report refused, channel error) posts ONE line per BRT
# day, "varredura noturna falhou", with the run id and the failing step name (marker
# `<!-- c3po-ops-readonly-report-failed:YYYY-MM-DD -->`). The remote stderr stays in the runner's temp directory and is never printed: this repository is public.
# Every guard is explicit (`|| exit N`); nothing here relies on `set -e`.

on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-readonly-report
  cancel-in-progress: false

jobs:
  read-only-report:
    name: Read-only incidents report
    runs-on: ubuntu-latest
    # Same environment as valuation-readonly-report.yml and the scheduled security-watchdog.yml, which
    # already run unattended with it (no reviewer approval observed). Its protection rules were not read
    # from the API here: if reviewers are ever required, this schedule waits for approval like those.
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      CHANNEL_ISSUE: ${{ vars.C3PO_ESCALATION_ISSUE || '429' }}
    steps:
      - name: Check out the workflow revision
        id: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure deployment SSH key
        id: ssh
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh || exit 1
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy || exit 1
          chmod 600 ~/.ssh/c3po_deploy || exit 1
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts || exit 1
          chmod 600 ~/.ssh/known_hosts || exit 1

      - name: Run the report in the running api container, read-only
        id: remote
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        shell: bash
        run: |
          set -uo pipefail
          raw="$RUNNER_TEMP/raw"
          mkdir -p "$raw" || exit 1
          rc=0
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "bash -s" \
            > "$raw/incidents.json" 2> "$raw/stderr.log" <<'REMOTE' || rc=$?
          set -uo pipefail
          APP_DIR=/opt/chief-of-staff-digital
          cd "$APP_DIR" || exit 10
          if [ -e /run/c3po-security/reboot.pending ]; then
            echo 'Security reboot pending; the report must wait for recovery' >&2
            exit 11
          fi
          compose=(docker compose --env-file .env -f c3po/compose.yml)
          api=$("${compose[@]}" ps -q api) || exit 12
          [ -n "$api" ] || { echo 'api container is not running' >&2; exit 12; }
          state=$(docker inspect -f '{{.State.Status}}' "$api") || exit 12
          [ "$state" = running ] || { echo "api container is $state" >&2; exit 12; }
          exec "${compose[@]}" exec -T \
            -e 'PGOPTIONS=-c default_transaction_read_only=on' \
            api python -m app.operational_incidents --report-json </dev/null
          REMOTE
          lines=$(wc -l < "$raw/stderr.log") || exit 1
          echo "remote exit status: $rc; remote stderr lines (kept private, not printed): $lines"
          [ "$rc" -eq 0 ] || exit 1

      - name: Collect today's channel comments
        id: comments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          [[ "$CHANNEL_ISSUE" =~ ^[0-9]+$ ]] || { echo '::error::C3PO_ESCALATION_ISSUE must be an issue number'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/issues/$CHANNEL_ISSUE" \
            --jq '{state, locked, comments}' > "$RUNNER_TEMP/channel.json" || exit 1
          since=$(date -u -d '-2 days' +%Y-%m-%dT%H:%M:%SZ) || exit 1
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$CHANNEL_ISSUE/comments?since=$since&per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | {body}' \
            | jq -s '[.[].body]' > "$RUNNER_TEMP/channel-comments.json" || exit 1

      - name: Verify the exact schema and keep aggregates only
        id: verify
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/ops-readonly-report"
          mkdir -p "$out" || exit 1
          python3 - "$RUNNER_TEMP/raw/incidents.json" "$out" "$RUNNER_TEMP/channel-comments.json" "$RUNNER_TEMP/channel.json" <<'PY' || exit 1
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          source, out, comments_path, channel_path = Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3]), Path(sys.argv[4])
          SCHEMA = "C3PO-OPS-INCIDENTS-REPORT-v3"
          TOP = {"schema", "generated_at", "build_sha", "incidents", "health", "stale_running_ingestion", "diagnostics", "report_sha256"}
          STALE = {"threshold_minutes", "count", "oldest_age_minutes"}
          SLOTS = {"30 6 * * *": "0330", "30 11 * * *": "0830"}
          INCIDENTS = {"scanned", "totals", "groups"}
          TOTALS = {"active", "open", "acknowledged", "critical", "over_24h", "oldest_age_hours"}
          GROUP = {"kind", "source", "severity", "status", "count", "over_24h", "oldest_started_at", "oldest_age_hours", "last_seen_at"}
          HEALTH = {"evaluated", "cards"}
          CARD = {"group", "card", "status"}
          VOCABULARY = {
              "kind": {"governance-vulnerability", "notification:job_failure", "notification:disk_threshold", "other"},
              "source": {"governance", "worker", "host", "other"},
              "severity": {"critical", "attention", "other"},
              "status": {"open", "acknowledged"},
          }
          CARD_VOCABULARY = {
              "group": {"governance", "controls"},
              "card": {"governance_vulnerabilities", "operational_incidents", "valuation_worker_phases", "valuation_v2_1b_cycle",
                       "v3_pre_ab_gate", "day_d_disk_reserve", "b2_zero_cap_evidence", "probe_failed", "unmapped"},
              "status": {"attention", "offline"},
          }
          DIAGNOSTICS = {"job_failure_families", "governance", "decisor"}
          DECISOR = {"night", "status", "rows", "by_verdict", "reasons", "sole_blocker"}
          DECISOR_STATUSES = {"ok", "CALENDAR_UNAVAILABLE", "DECISIONS_ONLY_AFTER_NEXT_OPEN", "GENERATION_NOT_DECIDED", "NIGHT_INVALID",
                              "NIGHT_NOT_CLOSED", "NOT_A_SESSION", "NO_DECISIONS", "RUN_INCONSISTENT", "UNVERIFIED_DECISIONS", "error", "other"}
          DECISOR_VERDICTS = {"COMPRA_PERMITIDA", "OBSERVAR", "VETO", "other"}
          REASON_CODES = {"ALL_GATES_PASSED", "CONFIDENCE_LOW", "CONFIDENCE_UNKNOWN", "CONSENSUS_EPS_CUT_30D", "DATA_DEFECT",
                          "EARNINGS_CALENDAR_ROW_INVALID", "EARNINGS_CALENDAR_UNAVAILABLE", "EARNINGS_DATE_ESTIMATED", "EARNINGS_WITHIN_N",
                          "E_PROFILE_UNAVAILABLE", "E_PROFILE_WARMING_UP", "FUNDAMENTALS_DATE_UNKNOWN", "FUNDAMENTALS_STALE",
                          "MARKET_RATE_UNAVAILABLE", "METHOD_DISPERSION_HIGH", "METHOD_DISPERSION_UNKNOWN", "NEWS_SENTIMENT_NEGATIVE",
                          "NOT_VALIDATED", "PRICE_ABOVE_BUY_IN", "PRICE_MOVED_SINCE_CUT", "PRICE_SESSION_STALE", "PRICE_UNAVAILABLE",
                          "STALENESS_SOURCE_STALE", "STALENESS_SOURCE_UNAVAILABLE", "TP_MARGIN_INSUFFICIENT", "TP_SESSION_STALE",
                          "TP_STALE_AFTER_FILING", "TP_STALE_FLAG", "other"}
          FAMILIES = {"security-automation-failure", "governance-job-failure", "valuation-phase-failure",
                      "valuation-canonical-failure", "other"}
          GOVERNANCE = {"attestation", "layers", "routine", "blockers", "grace", "os_security_pending", "reboot_required",
                        "npm_high_or_critical", "remediation_lanes"}
          LAYERS = {"dependabot", "governance", "operating_system", "production_images", "remediation_lanes", "security_automation"}
          LAYER_STATUSES = {"healthy", "attention", "offline", "missing", "other"}
          ROUTINE = {"observed", "preliminary", "failed", "maintenance_hold", "reboot_requested", "reboot_action",
                     "blocked_missing_evidence", "waiting_npm_evidence", "blocked_unhealthy_host", "waiting_maintenance_window",
                     "blocked_scan_dispatch", "waiting_main_deploy", "blocked_branch_protection", "waiting_pipeline",
                     "waiting_security_tests", "waiting_branch_rules", "baseline_changed_or_hold",
                     "merged_waiting_deploy_and_rescan", "no_validated_candidate", "missing", "other"}
          BLOCKERS = {"deploy_lag", "npm_evidence_pending", "image_scan_predates_deploy", "errors", "alerts",
                      "os_security_pending", "reboot_required", "image_findings_or_unavailable", "unhealthy_host",
                      "routine_failed", "other"}
          GRACE = {"active", "status_not_attention", "layer_not_healthy", "routine_not_waiting", "npm_findings",
                   "blockers_not_post_deploy", "pending_mismatch", "revision_mismatch", "anchor_invalid",
                   "deployed_at_invalid", "expired", "missing", "other"}
          TIMESTAMP = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+00:00")

          def refuse(message):
              sys.exit(f"the report was refused: {message} (content not printed)")

          def count(value, name):
              if isinstance(value, bool) or not isinstance(value, int) or not 0 <= value <= 100000:
                  refuse(f"{name} is not a non-negative count")
              return value

          def hours(value, name, nullable=False):
              if value is None and nullable:
                  return value
              if isinstance(value, bool) or not isinstance(value, (int, float)) or not 0 <= value <= 1000000:
                  refuse(f"{name} is not a non-negative number of hours")
              return value

          def instant(value, name):
              if not isinstance(value, str) or TIMESTAMP.fullmatch(value) is None:
                  refuse(f"{name} is not a UTC timestamp")
              return value

          def exact(value, keys, name):
              if not isinstance(value, dict) or set(value) != keys:
                  refuse(f"{name}: the keys are not exactly the whitelisted ones")
              return value

          def word(value, allowed, name):
              if not isinstance(value, str) or value not in allowed:
                  refuse(f"{name} is not in its closed vocabulary")
              return value

          if not source.is_file() or source.stat().st_size > 65536:
              refuse("missing or larger than an aggregate can be")
          try:
              report = json.loads(source.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              refuse("not a single JSON document")
          exact(report, TOP, "report")
          if report["schema"] != SCHEMA:
              refuse("unexpected schema")
          instant(report["generated_at"], "generated_at")
          if report["build_sha"] is not None and (not isinstance(report["build_sha"], str) or re.fullmatch(r"[0-9a-f]{40}", report["build_sha"]) is None):
              refuse("build_sha is not a commit sha")
          incidents = exact(report["incidents"], INCIDENTS, "incidents")
          count(incidents["scanned"], "scanned")
          totals = exact(incidents["totals"], TOTALS, "totals")
          for name in TOTALS - {"oldest_age_hours"}:
              count(totals[name], name)
          hours(totals["oldest_age_hours"], "oldest_age_hours", nullable=True)
          if not isinstance(incidents["groups"], list) or len(incidents["groups"]) > 64:
              refuse("groups is not a short list")
          for group in incidents["groups"]:
              exact(group, GROUP, "group")
              for name, allowed in VOCABULARY.items():
                  word(group[name], allowed, name)
              count(group["count"], "count")
              count(group["over_24h"], "over_24h")
              hours(group["oldest_age_hours"], "group oldest_age_hours")
              instant(group["oldest_started_at"], "oldest_started_at")
              instant(group["last_seen_at"], "last_seen_at")
          health = exact(report["health"], HEALTH, "health")
          count(health["evaluated"], "evaluated")
          if not isinstance(health["cards"], list) or len(health["cards"]) > 64:
              refuse("cards is not a short list")
          for card in health["cards"]:
              exact(card, CARD, "card")
              for name, allowed in CARD_VOCABULARY.items():
                  word(card[name], allowed, name)
          stale = exact(report["stale_running_ingestion"], STALE, "stale_running_ingestion")
          if stale["threshold_minutes"] != 30:
              refuse("threshold_minutes is not 30")
          count(stale["count"], "stale count")
          if stale["oldest_age_minutes"] is not None:
              count(stale["oldest_age_minutes"], "oldest_age_minutes")
          if (stale["count"] == 0) != (stale["oldest_age_minutes"] is None):
              refuse("the stale runs do not match their oldest age")
          diag = exact(report["diagnostics"], DIAGNOSTICS, "diagnostics")
          families = diag["job_failure_families"]
          if not isinstance(families, dict) or not set(families) <= FAMILIES:
              refuse("job_failure_families is not in its closed vocabulary")
          for name in families:
              count(families[name], "family count")
          gov = exact(diag["governance"], GOVERNANCE, "governance diagnostics")
          word(gov["attestation"], LAYER_STATUSES, "attestation")
          layers = exact(gov["layers"], LAYERS, "layers")
          for name in LAYERS:
              word(layers[name], LAYER_STATUSES, "layer status")
          word(gov["routine"], ROUTINE, "routine")
          word(gov["grace"], GRACE, "grace")
          if not isinstance(gov["blockers"], list) or len(gov["blockers"]) > len(BLOCKERS) or gov["blockers"] != sorted(set(gov["blockers"])):
              refuse("blockers is not a sorted set")
          for item in gov["blockers"]:
              word(item, BLOCKERS, "blocker")
          for name in ("os_security_pending", "npm_high_or_critical", "remediation_lanes"):
              if gov[name] is not None:
                  count(gov[name], name)
          if gov["reboot_required"] not in (True, False, None):
              refuse("reboot_required is not a boolean")
          decisor = exact(diag["decisor"], DECISOR, "decisor diagnostics")
          word(decisor["status"], DECISOR_STATUSES, "decisor status")
          if decisor["night"] is not None and (not isinstance(decisor["night"], str)
                                               or re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", decisor["night"]) is None):
              refuse("decisor night is not a date")
          count(decisor["rows"], "decisor rows")
          for name, allowed in (("by_verdict", DECISOR_VERDICTS), ("reasons", REASON_CODES), ("sole_blocker", REASON_CODES)):
              if not isinstance(decisor[name], dict) or not set(decisor[name]) <= allowed:
                  refuse(f"decisor {name} is not in its closed vocabulary")
              for key in decisor[name]:
                  count(decisor[name][key], f"decisor {name} count")
          if sum(decisor["by_verdict"].values()) != decisor["rows"]:
              refuse("the decisor verdicts do not add up to its rows")
          body = {key: value for key, value in report.items() if key != "report_sha256"}
          digest = hashlib.sha256(json.dumps(body, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")).hexdigest()
          if report["report_sha256"] != digest:
              refuse("report_sha256 does not recompute")
          if sum(group["count"] for group in incidents["groups"]) != totals["active"] or sum(group["over_24h"] for group in incidents["groups"]) != totals["over_24h"]:
              refuse("the groups do not add up to the totals")

          (out / "incidents.json").write_text(json.dumps(report, sort_keys=True, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          red = sum(card["status"] == "offline" for card in health["cards"])
          amber = sum(card["status"] == "attention" for card in health["cards"])
          brt = datetime.fromisoformat(report["generated_at"]).astimezone(timezone(timedelta(hours=-3)))
          kinds = {"governance-vulnerability": "governança e vulnerabilidades", "notification:job_failure": "falha de job",
                   "notification:disk_threshold": "limite de disco", "other": "outro"}
          lines = [f"## Relatório read-only de incidentes — {brt:%d/%m/%Y %H:%M} BRT", "",
                   f"- Incidentes ativos: {totals['active']} (abertos {totals['open']}, reconhecidos {totals['acknowledged']}, "
                   f"críticos {totals['critical']}); abertos há mais de 24 h: {totals['over_24h']}"
                   + (f"; o mais antigo há {totals['oldest_age_hours']} h" if totals["oldest_age_hours"] is not None else ""),
                   f"- Cartões de saúde locais avaliados: {health['evaluated']}; vermelhos {red}, âmbar {amber}",
                   f"- Ingestões em execução há mais de 30 min: {stale['count']}"
                   + (f"; a mais antiga há {stale['oldest_age_minutes']} min" if stale["oldest_age_minutes"] is not None else ""), ""]
          if incidents["groups"]:
              lines += ["| tipo | origem | severidade | estado | quantidade | > 24 h | mais antigo (h) | última observação (UTC) |",
                        "|---|---|---|---|---|---|---|---|"]
              lines += [f"| {kinds[g['kind']]} | {g['source']} | {g['severity']} | {g['status']} | {g['count']} | {g['over_24h']} | "
                        f"{g['oldest_age_hours']} | {g['last_seen_at']} |" for g in incidents["groups"]]
              lines.append("")
          if health["cards"]:
              lines += ["| grupo | cartão | estado |", "|---|---|---|"]
              lines += [f"| {c['group']} | {c['card']} | {'vermelho' if c['status'] == 'offline' else 'âmbar'} |" for c in health["cards"]]
              lines.append("")
          gov = report["diagnostics"]["governance"]
          families = report["diagnostics"]["job_failure_families"]
          lines += ["Diagnóstico (vocabulário fechado):",
                    "- Falhas de job por família: " + (", ".join(f"{name} {n}" for name, n in sorted(families.items())) or "nenhuma"),
                    f"- Atestado de governança: {gov['attestation']}; camadas: "
                    + ", ".join(f"{name} {status}" for name, status in sorted(gov["layers"].items())),
                    f"- Rotina de segurança: {gov['routine']}; bloqueadores: {', '.join(gov['blockers']) or 'nenhum'}; "
                    f"carência pós-deploy: {gov['grace']}",
                    f"- SO: atualizações de segurança pendentes {gov['os_security_pending']}, reboot pendente {gov['reboot_required']}; "
                    f"npm alto/crítico {gov['npm_high_or_critical']}; lanes de remediação {gov['remediation_lanes']}"]
          decisor = report["diagnostics"]["decisor"]
          lines += [f"- Decisor (noite {decisor['night']}, {decisor['status']}): {decisor['rows']} linhas; veredictos "
                    + (", ".join(f"{name} {n}" for name, n in decisor["by_verdict"].items()) or "nenhum")
                    + "; motivos (linhas com o código): "
                    + (", ".join(f"{name} {n}" for name, n in sorted(decisor["reasons"].items(), key=lambda item: (-item[1], item[0])))
                       or "nenhum")
                    + "; único bloqueio (linhas que só esse código segura): "
                    + (", ".join(f"{name} {n}" for name, n in sorted(decisor["sole_blocker"].items(), key=lambda item: (-item[1], item[0])))
                       or "nenhum"), ""]
          lines.append(f"Somente agregados (sem chaves, títulos, detalhes ou símbolos). report_sha256 `{report['report_sha256']}`; "
                       f"revisão implantada `{report['build_sha']}`.")
          summary = "\n".join(lines) + "\n"
          (out / "summary.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)

          slot = SLOTS.get(os.environ.get("EVENT_SCHEDULE") or "", f"{brt:%H%M}")
          marker = f"<!-- c3po-ops-readonly-report:{brt.date().isoformat()}:{slot} -->"
          red_cards = [card for card in health["cards"] if card["status"] == "offline"]
          failing = bool(red_cards) or totals["critical"] > 0
          post = False
          if failing or totals["over_24h"] > 0:
              comments = json.loads(comments_path.read_text(encoding="utf-8"))
              channel = json.loads(channel_path.read_text(encoding="utf-8"))
              if not isinstance(comments, list):
                  refuse("the channel comment listing is not a list")
              done = any(isinstance(item, str) and item.split("\n", 1)[0].strip() == marker for item in comments)
              usable = isinstance(channel, dict) and channel.get("state") == "open" and channel.get("locked") is False \
                  and isinstance(channel.get("comments"), int) and channel["comments"] < 2400
              if done:
                  print("this run's marker is already on the channel: not posted again")
              elif not usable:
                  print("::warning::the channel is closed, locked or full: the aggregate stays in the artifact only")
              else:
                  body = [marker,
                          f"**Relatório read-only {brt:%d/%m/%Y %H:%M} BRT** — cartões de saúde vermelhos {red}, âmbar {amber}; "
                          f"incidentes ativos {totals['active']} ({totals['critical']} críticos, {totals['over_24h']} há mais de 24 h); "
                          f"ingestões presas há mais de 30 min: {stale['count']} — [relatório read-only]({os.environ['RUN_URL']})", ""]
                  body += [f"- [vermelho] cartão `{card['group']}/{card['card']}`" for card in red_cards]
                  if totals["critical"]:
                      body.append(f"- [crítico] {totals['critical']} incidente(s) crítico(s) aberto(s)")
                  if totals["over_24h"]:
                      body.append(f"- [> 24 h] {totals['over_24h']} incidente(s) aberto(s) há mais de 24 h "
                                  f"(o mais antigo há {totals['oldest_age_hours']} h)")
                  (out.parent / "ops-readonly-comment.md").write_text("\n".join(body) + "\n", encoding="utf-8")
                  post = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"post={'true' if post else 'false'}\nred={'true' if failing else 'false'}\n")
          print(f"report_sha256 {report['report_sha256']}; active {totals['active']}; critical {totals['critical']}; "
                f"over 24 h {totals['over_24h']}; red {red}; amber {amber}; stale runs {stale['count']}; marker {marker}")
          PY
          (cd "$out" && sha256sum incidents.json summary.md > SHA256SUMS) || exit 1

      - name: Publish the aggregate report
        id: publish
        uses: actions/upload-artifact@v4
        with:
          name: ops-readonly-report-${{ github.run_id }}
          path: ${{ runner.temp }}/ops-readonly-report
          if-no-files-found: error
          retention-days: 30

      - name: Post the aggregate to the Fable-Codex channel
        id: post
        if: steps.verify.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$CHANNEL_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/ops-readonly-comment.md"

      - name: Fail the run when a card is red or a critical incident is open
        id: fail_red
        if: steps.verify.outputs.red == 'true'
        run: |
          echo '::error::red health card or critical incident open (see the summary and the channel)'
          exit 1

      - name: Report a failed sweep to the Fable-Codex channel
        # Any failure except the deliberate red step above (whose findings were already posted): never silent.
        if: failure() && steps.fail_red.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_JSON: ${{ toJSON(steps) }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          [[ "$CHANNEL_ISSUE" =~ ^[0-9]+$ ]] || { echo '::error::C3PO_ESCALATION_ISSUE must be an issue number'; exit 1; }
          since=$(date -u -d '-2 days' +%Y-%m-%dT%H:%M:%SZ) || exit 1
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$CHANNEL_ISSUE/comments?since=$since&per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | {body}' \
            | jq -s '[.[].body]' > "$RUNNER_TEMP/failure-comments.json" || exit 1
          python3 - "$RUNNER_TEMP/failure-comments.json" "$RUNNER_TEMP/failure-comment.md" <<'PY' || exit 1
          import json
          import os
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          comments_path, body_path = Path(sys.argv[1]), Path(sys.argv[2])
          NAMES = {
              "checkout": "Check out the workflow revision",
              "ssh": "Configure deployment SSH key",
              "remote": "Run the report in the running api container, read-only",
              "comments": "Collect today's channel comments",
              "verify": "Verify the exact schema and keep aggregates only",
              "publish": "Publish the aggregate report",
              "post": "Post the aggregate to the Fable-Codex channel",
          }
          steps = json.loads(os.environ.get("STEPS_JSON") or "{}")
          failed = next((name for key, name in NAMES.items()
                         if isinstance(steps.get(key), dict) and steps[key].get("outcome") == "failure"), "passo não identificado")
          brt = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=-3)))
          marker = f"<!-- c3po-ops-readonly-report-failed:{brt.date().isoformat()} -->"
          comments = json.loads(comments_path.read_text(encoding="utf-8"))
          if not isinstance(comments, list):
              sys.exit("the channel comment listing is not a list")
          if any(isinstance(item, str) and item.split("\n", 1)[0].strip() == marker for item in comments):
              print("today's failure marker is already on the channel: not posted again")
              sys.exit(0)
          run_id = os.environ["RUN_ID"] if os.environ.get("RUN_ID", "").isdigit() else "?"
          body_path.write_text(f"{marker}\nvarredura noturna falhou — execução {run_id}, passo: {failed} — "
                               f"[execução]({os.environ['RUN_URL']})\n", encoding="utf-8")
          print(f"failure reported: {failed}")
          PY
          if [ -f "$RUNNER_TEMP/failure-comment.md" ]; then
            gh issue comment "$CHANNEL_ISSUE" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/failure-comment.md" || exit 1
          fi
