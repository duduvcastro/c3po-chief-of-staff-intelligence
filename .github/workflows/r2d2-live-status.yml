name: Host migration to the 8 GB host (one-off branch, never merged)

# BRANCH fable/host-migration-8gb, never merged. This file REPLACES r2d2-live-status.yml on the branch only, the proven
# way to dispatch a one-off workflow (gh workflow run r2d2-live-status.yml --ref fable/host-migration-8gb -f phase=X
# -f confirm=X); main keeps its own r2d2-live-status.yml. Owner 03/11/2026: "8 GB no fim de semana"; plan v2 in #501.
# A Lightsail snapshot only creates an instance with an equal or larger disk (640 GB there, 160 GB here), so the move
# is a fresh install plus a copy of the data. One phase per dispatch, each only after the Codex's GO on this commit:
#   A    new host (temporary address): packages pinned and the six Docker ones held, the old host's image store, swap,
#        sysstat, timezone. Re-runnable: drifted Docker packages on the still empty store go back to run 1's state.
#        The holds stay after the move; a later, deliberate Docker upgrade lifts them (apt-mark unhold). No writer.
#   B    old -> new through this runner: app tree (volatile trees excluded), journald, the Day-D guard (its five drop-ins
#        and the crontab stored INERT, its helper in /usr/local/libexec copied inert), authorized_keys (the deploy key
#        itself checked), images (IDs compared). No writer.
#   BV   read-only, after B: the revision copied (.deploy-version and the backend image's label, both the named sha) and
#        every other copy of B by hash on both hosts (journald, drop-ins, crontab, authorized_keys, the deploy user's
#        ssh/git, the export log, helpers, policy), the drop-ins' references by type, mode and owner, and the new host's
#        store modes and inertness. Only "=match", counts and the revision are printed; the hashes stay in the runner.
#   C0   old: the crontab out of the way, the only change before C1a: saved once, emptied, the emptying proven and
#        recorded, every job cron had already started waited for, then C0's drained record. Nothing from the crontab starts there any more, so
#        B, BV and C1a run against a quiet crontab at any hour (root's jobs and the c3po timers still run until C1a
#        masks them; what they write in the compared trees, images or database is refused by C1a's comparisons, C1b's
#        final ones and writes_after_dump). C0u undoes it before C1a; after C1a only R0 does.
#   R    rehearsal of the data path on the LIVE old database (one REPEATABLE READ snapshot: dump, globals with the role
#        password hashes, exact counts), restored on a throwaway volume of the new host and compared, then removed.
#   C1a  old: C0 complete and its saved crontab B's, the drift checks, the admission (the drain), the hold and its
#        record, c3po-* and apt timers masked, logs kept, ingress and writers stopped (db up), final dump/globals/counts,
#        one offsite backup. Then the restore drill is dispatched by hand.
#   C1b  old: db stopped clean; volatile trees, one-pagers and the final dump copied and compared, the reports clone and
#        the images compared again; Docker masked; Day-D
#        unmounted; power-off. Then the console moves the disk and the static IP, and the operator puts the new host's
#        console-verified key into C3PO_AWS_KNOWN_HOSTS.
#   C2   new (static address): Day-D mounted by UUID (hash below, never formatted), guards installed (every stored unit,
#        sockets too; containerd and Docker restarted through them), legacy network
#        and containers created (not started), the database alone restored and compared. Then the production pipeline is
#        dispatched by hand with the named revision: T_WRITE starts there.
#   C3L  new: cloudflared and pluggy-webhook started (one tunnel connector). D: the old crontab installed (its first
#        runs: the 21:15 export that evening, the 03:30 prune and the 07:00 summary on Sunday). Then the host installers
#        (install-host-security-v1.yml, install-resilience-ops-v1.yml) are dispatched by hand; D2 checks what they left:
#        the backup timer waiting for Sunday 04:00 without a catch-up run, the security timers, the hold.
#   E    Sunday, after the first night is read: the hold removed (the security routine acts again).
#   R0n  back-out BEFORE T_WRITE only, on the new host at the static address: Docker stopped and masked, Day-D unmounted,
#        power-off; then the console returns disk and IP and the operator restores the old C3PO_AWS_KNOWN_HOSTS.
#   R0   then, on the old host powered on again: Docker unmasked, disk mounted, stack, timers and crontab back.
# Every phase that changes or loads a host starts only from 05:36 to 18:29 BRT (back-outs and read-only phases at any
# hour; A and R are done and retired). Every host command of a run (direct, a transfer or a shipped script) runs on the
# host under a timeout to the run's absolute DEADLINE (ten minutes before the job's own limit), computed there when it
# starts: at DEADLINE the host sends TERM to the command's process group and KILL 20 s later to its main process if
# still alive; a host clock up to 30 s behind is admitted. That TERM reaches only the user's processes: a root process
# under sudo is out of its reach, and sudo relays no signal sent from its own process group. So in the payloads of C0,
# C1a, C1b, C2, C3L and R0n each root command that hands work to a daemon carries its own bound, admitted with it left
# before DEADLINE (R0, the old host's back-out, and the runner's volume creation in C1b do not); the other root
# commands are local reads and writes, the ends of transfers (they stop with their stream) and the unmount. The edge
# is DEADLINE plus about 50 s and the ssh set-up, except for a cancel the TERM itself sets off, ending in its bounds.
# In C0, C1a, C1b, C2, C3L and R0n the changes a daemon may carry on with after its client is gone (container stops
# and starts, commands in the database container, the restore, the backup unit) start only with their bound and their
# cancel's time left. From the first cancel armed on, a TERM, HUP or INT is held until the command in flight has
# returned, then runs the cancel armed at that moment once (none after a disarm) and ends the script; every cancel
# ignores any further signal, so none cuts it short. On any exit while
# they may run, the database's client sessions are ended and that proven (a fresh count of 0 from a superuser and no
# client program left in its container; pg_terminate_backend only sends the signal), and the backup unit is
# stopped within its own stop timeout, read at admission, its end confirmed by its state and by no compose one-off
# left. A hand-off whose effect is waited for (the backup, Docker's start) has its cancel armed before it: only the
# admission's own refusal, before anything is handed off, disarms it, so a start queued whose client errs or is cut,
# or a TERM in the hand-off, is cancelled too, after its client has returned; every state read is bounded, and the
# cancel's time is kept before the reads and checked again after them. Every other stop or start handed to systemd
# there is blocking and admitted in the very root process that hands it off with the units' own timeouts left (plus
# what must follow it, where a sequence goes on), read from the manager (not finite: refused; a stop counted at four
# kill stages per unit), so the effect itself ends within them. B restarts nothing (journald's copied limits apply at
# its next start). D only installs a crontab. The power-offs are scheduled 20 s ahead only while their own worst case
# (poweroff.target's 30 minutes, then the forced action's final stage at the manager's default stop timeout) fits
# before DEADLINE; C1b (before its database stop, and again in its last payload) and R0n begin only with the whole
# sequence's worst case left, computed from the same timeouts before its first change, and admit each later change
# with the rest of it left. C1b runs only inside a live C1a attempt (its hold record) and C1b and C2 take up a partial
# run again (C1b goes straight to its last payload once that reached the runtime stop; C2 resets, before T_WRITE, a
# restore of its own left half done, its own database still running included).
# Payloads are staged whole before any SSH and reach the hosts
# base64-encoded in the ssh argument with their sha256: the host decodes them and runs only a file with that same hash,
# with stdin from /dev/null (nothing can swallow it). On the old host they hold the reboot controller's maintenance
# lease, and before C0 they write only their own log (/var/log/c3po-migration) and the shipped script itself
# (/tmp/c3po-migration.*, removed on exit). Every printed line passes an anchored guard plus IPv4/IPv6/host-name denies;
# details stay in /var/log/c3po-migration (root, 0600) on each host.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "A | B | BV | R | C0 | C0u | C1a | C1b | C2 | C3L | D | D2 | E | R0n | R0"
        required: true
        type: choice
        options: [A, B, BV, R, C0, C0u, C1a, C1b, C2, C3L, D, D2, E, R0n, R0]
      confirm:
        description: "the phase again"
        required: true
      sha:
        description: "BV and C3L: the full revision the production pipeline deployed (40 hex)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read  # the pre-flight refuses to run beside a production pipeline

concurrency:
  group: c3po-host-migration
  cancel-in-progress: false

jobs:
  phase:
    if: github.ref == 'refs/heads/fable/host-migration-8gb'  # never from main or any other branch
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    env:
      PHASE: ${{ inputs.phase }}
      CONFIRM: ${{ inputs.confirm }}
      NAMED_SHA: ${{ inputs.sha }}
      # sha256 of the Day-D filesystem UUID read on the old host (05/11/2026): the new host mounts only that filesystem
      DAY_D_UUID_SHA256: 185a4adbded91480be2236bbc4b0137793184e4311e9f9e5ccb6b725c60232cf
    steps:
      - name: Check the phase and that no production pipeline is running
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$PHASE" = "$CONFIRM" ] || { echo "phase and confirmation differ"; exit 1; }
          [[ "$PHASE" =~ ^(A|B|BV|R|C0|C0u|C1a|C1b|C2|C3L|D|D2|E|R0n|R0)$ ]] || { echo "unknown phase"; exit 1; }
          # A (the new host's packages) and R (the rehearsal on the live database) are done (06/11) and retired: their
          # receipts stand, and neither runs again
          case "$PHASE" in A|R) echo "phase $PHASE is retired"; exit 1 ;; esac
          busy=$(gh run list --repo "$REPO" --workflow c3po-pipeline.yml --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          [ "$busy" = "0" ] || { echo "a production pipeline is queued or running: refusing"; exit 1; }
          # the start window (BRT): a phase that changes or loads a host starts only from 05:36 to 18:29 (back-outs C0u,
          # R0n, R0 and the read-only BV and D2 at any hour). Every host command of the run then stops at its absolute
          # DEADLINE, set here (see old/new_tmp/static), so nothing of a phase started in the window acts after 20:49,
          # far from the valuation worker's night (01:00 to 05:35)
          [ "$(TZ=America/Sao_Paulo date +%z)" = -0300 ] || { echo "the BRT time zone is not available"; exit 1; }
          case "$PHASE" in
            BV|D2|C0u|R0n|R0) ;;
            *) x=$(TZ=America/Sao_Paulo date +%H%M); mn=$(( 10#${x:0:2} * 60 + 10#${x:2:2} ))
               [ "$mn" -ge 336 ] && [ "$mn" -lt 1110 ] || { echo "outside the start window 05:36-18:29 BRT"; exit 1; } ;;
          esac
          # this run's absolute deadline on every host, ten minutes before this job's own 150-minute limit
          echo "DEADLINE=$(( $(date +%s) + 8400 ))" >> "$GITHUB_ENV"
          state=$(gh api "repos/$REPO/actions/workflows/c3po-pipeline.yml" --jq .state)
          case "$PHASE" in
            C0|C0u|C1a|C1b|C2|R0n|R0) [ "$state" = disabled_manually ] || { echo "the production pipeline must be disabled from C0 to C2 and for a back-out"; exit 1; } ;;
          esac
          [ -z "$NAMED_SHA" ] || [[ "$NAMED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "the revision must be 40 hex"; exit 1; }
          case "$PHASE" in BV|C3L) [[ "$NAMED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "BV and C3L need the named revision"; exit 1; } ;; esac
          echo "phase=$PHASE pipeline_busy=0 pipeline_state=$state"

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
          NEW_HOSTKEY: ${{ secrets.C3PO_AWS_NEW_HOSTKEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          # "c3po-new ssh-ed25519 <key>", read from the Lightsail console's own SSH on the new host (plan v2, F0)
          [[ "$NEW_HOSTKEY" =~ ^c3po-new\ ssh-ed25519\ [A-Za-z0-9+/]{68}$ ]] || { echo "new host key malformed"; exit 1; }
          { printf '%s\n' "$KNOWN_HOSTS"; printf '%s\n' "$NEW_HOSTKEY"; } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' 'Host *' '  BatchMode yes' '  StrictHostKeyChecking yes' '  ConnectTimeout 15' \
            '  ServerAliveInterval 10' '  ServerAliveCountMax 6' '  IdentityFile ~/.ssh/c3po_deploy' '  IdentitiesOnly yes' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keygen -y -f ~/.ssh/c3po_deploy | cut -d ' ' -f 1,2 > ~/.ssh/c3po_deploy.pub.bare
          [[ "$(cat ~/.ssh/c3po_deploy.pub.bare)" =~ ^ssh-ed25519\ [A-Za-z0-9+/]{68}$ ]] || { echo "deploy key unexpected"; exit 1; }

      - name: Run the phase
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          NEW: ${{ secrets.C3PO_AWS_NEW_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        shell: bash
        run: |
          set +e  # every failure below is handled and reported explicitly
          set -uo pipefail
          out="$RUNNER_TEMP/out.txt"; : > "$out"
          EMPTY_SHA=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          LEASE=/usr/local/lib/c3po-security/c3po_maintenance_run.py
          # before the IP moves (A, B, R, C1a, C1b) the static address is the old host; from C2 on it is the new host
          # every host command of the run, a direct one, a transfer or a shipped script, runs under a timeout to this run's
          # DEADLINE computed ON THE HOST when the command starts (the lease and every wait come after, inside it): the
          # host refuses if its clock is behind the runner's by more than 30 s, so nothing of this run acts on a host
          # after DEADLINE plus the 20 s kill margin, whether or not the runner is still there
          bounded() {
            printf 'RN=%s; D=%s; n=$(date +%%s); [ "$n" -ge "$((RN - 30))" ] || { echo "host clock behind" >&2; exit 96; }; t=$((D - n)); [ "$t" -ge 30 ] || { echo "deadline passed" >&2; exit 98; }; exec timeout --kill-after=20s "${t}s" bash -c %q' "$(date +%s)" "$DEADLINE" "$*"
          }
          old() { ssh "$USER@$HOST" "$(bounded "$@")"; }
          new_tmp() { ssh -o HostKeyAlias=c3po-new "$USER@$NEW" "$(bounded "$@")"; }
          static() { ssh "$USER@$HOST" "$(bounded "$@")"; }
          note() { printf '%s %s\n' "$PHASE" "$*" >> "$out"; }
          vcpus() { "$1" 'nproc' 2>/dev/null; }
          # stage [HEADER...]: the payload written WHOLE to a file before any SSH: the prelude, the header lines, then the
          # script on stdin (a heredoc or a file), which must end in the line "# end of payload"; every step's status is
          # checked, so a producer that fails or stops early never ships a prefix. remote and capture consume the staged
          # file once (a call without a fresh stage finds none and refuses)
          stage() {
            local f="$RUNNER_TEMP/payload.sh" t="$RUNNER_TEMP/payload.body" n="$RUNNER_TEMP/payload.new"
            rm -f "$f" "$t" "$n"
            cat > "$t" || { note "gate=FAIL reason=payload_stage"; return 1; }
            [ -s "$t" ] && [ "$(tail -n 1 "$t")" = "# end of payload" ] || { note "gate=FAIL reason=payload_stage"; return 1; }
            { printf '%s\n' "$prelude" "$@" && cat "$t"; } > "$n" || { note "gate=FAIL reason=payload_stage"; return 1; }
            [ "$(tail -n 1 "$n")" = "# end of payload" ] || { note "gate=FAIL reason=payload_stage"; return 1; }
            mv "$n" "$f" || { note "gate=FAIL reason=payload_stage"; return 1; }
          }
          # pack FILE: its sha256 and its base64, every status checked; sets P_SUM and P_B64, or fails. unpack TARGET-SIDE:
          # decode, then run only if the decoded file has that same sha256, so a cut or failed encoding never runs
          pack() {
            [ -s "$1" ] || return 1
            P_SUM=$(sha256sum < "$1" | cut -c1-64) || return 1
            [[ "$P_SUM" =~ ^[0-9a-f]{64}$ ]] || return 1
            P_B64=$(base64 -w0 < "$1") || return 1
            [ -n "$P_B64" ] || return 1
          }
          unpack='f=$(mktemp /tmp/c3po-migration.XXXXXX) || exit 31; printf %s "$B64" | base64 -d > "$f" || { rm -f "$f"; echo "$PHASE gate=FAIL reason=payload_decode"; exit 32; }; [ "$(sha256sum < "$f" | cut -c1-64)" = "$SUM" ] || { rm -f "$f"; echo "$PHASE gate=FAIL reason=payload_incomplete_at_target"; exit 33; }'
          # remote TARGET LEASE: the staged payload, consumed, packed, shipped in the argument and checked there, run with
          # stdin from /dev/null; only its "<PHASE> ..." lines are kept
          remote() {
            local target=$1 lease=$2 wrap="" status p="$RUNNER_TEMP/payload.inflight"
            mv "$RUNNER_TEMP/payload.sh" "$p" 2>/dev/null || { note "gate=FAIL reason=payload_not_staged"; return 1; }
            pack "$p" || { note "gate=FAIL reason=payload_pack"; return 1; }
            [ "$lease" = yes ] && wrap=$LEASE
            "$target" "set -o pipefail; PHASE=$PHASE; B64='$P_B64'; SUM=$P_SUM; $unpack; PHASE=$PHASE DAY_D_UUID_SHA256=$DAY_D_UUID_SHA256 DRIVER=${DRIVER:-none} NAMED_SHA=${NAMED_SHA:-none} DEADLINE=$DEADLINE $wrap bash \"\$f\" < /dev/null; s=\$?; rm -f \"\$f\"; exit \$s" \
              > "$RUNNER_TEMP/remote.txt" 2>/dev/null
            status=$?
            grep -E "^$PHASE " "$RUNNER_TEMP/remote.txt" >> "$out"
            [ "$status" = 0 ] || grep -q -E "^$PHASE gate=FAIL" "$RUNNER_TEMP/remote.txt" || note "gate=FAIL reason=remote_exit_$status"
            return $status
          }
          # capture TARGET LEASE: as remote, but the script's "H key value" lines (hashes) come back to the caller and never
          # reach the output; its "<PHASE> ..." lines still do
          capture() {
            local target=$1 lease=$2 wrap="" status p="$RUNNER_TEMP/payload.inflight"
            mv "$RUNNER_TEMP/payload.sh" "$p" 2>/dev/null || { note "gate=FAIL reason=payload_not_staged"; return 1; }
            pack "$p" || { note "gate=FAIL reason=payload_pack"; return 1; }
            [ "$lease" = yes ] && wrap=$LEASE
            "$target" "set -o pipefail; PHASE=$PHASE; B64='$P_B64'; SUM=$P_SUM; $unpack; PHASE=$PHASE DEADLINE=$DEADLINE $wrap bash \"\$f\" < /dev/null; s=\$?; rm -f \"\$f\"; exit \$s" \
              > "$RUNNER_TEMP/capture.txt" 2>/dev/null
            status=$?
            grep -E "^$PHASE " "$RUNNER_TEMP/capture.txt" >> "$out"
            [ "$status" = 0 ] || grep -q -E "^$PHASE gate=FAIL" "$RUNNER_TEMP/capture.txt" || note "gate=FAIL reason=capture_exit_$status"
            grep -E '^H [a-z_]+ ([0-9a-f]{40}|[0-9a-f]{64}|[0-9]{1,6})$' "$RUNNER_TEMP/capture.txt"
            return $status
          }
          # the same tree hash on both ends, never the hash of nothing
          same_hash() {  # same_hash LABEL "command" TARGET_A TARGET_B: both ends succeed and agree, never on nothing
            local a b sa sb
            a=$("$3" "set -o pipefail; $2" 2>/dev/null); sa=$?
            b=$("$4" "set -o pipefail; $2" 2>/dev/null); sb=$?
            if [ "$sa" = 0 ] && [ "$sb" = 0 ] && [[ "$a" =~ ^[0-9a-f]{64}$ ]] && [ "$a" != "$EMPTY_SHA" ] && [ "$a" = "$b" ]; then
              note "$1=match"; return 0
            fi
            note "gate=FAIL reason=$1"; return 1
          }
          # a tree's hash: every entry's type, numeric owner, mode, path and link target, then every regular file's
          # content (absolute paths: the same on both hosts; sudo throughout, no cd into root-only directories)
          tree_cmd() {  # tree_cmd BASE TOP [PRUNE...]
            local root="$1/$2" prune="" x; shift 2
            for x in "$@"; do prune="$prune -path $root/$x -prune -o"; done
            printf '%s' "{ sudo find $root $prune ! -type s -printf '%y %U:%G %m %p %l\n' | LC_ALL=C sort || exit 1; sudo find $root $prune -type f -print0 | LC_ALL=C sort -z | sudo xargs -0 -r sha256sum; } | sha256sum | cut -c1-64"
          }
          prelude='set -euo pipefail
          exec 3>&1
          sudo install -d -m 0700 -o root -g root /var/log/c3po-migration
          exec > >(sudo tee -a "/var/log/c3po-migration/$PHASE.log" >/dev/null) 2>&1
          say() { ( trap "" PIPE; printf "%s %s\n" "$PHASE" "$*" >&3 ) 2>/dev/null || exit 21; }
          fail() { say "gate=FAIL reason=$1"; exit 20; }
          cleanup() { :; }
          trap '"'"'s=$?; cleanup || true; [ "$s" = 0 ] || [ "$s" = 20 ] || say "gate=FAIL reason=exit_$s"'"'"' EXIT
          APP=/opt/chief-of-staff-digital
          dc() { docker compose --env-file "$APP/.env" -f "$APP/c3po/compose.yml" "$@"; }
          legacy() { docker compose --env-file "$APP/.env" -f "$APP/docker-compose.yml" "$@"; }
          count_sql="SELECT '"'"'count'"'"', format('"'"'%I.%I'"'"', schemaname, relname), (xpath('"'"'/row/c/text()'"'"', query_to_xml(format('"'"'select count(*) as c from %I.%I'"'"', schemaname, relname), false, true, '"'"''"'"')))[1]::text FROM pg_stat_user_tables ORDER BY 2;"
          '
          rc=0
          case "$PHASE" in
          A)
            [ "$(vcpus new_tmp)" = 2 ] && note "identity_new=ok" || { note "gate=FAIL reason=identity_new"; rc=1; }
            if [ "$rc" = 0 ]; then
              DRIVER=$(old "docker info --format '{{.Driver}}'" 2>/dev/null)
              [[ "$DRIVER" =~ ^(overlay2|overlayfs)$ ]] || { note "gate=FAIL reason=old_driver"; rc=1; }
            fi
            if [ "$rc" = 0 ]; then
              stage <<'REMOTE' && remote new_tmp no || rc=1
          [ "$(nproc)" = 2 ] || fail not_new_host
          [ "$(awk '/MemTotal/ {printf "%d", $2 / 1048576}' /proc/meminfo)" -le 8 ] || fail not_new_host_memory
          [ ! -e "$APP/.env" ] || fail app_already_present
          say "boot_age_s=$(awk '{printf "%d", $1}' /proc/uptime)"
          sudo timedatectl set-timezone America/Sao_Paulo
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /tmp/docker.asc
          gpg --show-keys --with-colons /tmp/docker.asc | grep -q '^fpr:::::::::9DC858229FC7DD38854AE2D88D81803C0EBFCD88:$' || fail docker_key
          sudo install -m 0644 /tmp/docker.asc /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          # the old host's Docker versions, held. A re-run must not move them: on 06/11 run 2 hit exit 100 because
          # dist-upgrade moved them to the repository's newest and the pinned install became a refused downgrade
          pins="docker-ce=5:29.5.3-1~ubuntu.24.04~noble docker-ce-cli=5:29.5.3-1~ubuntu.24.04~noble
            docker-ce-rootless-extras=5:29.5.3-1~ubuntu.24.04~noble containerd.io=2.2.4-1~ubuntu.24.04~noble
            docker-buildx-plugin=0.34.1-1~ubuntu.24.04~noble docker-compose-plugin=5.1.4-1~ubuntu.24.04~noble"
          names=$(for p in $pins; do printf '%s ' "${p%%=*}"; done)
          apt_get() { sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 "$@"; }
          # the last apt error an earlier A left in this host's root-only log, classified; no error text leaves the host
          last=$(sudo grep '^E: ' /var/log/c3po-migration/A.log | tail -n 1 || true)
          case "$last" in
            '') ;;
            *'Packages were downgraded and -y was used without --allow-downgrades'*) say "last_logged_apt_error=downgrade_refused" ;;
            *'Could not get lock'*) say "last_logged_apt_error=apt_lock" ;;
            *) say "last_logged_apt_error=other" ;;
          esac
          # apt-daily and unattended-upgrade take the lists and archive locks, which DPkg::Lock::Timeout does not cover;
          # both are oneshot units, "activating" while they run, so the state is read, not is-active
          apt_busy() {
