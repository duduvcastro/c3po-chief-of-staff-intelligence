name: R2D2 live status (read-only)

# The live R2D2 runs inside the C3PO server (service r2d2-live, owner 27/10/2026). This read-only check prints the
# container state, the engine's own summary from the database (no symbols), its count-only log lines and the NUMBER of
# error lines (this repository is public: no symbol and no error text is printed), any API token redacted. It changes
# nothing on the host.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "log window, in minutes (1-240)"
        default: "30"

permissions:
  contents: read

concurrency:
  group: r2d2-live-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    environment: production  # the host's address and known hosts are the production environment's (the repository-level ones predate the host migration)
    timeout-minutes: 10
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh || exit 1
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy || exit 1
          chmod 600 ~/.ssh/c3po_deploy || exit 1
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts || exit 1
          chmod 600 ~/.ssh/known_hosts || exit 1

      - name: Read the r2d2-live state, summary and logs
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
          MINUTES: ${{ inputs.minutes }}
        shell: bash
        run: |
          set -uo pipefail
          [[ "$MINUTES" =~ ^[0-9]{1,3}$ ]] && [ "$MINUTES" -ge 1 ] && [ "$MINUTES" -le 240 ] || { echo "minutes must be 1-240"; exit 1; }
          rc=0
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "MINUTES=$MINUTES bash -s" <<'REMOTE' > "$RUNNER_TEMP/out.txt" 2>&1 || rc=$?
          set -uo pipefail
          exec 2>/dev/null
          cd /opt/chief-of-staff-digital || exit 10
          compose=(docker compose --env-file .env -f c3po/compose.yml)
          echo "== massive snapshot: response shape and trade ages over the whole market, keys and numbers only"
          timeout 90 "${compose[@]}" exec -T api python - <<'PY' | grep -oE '^(token_set=(True|False)|http=[0-9]{3}|status=(OK|ERROR|DELAYED|NOT_AUTHORIZED|NOT_FOUND|None|other) rows=[0-9]+ with_trade=[0-9]+ dotted=[0-9]+|row_keys=[A-Za-z_,]+|last_trade_keys=[A-Za-z_,]*|t_bad=[0-9]+|t_digits=[0-9,]* today=[0-9]+ age_s_p50=-?[0-9]+ age_s_p90=-?[0-9]+|snapshot failed=[A-Za-z]+)$'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import httpx
          from app.config import get_settings
          s = get_settings()
          print("token_set=%s" % bool(s.massive_api_token))
          try:
              response = httpx.get(s.massive_base_url.rstrip("/") + "/v2/snapshot/locale/us/markets/stocks/tickers",
                                   params={"apiKey": s.massive_api_token}, timeout=60.0)
              print("http=%d" % response.status_code)
              body = response.json()
              rows = body.get("tickers") if isinstance(body, dict) else None
              rows = [row for row in rows if isinstance(row, dict)] if isinstance(rows, list) else []
              status = str(body.get("status")) if isinstance(body, dict) else "None"
              trades = [row["lastTrade"] for row in rows if isinstance(row.get("lastTrade"), dict)]
              print("status=%s rows=%d with_trade=%d dotted=%d" % (
                  status if status in ("OK", "ERROR", "DELAYED", "NOT_AUTHORIZED", "NOT_FOUND", "None") else "other", len(rows),
                  len(trades), sum(1 for row in rows if "." in str(row.get("ticker") or ""))))
              print("row_keys=%s" % ",".join(sorted({key for row in rows[:200] for key in row if key != "ticker"})))
              print("last_trade_keys=%s" % ",".join(sorted({key for trade in trades[:200] for key in trade})))
              now = datetime.now(timezone.utc)
              session = now.astimezone(ZoneInfo("America/New_York")).date()
              raw = [trade.get("t") for trade in trades]
              stamps = [t for t in raw if isinstance(t, int) and not isinstance(t, bool) and 0 < t < 10**20]
              print("t_bad=%d" % (len(raw) - len(stamps)))
              ages = sorted(int(now.timestamp() - stamp / 1e9) for stamp in stamps
                            if stamp > 0 and datetime.fromtimestamp(stamp / 1e9, timezone.utc).astimezone(ZoneInfo("America/New_York")).date() == session)
              digits = ",".join(str(count) for count in sorted({len(str(stamp)) for stamp in stamps}))
              print("t_digits=%s today=%d age_s_p50=%d age_s_p90=%d" % (
                  digits, len(ages), ages[len(ages) // 2] if ages else -1, ages[int(len(ages) * 0.9)] if ages else -1))
          except Exception as error:
              print("snapshot failed=%s" % type(error).__name__)
          PY
          echo "snapshot rc=$?"
          echo "== host peaks per day (sysstat), numbers only"
          peak() {  # file, sadf report, column, max|min
            sadf -d "$1" -- "$2" | awk -F';' -v col="$3" -v mode="$4" '
              /^# hostname/ { sub(/^# /, ""); for (i = 1; i <= NF; i++) if ($i == col) c = i; next }
              c && $c ~ /^[0-9]+([.][0-9]+)?$/ { v = $c + 0; if (!n || (mode == "max" ? v > m : v < m)) m = v; n++ }
              END { if (n) printf "%.1f", m; else printf "na" }'
          }
          echo "sa_files=$(ls /var/log/sysstat/sa[0-9][0-9] 2>/dev/null | wc -l)"
          for f in $(ls -tr /var/log/sysstat/sa[0-9][0-9] 2>/dev/null); do
            printf 'day=%s date=%s memused_pct_max=%s kbmemused_max=%s kbcommit_max=%s cpu_idle_pct_min=%s ldavg1_max=%s\n' "$(basename "$f")" "$(date -r "$f" +%F)" \
              "$(peak "$f" -r %memused max)" "$(peak "$f" -r kbmemused max)" "$(peak "$f" -r kbcommit max)" \
              "$(peak "$f" -u %idle min)" "$(peak "$f" -q ldavg-1 max)"
          done | grep -E '^day=sa[0-9]{2} date=[0-9]{4}-[0-9]{2}-[0-9]{2} memused_pct_max=[0-9.na]+ kbmemused_max=[0-9.na]+ kbcommit_max=[0-9.na]+ cpu_idle_pct_min=[0-9.na]+ ldavg1_max=[0-9.na]+$'
          echo "== now"
          free -m | awk '/^Mem:/ { printf "mem_mb total=%d used=%d available=%d\n", $2, $3, $7 }'
          nproc | awk '{ printf "cpus=%d\n", $1 }'
          stats=$(timeout 30 docker stats --no-stream --format '{{.Name}} mem={{.MemUsage}}')
          echo "stats_lines=$(printf '%s\n' "$stats" | grep -c .)"
          printf '%s\n' "$stats" | grep -E '^[a-z0-9][a-z0-9_.-]* mem=[0-9.]+(B|[KMGT]iB) / [0-9.]+(B|[KMGT]iB)$'
          exit 0
          REMOTE
          # every line printed is sanitized; a failed access or a failed mandatory read fails the run (Codex #500 P2-7)
          sed -E 's/(api_token=|[aA]pi[kK]ey=)[^&[:space:]"]+/\1[redacted]/g' "$RUNNER_TEMP/out.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "remote exit status: $rc"
          exit "$rc"
