name: R2D2 live status (read-only)

# The live R2D2 runs inside the C3PO server (service r2d2-live, owner 27/10/2026). This read-only check prints the
# container state, the engine's own summary from the database (no symbols), its count-only log lines and the NUMBER of
# error lines (this repository is public: no symbol and no error text is printed), any API token redacted. It changes
# nothing on the host.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "log window, in minutes (1-240)"
        default: "30"

permissions:
  contents: read

concurrency:
  group: r2d2-live-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    environment: production  # the host's address and known hosts are the production environment's (the repository-level ones predate the host migration)
    timeout-minutes: 10
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh || exit 1
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy || exit 1
          chmod 600 ~/.ssh/c3po_deploy || exit 1
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts || exit 1
          chmod 600 ~/.ssh/known_hosts || exit 1

      - name: Read the r2d2-live state, summary and logs
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
          MINUTES: ${{ inputs.minutes }}
        shell: bash
        run: |
          set -uo pipefail
          [[ "$MINUTES" =~ ^[0-9]{1,3}$ ]] && [ "$MINUTES" -ge 1 ] && [ "$MINUTES" -le 240 ] || { echo "minutes must be 1-240"; exit 1; }
          rc=0
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "MINUTES=$MINUTES bash -s" <<'REMOTE' > "$RUNNER_TEMP/out.txt" 2>&1 || rc=$?
          set -uo pipefail
          cd /opt/chief-of-staff-digital || exit 10
          compose=(docker compose --env-file .env -f c3po/compose.yml)
          echo "== container"
          state=$("${compose[@]}" ps r2d2-live --format '{{.Name}} {{.State}} {{.Status}}') || exit 11
          [ -n "$state" ] || { echo "r2d2-live is not running"; exit 12; }
          echo "$state"
          # whether the entries can read the Massive NBBO: the credential's PRESENCE only, never its value
          cid=$("${compose[@]}" ps -q r2d2-live) || exit 11
          massive=unset
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid" | grep -qE '^(C3PO_)?MASSIVE_API_TOKEN=.+' && massive=set
          echo "R2D2 live config: massive_token=$massive"
          echo "== summary"
          "${compose[@]}" exec -T -e 'PGOPTIONS=-c default_transaction_read_only=on' api python -m app.r2d2_live_engine --status </dev/null || exit 13
          # This repository is PUBLIC and so are its run logs: only the engine's own count-only lines (no symbol) are
          # printed, and the error lines are COUNTED, never shown.
          logs=$("${compose[@]}" logs --no-color --since "${MINUTES}m" --tail 2000 r2d2-live 2>&1) || exit 14
          echo "== engine lines (last ${MINUTES} min)"
          # only the engine's own lines of EXACT shapes: numbers, dates and a closed set of stream states (Codex #500 P2-5)
          printf '%s\n' "$logs" | grep -oE "R2D2 live heartbeat: stream=(connecting|connected|error|stopped|idle|other) error=[01] trades=[0-9]+ quotes=[0-9]+ candidates=[0-9]+ signals=[0-9]+ positions=[0-9]+ fills=[0-9]+ nav=-?[0-9]+[.][0-9]{2}$|R2D2 live: session [0-9]{4}-[0-9]{2}-[0-9]{2}( [(]resumed[)])?, universe [0-9]+, carried [0-9]+, NAV -?[0-9]+[.][0-9]{2}$|R2D2 live: [0-9]+ candidates of [0-9]+ with an opening print$|R2D2 live: session [0-9]{4}-[0-9]{2}-[0-9]{2} closed, NAV -?[0-9]+[.][0-9]{2}, [0-9]+ fills, [0-9]+ carried$|R2D2 live: next session [0-9]{4}-[0-9]{2}-[0-9]{2}, waiting [0-9]+ s$|R2D2 live: the session failed$|R2D2 live: previous session [0-9]{4}-[0-9]{2}-[0-9]{2} not republished [(]refused by the screen[)]$|R2D2 live feed: trade_messages=[0-9]+ quote_messages=[0-9]+ trade_lag_ms=-?[0-9]+ quote_lag_ms=-?[0-9]+ trade_lag_max_ms=-?[0-9]+ quote_lag_max_ms=-?[0-9]+ skips held=[0-9]+ slots=[0-9]+ noquote=[0-9]+ stale=[0-9]+ spread=[0-9]+ late=[0-9]+ implausible=[0-9]+ nbbo massive=[0-9]+ stream=[0-9]+ unanswered=[0-9]+ mismatch=[0-9]+ stream_would_refuse=[0-9]+( exits massive=[0-9]+ stream=[0-9]+ none=[0-9]+ unconfirmed=[0-9]+)?$|R2D2 live massive: state=(idle|connecting|connected|error|stopped|other) symbols=[0-9]+ quotes=[0-9]+ lag_ms=-?[0-9]+ lag_max_ms=-?[0-9]+ pushed=[0-9]+$|R2D2 live shadow: limit_bps=[0-9]+[.][0-9] 5_8 vetoed=[0-9]+ closed=[0-9]+ open=[0-9]+ wins=[0-9]+ net_usd=-?[0-9]+[.][0-9]{2} 8_10 vetoed=[0-9]+ closed=[0-9]+ open=[0-9]+ wins=[0-9]+ net_usd=-?[0-9]+[.][0-9]{2} gt10 vetoed=[0-9]+ closed=[0-9]+ open=[0-9]+ wins=[0-9]+ net_usd=-?[0-9]+[.][0-9]{2}$" | tail -90
          echo "== error lines (count only): $(printf '%s\n' "$logs" | grep -cE "ERROR|Traceback|Exception")"
          exit 0
          REMOTE
          # every line printed is sanitized; a failed access or a failed mandatory read fails the run (Codex #500 P2-7)
          sed -E 's/(api_token=)[^&[:space:]"]+/\1[redacted]/g' "$RUNNER_TEMP/out.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "remote exit status: $rc"
          exit "$rc"
