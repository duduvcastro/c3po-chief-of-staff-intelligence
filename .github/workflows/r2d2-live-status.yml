          # the old host as it was before C1a, from the states C1a recorded (each file must be there and non-empty)
          M=/root/c3po-migration
          sudo test -s "$M/crontab.before" || fail no_saved_crontab
          # only after C1a began (its hold record): before that, C0u undoes C0, and a hold that was there stays
          sudo test -e "$M/hold.recorded" || fail no_c1a_hold_record_c0u_before_c1a
          if ! sudo test -s "$M/timers.before"; then
            # C1a stopped before recording them: no timer was touched, none may have been moved
            [ -z "$(sudo find "$M/units" -mindepth 1 2>/dev/null)" ] || fail units_moved_without_record
            sudo install -m 0600 /dev/null "$M/timers.before"
          fi
          findmnt -n /mnt/day-d-data >/dev/null || sudo mount /mnt/day-d-data
          findmnt -n /mnt/day-d-data >/dev/null || fail day_d_mount
          uuid=$(findmnt -n -o UUID /mnt/day-d-data)
          [ "$(printf '%s' "$uuid" | sha256sum | cut -c1-64)" = "$DAY_D_UUID_SHA256" ] || fail day_d_uuid
          for d in tmp valuation-ensemble r2d2-v2-source; do [ -d "/mnt/day-d-data/$d" ] || fail "day_d_content_$d"; done
          sudo systemctl unmask docker.socket docker.service containerd.service >/dev/null
          sudo systemctl start containerd.service docker.socket docker.service
          C3PO_BUILD_SHA=$(cat "$APP/.deploy-version") dc up -d --no-build >/dev/null
          legacy up -d --no-build cloudflared pluggy-webhook >/dev/null
          while read -r t state; do
            if sudo test -f "$M/units/$t"; then sudo mv "$M/units/$t" "/etc/systemd/system/$t"; fi
          done < <(sudo cat "$M/timers.before")
          sudo systemctl daemon-reload
          while read -r t state; do
            if [ "$state" = enabled ]; then sudo systemctl enable --now "$t" >/dev/null; fi
          done < <(sudo cat "$M/timers.before")
          sudo systemctl unmask apt-daily.timer apt-daily-upgrade.timer >/dev/null
          sudo systemctl enable --now apt-daily.timer apt-daily-upgrade.timer >/dev/null
          sudo cat "$M/crontab.before" | crontab -
          crontab -l | sudo cmp -s "$M/crontab.before" - || fail crontab_restore
          sudo rm -f "$M/crontab.emptied" "$M/crontab.drained"
          # the migration's hold goes; a hold that existed before C1a stays
          if sudo test -e "$M/hold.before"; then sudo cp -p "$M/hold.before" /etc/c3po/security-maintenance.hold; else sudo rm -f /etc/c3po/security-maintenance.hold; fi
          # C1a's hold record set aside, last (a re-run before it restores the same hold again), so a later C0u or C1a
          # starts from the host as it now is; hold.before stays until a later C1a sets it aside itself
          sudo mv "$M/hold.recorded" "$M/hold.recorded.r0.$(date +%s)"
          say "back_out=done timers_restored=$(sudo wc -l "$M/timers.before" | awk '{print $1}') crontab_lines=$(crontab -l | grep -c -v -E '^\s*(#|$)')"
          say "gate=PASS"
          # end of payload
          REMOTE
            fi
            ;;
          esac
          guard='^(A|B|BV|R|C0|C0u|C1a|C1b|C2|C3L|D|D2|E|R0n|R0) [a-z0-9_]+=[A-Za-z0-9_.,:/+-]{1,120}( [a-z0-9_]+=[A-Za-z0-9_.,:/+-]{1,120})*( of [0-9]+)?$'
          deny='([0-9]{1,3}[.-]){3}[0-9]{1,3}|ip-[0-9]|[0-9a-f]{1,4}:[0-9a-f]{0,4}:[0-9a-f]{0,4}:|@'
          grep -E "$guard" "$out" | grep -v -E "$deny"
          echo "lines: raw $(wc -l < "$out") kept $(grep -E "$guard" "$out" | grep -c -v -E "$deny")"
          if [ "$rc" = 0 ] && grep -q -E "^$PHASE gate=PASS( |$)" "$out" && ! grep -q -E "^$PHASE gate=FAIL" "$out"; then exit 0; fi
          exit 1
