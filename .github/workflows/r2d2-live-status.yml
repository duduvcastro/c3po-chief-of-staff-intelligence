          # case left (a stop: stop_need; a start: the units' own start timeouts plus 60 s), plus SYS_KEEP seconds (0 unless
          # set) for what must follow it; it returns only when the jobs of the named units have ended, and systemd ends them
          # within those timeouts, so the effect itself is bounded
          sysop() {
            local what=$1 action=$2 need=60 u t
            shift 2
            case "$action" in
              stop) need=$(stop_need "$@") || fail "${what}_unbounded" ;;
              start) for u in "$@"; do t=$(unit_s Start "$u") || fail "${what}_unbounded"; need=$(( need + t )); done ;;
              *) fail "${what}_action" ;;
            esac
            sat "$(( need + ${SYS_KEEP:-0} ))" "$what" timeout --foreground "$need" systemctl "$action" "$@" || fail "$what"
          }
          # start_bounded WHAT LIMIT UNIT...: a start whose units may have no start timeout of their own (Docker's), handed off
          # without blocking. Its cancel (sb_cancel) is armed BEFORE the hand-off (arm, then handoff), so a start
          # queued and then cut on its client, refused only in part (a masked unit) or met by a TERM is cancelled as well, only
          # after its client has returned; only the admission's own refusal disarms it. Every state read is bounded at 10 s,
          # and the cancel's whole time (SB_CANCEL) is kept before the reads and checked again after them, so a late read can
          # neither eat it nor turn into a success. Admitted with the whole worst case left: the hand-off (60 s), LIMIT, the
          # pause and one more round of reads, then the cancel
          start_bounded() {
            local what=$1 limit=$2 sneed reads need u st ok t0
            shift 2
            sneed=$(stop_need "$@") || fail "${what}_unbounded"
            # the cancel: the stop's worst case, one bounded state read per unit and the bounded shim check, plus 10 s
            SB_UNITS="$*"; SB_WHAT=$what; SB_NEED=$sneed; SB_CANCEL=$(( sneed + 10 * ($# + 1) + 10 ))
            reads=$(( 10 * $# ))
            need=$(( 60 + limit + 2 + reads + SB_CANCEL + 10 ))
            arm sb_cancel
            handoff "$need" "$what" timeout --foreground 60 systemctl --no-block start "$@" || fail "${what}_handoff"
            t0=$(date +%s)
            while :; do
              [ "$(( DEADLINE - $(date +%s) ))" -ge "$(( reads + SB_CANCEL + 10 ))" ] || fail "${what}_deadline_kept_for_the_cancel"
              ok=yes
              for u in "$@"; do
                st=$(timeout --foreground 10 systemctl show -p ActiveState --value "$u") || fail "${what}_unreadable"
                case "$st" in active) ;; failed) fail "${what}_failed" ;; *) ok=no ;; esac
              done
              [ "$(( DEADLINE - $(date +%s) ))" -ge "$(( SB_CANCEL + 10 ))" ] || fail "${what}_deadline_kept_for_the_cancel"
              if [ "$ok" = yes ]; then disarm; return 0; fi
              [ "$(( $(date +%s) - t0 ))" -lt "$limit" ] || fail "${what}_timed_out"
              sleep 2
            done
          }
          # sb_cancel: the units stopped (never refused, the client bounded by their own stop worst case), then their end
          # confirmed by state (inactive or failed) and by no containerd shim left, each read bounded at 10 s and an unreadable
          # or timed-out one never taken for an end; a further signal is held and ignored, so it never cuts the cancel short;
          # no variable named s (the EXIT trap keeps its status there); SB_CANCEL at most; the outcome said either way
          sb_cancel() {
            local u st ps_rc ok=yes
            trap ':' TERM HUP INT
            sudo timeout --foreground "$SB_NEED" systemctl stop $SB_UNITS >/dev/null 2>&1 || ok=no
            for u in $SB_UNITS; do
              st=$(timeout --foreground 10 systemctl show -p ActiveState --value "$u" 2>/dev/null) || st=unreadable
              case "$st" in inactive|failed) ;; *) ok=no ;; esac
            done
            # pgrep: only 1 means none (found, an error or the timeout prove nothing); the bracket keeps it off its own wrapper
            ps_rc=0; timeout --foreground 10 pgrep -f '[c]ontainerd-shim' >/dev/null 2>&1 || ps_rc=$?
            [ "$ps_rc" = 1 ] || ok=no
            if [ "$ok" = yes ]; then say "${SB_WHAT}_cancel=confirmed_ended"; else say "${SB_WHAT}_cancel=not_confirmed"; fi
          }
          # poweroff_need: the power-off's own worst case into PO_NEED, read from the manager (each read bounded): 60 s for the
          # hand-off, 20 s ahead with 1 s of accuracy, poweroff.target's job limit (30 minutes, checked), then its forced action
          # (checked), whose final stage sends SIGTERM to what is left for up to the manager's default stop timeout (finite,
          # checked), SIGKILL as long again, then syncs and unmounts; plus 60 s
          poweroff_need() {
            local d us
            [ "$(timeout --foreground 10 systemctl show -p JobTimeoutUSec --value poweroff.target)" = 30min ] || fail poweroff_job_timeout_unexpected
            [ "$(timeout --foreground 10 systemctl show -p JobTimeoutAction --value poweroff.target)" = poweroff-force ] || fail poweroff_job_action_unexpected
            d=$(timeout --foreground 10 systemctl show -p DefaultTimeoutStopUSec --value) || fail poweroff_default_stop_unreadable
            [ -n "$d" ] && [ "$d" != infinity ] || fail poweroff_default_stop_unbounded
            us=$(systemd-analyze timespan "$d" 2>/dev/null | sed -n 2p | awk '{print $2}')
            [[ "$us" =~ ^[0-9]+$ ]] && [ "$us" -gt 0 ] || fail poweroff_default_stop_unbounded
            PO_NEED=$(( 60 + 20 + 1 + 1800 + 2 * ((us + 999999) / 1000000) + 60 ))
          }
          # seq_need PRE UNIT...: the whole power-off sequence's worst case into SEQ_NEED, computed before its first change: PRE
          # seconds for the work before the runtime stop, the stop of these units (stop_need), the mask (120 s), sync and the
          # unmount (120 s), then the power-off's own (PO_NEED)
          seq_need() {
            local pre=$1 sn
            shift
            sn=$(stop_need "$@") || fail runtime_stop_unbounded
            poweroff_need
            SEQ_NEED=$(( pre + sn + 120 + 120 + PO_NEED ))
          }
          # the power-off: scheduled 20 s ahead (timer accuracy fixed at 1 s) only while its own worst case, read again now,
          # still fits before DEADLINE
          poweroff_later() {
            poweroff_need
            sat "$PO_NEED" power_off timeout --foreground 60 systemd-run --on-active=20 --timer-property=AccuracySec=1s --unit=c3po-migration-poweroff systemctl poweroff >/dev/null || fail power_off
          }
          # 1. C0 complete and still in place: its emptied and drained records, the saved copy, no crontab now
          sudo test -e "$M/crontab.emptied" && sudo test -e "$M/crontab.drained" && sudo test -s "$M/crontab.before" || fail c0_not_complete
          if out=$(crontab -l 2>&1); then fail crontab_live_again; fi
          case "$out" in "no crontab for "*) ;; *) fail crontab_unreadable ;; esac
          # the preparations, nothing changed yet
          sudo install -d -m 0700 -o root -g root "$M" "$M/prestop-logs" "$M/units"
          # the admission: the drain (cron's cgroup back to its own process, no summary or one-off container running,
          # waited for up to 2 minutes)
          for i in $(seq 25); do
            cg=$(systemctl show -p ControlGroup --value cron.service)
            [ -n "$cg" ] || fail cron_cgroup_unreadable
            procs=$(wc -l < "/sys/fs/cgroup$cg/cgroup.procs")
            names=$(timeout --foreground 20 docker ps --format '{{.Names}}') || fail docker_unreadable
            summary=$(grep -c 'morning-summary' <<<"$names" || true)
            ids=$(timeout --foreground 20 docker ps -q --filter label=com.docker.compose.oneoff=True) || fail docker_unreadable
            [ "$procs" -le 1 ] && [ "$summary" = 0 ] && [ -z "$ids" ] && break
            [ "$i" -lt 25 ] || fail cron_job_or_container_running
            sleep 5
          done
          say "admission=in clock_brt=$(TZ=America/Sao_Paulo date '+%H:%M:%S')"
          # 2. the explicit hold next, before any stop (without it the watchdog re-enables timers and starts db/api/web):
          # its record first (an older hold.before set aside, so it is always this C1a's)
          if ! sudo test -e "$M/hold.recorded"; then
            if sudo test -e "$M/hold.before"; then sudo mv "$M/hold.before" "$M/hold.before.old.$(date +%s)"; fi
            if sudo test -e /etc/c3po/security-maintenance.hold; then sudo cp -p /etc/c3po/security-maintenance.hold "$M/hold.before"; fi
            sudo touch "$M/hold.recorded"
          fi
          if ! sudo test -e /etc/c3po/security-maintenance.hold; then
            ( umask 077; printf '%s\n' 'migration 2026-11-07: old host quiesced in C1a; removed only by R0' | sudo tee /etc/c3po/security-maintenance.hold >/dev/null )
          fi
          sudo test -s /etc/c3po/security-maintenance.hold || fail hold
          say "hold=present"
          # 3. cron's own system jobs may still be ending (cron's cgroup back to its own process, waited for up to 15
          # minutes); nothing of the emptied crontab can be among them, and a summary container here refuses
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            cg=$(systemctl show -p ControlGroup --value cron.service)
            [ -n "$cg" ] || fail cron_cgroup_unreadable
            procs=$(wc -l < "/sys/fs/cgroup$cg/cgroup.procs")
            names=$(timeout --foreground 20 docker ps --format '{{.Names}}') || fail docker_unreadable
            summary=$(grep -c 'morning-summary' <<<"$names" || true)
            [ "$summary" = 0 ] || fail summary_running_after_the_admission
            [ "$procs" -le 1 ] && break
            [ "$(date +%s)" -lt "$deadline" ] || fail cron_jobs_still_running
            sleep 20
          done
          say "crontab=emptied_by_c0 lines=$(sudo grep -c -v -E '^\s*(#|$)' "$M/crontab.before") cron_jobs_running=0"
          # 4. the c3po-* timers: states recorded ONCE, disabled, their unit files moved out (a file in
          # /etc/systemd/system cannot be masked), daemon reloaded; the apt timers masked; running units drain
          if ! sudo test -s "$M/timers.before"; then
            systemctl list-unit-files --no-legend --plain | awk '$1 ~ /^c3po-.*\.timer$/ {print $1, $2}' > "$W.timers"
            [ -s "$W.timers" ] || fail no_timers_recorded
            sudo install -m 0600 -o root -g root "$W.timers" "$M/timers.before"
            rm -f "$W.timers"
          fi
          # each stop a bounded job, each unit-file change admitted (a re-run skips a timer already moved out)
          while read -r t state; do
            if systemctl cat "$t" >/dev/null 2>&1; then
              sysop timer_stop stop "$t"
              sat 120 timer_disable timeout --foreground 60 systemctl disable "$t" >/dev/null 2>&1 || fail timer_disable
            fi
            if sudo test -f "/etc/systemd/system/$t"; then sudo mv "/etc/systemd/system/$t" "$M/units/$t"; fi
          done < <(sudo cat "$M/timers.before")
          sat 180 daemon_reload timeout --foreground 120 systemctl daemon-reload || fail daemon_reload
          for t in apt-daily.timer apt-daily-upgrade.timer; do
            sysop apt_timer_stop stop "$t"
            sat 120 apt_timer_mask timeout --foreground 60 systemctl mask "$t" >/dev/null || fail apt_timer_mask
          done
          [ "$(systemctl list-timers --all --no-legend --plain | awk '$NF ~ /^c3po-/' | wc -l)" = 0 ] || fail c3po_timers_left
          deadline=$(( $(date +%s) + 900 ))
          while systemctl list-units --no-legend --plain --state=activating,active | awk '$1 ~ /^(c3po-.*|apt-daily|apt-daily-upgrade)\.service$/' | grep -q .; do
            [ "$(date +%s)" -lt "$deadline" ] || fail units_still_running
            sleep 10
          done
          say "timers=disabled_and_moved count=$(sudo wc -l "$M/timers.before" | awk '{print $1}') apt_timers=masked"
          # 5. the services' retained logs, hashed (never printed)
          since=$(date -d '-36 hours' --iso-8601=seconds); until=$(date --iso-8601=seconds)
          for svc in web api investor-relations-worker valuation-worker server-usage-worker r2d2-live db; do
            id=$(dc ps -a -q "$svc")
            [ -n "$id" ] || fail "no_container_$svc"
            docker logs --timestamps --since "$since" --until "$until" "$id" 2>&1 | sudo tee "$M/prestop-logs/$svc.log" >/dev/null
          done
          for svc in cloudflared pluggy-webhook; do
            id=$(legacy ps -a -q "$svc")
            [ -n "$id" ] || fail "no_container_$svc"
            docker logs --timestamps --since "$since" --until "$until" "$id" 2>&1 | sudo tee "$M/prestop-logs/legacy-$svc.log" >/dev/null
          done
          sudo sh -c "cd '$M/prestop-logs' && sha256sum *.log > SHA256SUMS"
          say "logs=kept files=$(sudo find "$M/prestop-logs" -name '*.log' | wc -l)"
          # at NEED WHAT CMD...: a change a daemon may carry on with (a container stop, a command in a container, a systemd
          # unit), started only if it can still end NEED seconds before DEADLINE; the check runs in the very process that
          # then execs the command (no gap), and the command itself is bounded inside NEED
          at() {
            local need=$1 what=$2 s=0
            shift 2
            env D="$DEADLINE" N="$need" bash -c '[ "$(( D - $(date +%s) ))" -ge "$N" ] || exit 97; exec "$@"' at "$@" || s=$?
            if [ "$s" = 97 ]; then fail "too_late_for_$what"; fi
            return "$s"
          }
          DC="docker compose --env-file $APP/.env -f $APP/c3po/compose.yml"
          LEG="docker compose --env-file $APP/.env -f $APP/docker-compose.yml"
          # 6. ingress first, then every writer; the database stays up. Each stop bounded at 300 s on the client (a stop
          # takes at most its 120 s grace and the kill), admitted with 450 s left
          say "stopping=ingress"
          at 450 ingress_stop timeout --foreground 300 $LEG stop -t 120 cloudflared pluggy-webhook >/dev/null || fail ingress_stop
          say "stopping=writers"
          at 450 writers_stop timeout --foreground 300 $DC stop -t 120 web api investor-relations-worker valuation-worker server-usage-worker r2d2-live >/dev/null || fail writers_stop
          names=$(timeout --foreground 20 docker ps --format '{{.Names}}') || fail docker_unreadable
          [ "$(grep -v -x c3po-db-1 <<<"$names" | grep -c . || true)" = 0 ] || fail other_containers_running
          others=$(timeout --foreground 60 $DC exec -T db psql -U c3po -d c3po -At -c "select count(*) from pg_stat_activity where pid <> pg_backend_pid() and backend_type = 'client backend'" < /dev/null) || fail db_clients_unreadable
          [ "$others" = 0 ] || fail database_clients_left
          say "writers=stopped containers_running=1 db_clients=0"
          # 7. the final dump, the globals (role password hashes, 0600, never printed), the exact counts, the write
          # counters (C1b proves nothing changed after the dump) and the server configuration a dump does not carry. Each
          # command in the container bounded on its client (TERM at its limit, KILL 10 s later) and admitted with its bound
          # and KC left (dat); on any exit here (a failure, an error, a TERM, held until the command in flight has returned)
          # every client session the database still serves is ended and that proven (the writers are stopped: only these
          # commands are its clients), so nothing of a cut dump goes on after C1a.
          # kill_clients: proven only on a round where a fresh count of the client backends is 0 (answered only for a
          # superuser, who sees every session; anything else is no proof) and no client program (psql, pg_dump, pg_dumpall,
          # pg_restore) nor shell that could start one is left in its container, as an orphan could connect again (the
          # healthcheck's pg_isready, and a cut file step's cat, test or rm, cannot; its sh lives milliseconds every 10 s);
          # the sessions signalled between rounds (pg_terminate_backend
          # without a timeout reports only the sending, so the rounds decide); each command bounded on its client (15 s, KILL
          # 5 s later): 4 rounds and 3 signals, KC seconds at most in all
          KC=240
          kill_clients() {
            local i n p
            for i in 1 2 3 4; do
              n=$(timeout --foreground -k 5 15 $DC exec -T db psql -U c3po -d postgres -At -c "select case when (select rolsuper from pg_roles where rolname = current_user) then count(*)::text else 'not_superuser' end from pg_stat_activity where pid <> pg_backend_pid() and backend_type = 'client backend'" < /dev/null 2>/dev/null) || n=unreadable
              p=$(timeout --foreground -k 5 15 docker top c3po-db-1 -eo pid,comm 2>/dev/null | awk 'NR > 1 && ($2 == "psql" || $2 == "pg_dump" || $2 == "pg_dumpall" || $2 == "pg_restore" || $2 == "sh") {n++} END {print n + 0}') || p=unreadable
              if [ "$n" = 0 ] && [ "$p" = 0 ]; then return 0; fi
              [ "$i" -lt 4 ] || break
              timeout --foreground -k 5 15 $DC exec -T db psql -U c3po -d postgres -At -c "select count(pg_terminate_backend(pid)) from pg_stat_activity where pid <> pg_backend_pid() and backend_type = 'client backend'" < /dev/null > /dev/null 2>&1 || :
              sleep 3
            done
            return 1
          }
          db_end() { trap ':' TERM HUP INT; if kill_clients; then say "db_sessions=ended"; else say "db_sessions=not_confirmed"; fi; }
          dat() { local need=$1; shift; at "$(( need + KC ))" "$@"; }
          arm db_end
          say "starting=final_dump"
          install -d -m 0700 "$W"
          rm -f "$W"/final.*
          dat 120 dump_cleanup timeout --foreground -k 10 60 $DC exec -T db rm -f /tmp/c3po-final.dump /tmp/c3po-final.ok < /dev/null || fail dump_cleanup
          dat 2100 final_dump timeout --foreground -k 10 1800 $DC exec -T -e 'PGOPTIONS=-c default_transaction_read_only=on' db sh -c 'pg_dump -U c3po -d c3po -Fc --lock-wait-timeout=60s -f /tmp/c3po-final.dump && touch /tmp/c3po-final.ok' < /dev/null || fail pg_dump
          dat 120 dump_check timeout --foreground -k 10 60 $DC exec -T db test -f /tmp/c3po-final.ok < /dev/null || fail pg_dump
          dat 660 dump_list timeout --foreground -k 10 600 $DC exec -T db pg_restore --list /tmp/c3po-final.dump < /dev/null > /dev/null || fail dump_unreadable
          dat 960 dump_copy timeout --foreground -k 10 900 $DC exec -T db cat /tmp/c3po-final.dump < /dev/null > "$W/final.dump" || fail dump_copy
          dat 120 dump_cleanup timeout --foreground -k 10 60 $DC exec -T db rm -f /tmp/c3po-final.dump /tmp/c3po-final.ok < /dev/null || fail dump_cleanup
          dat 360 globals timeout --foreground -k 10 300 $DC exec -T -e 'PGOPTIONS=-c default_transaction_read_only=on' db pg_dumpall -U c3po --globals-only < /dev/null > "$W/final.globals.sql" || fail globals
          dat 960 counts timeout --foreground -k 10 900 $DC exec -T -e 'PGOPTIONS=-c default_transaction_read_only=on' db psql -U c3po -d c3po -At -v ON_ERROR_STOP=1 -c "$count_sql" < /dev/null > "$W/final.counts.raw" || fail counts
          grep '^count|' "$W/final.counts.raw" | sort > "$W/final.counts"
          rm -f "$W/final.counts.raw"
          dat 360 writes timeout --foreground -k 10 300 $DC exec -T db psql -U c3po -d c3po -At -c "select coalesce(sum(n_tup_ins + n_tup_upd + n_tup_del), 0) from pg_stat_user_tables" < /dev/null > "$W/final.writes" || fail writes
          dat 360 pgconf timeout --foreground -k 10 300 $DC exec -T db sh -c "psql -U c3po -d c3po -At -c \"select name || '=' || setting from pg_settings where source not in ('default', 'override', 'client', 'session') and name not in ('data_directory', 'hba_file', 'ident_file', 'config_file') order by name\"; echo '-- auto.conf'; grep -v '^#' /var/lib/postgresql/data/postgresql.auto.conf; echo '-- hba'; grep -v -E '^\s*(#|$)' /var/lib/postgresql/data/pg_hba.conf" < /dev/null > "$W/final.pgconf" || fail pgconf
          # every command in the container returned: none of them runs any more
          disarm
          chmod 0600 "$W"/final.*
          [ "$(wc -l < "$W/final.counts")" -ge 1 ] || fail no_counts
          say "dump_sha=$(sha256sum < "$W/final.dump" | cut -c1-64) counts_sha=$(sha256sum < "$W/final.counts" | cut -c1-64) tables=$(wc -l < "$W/final.counts")"
          # 8. one offsite backup from this same point (its unit's own guard requires the Day-D mount); its dump hash
          # binds the restore drill dispatched next. Started without blocking, admitted with 45 minutes left, waited
          # for, and cancelled (systemctl stop, within the unit's stop timeout) once only 3 minutes would be left: a
          # cancelled or failed run leaves no result this C1a accepts, and a re-run starts it again
          say "starting=offsite_backup"
          # the cancellation's own bound first: the unit's stop worst case (BK_STOP: four kill stages of its own
          # TimeoutStopSec, read and finite, at most 300 s each), one bounded read of its state, the containers its script
          # runs outside its cgroup found, stopped and checked twice (125 s), the database's client sessions ended and proven
          # ended (KC), plus 10 s; its KillMode must be control-group, so a unit seen inactive or failed has no process of its
          # own left. The start is admitted with 45 minutes and that left
          BK_STOP=$(stop_need c3po-postgres-backup.service) || fail backup_stop_unbounded
          [ "$(unit_s Stop c3po-postgres-backup.service)" -le 300 ] || fail backup_stop_timeout_unexpected
          [ "$(timeout --foreground 10 systemctl show -p KillMode --value c3po-postgres-backup.service)" = control-group ] || fail backup_kill_mode_unexpected
          BK_CANCEL=$(( BK_STOP + 10 + 125 + KC + 10 ))
          inv0=$(timeout --foreground 10 systemctl show -p InvocationID --value c3po-postgres-backup.service) || fail backup_unreadable
          # bk_cancel: the unit stopped (never refused, bounded on its client by BK_STOP), its end confirmed by a bounded
          # read of its state (inactive or failed); then the containers its script runs through compose outside its cgroup
          # (one-offs: the upload and, on a failure, the notice; the admission drained every other one) stopped and none left;
          # then the database's client sessions ended and proven ended (kill_clients), and still no one-off. A further signal
          # is held and ignored, so it never cuts the cancel short; confirmed only when all of it is, within BK_CANCEL; the
          # outcome is said either way
          bk_cancel() {
            local st ids ok=yes
            trap ':' TERM HUP INT
            sudo timeout --foreground "$BK_STOP" systemctl stop c3po-postgres-backup.service >/dev/null 2>&1 || ok=no
            st=$(timeout --foreground 10 systemctl show -p ActiveState --value c3po-postgres-backup.service 2>/dev/null) || st=unreadable
            case "$st" in inactive|failed) ;; *) ok=no ;; esac
            if ids=$(timeout --foreground -k 5 15 docker ps -q --filter label=com.docker.compose.oneoff=True 2>/dev/null); then
              [ -z "$ids" ] || timeout --foreground -k 5 60 docker stop -t 10 $ids >/dev/null 2>&1 || ok=no
              ids=$(timeout --foreground -k 5 15 docker ps -q --filter label=com.docker.compose.oneoff=True 2>/dev/null) || ids=unreadable
              [ -z "$ids" ] || ok=no
            else ok=no; fi
            kill_clients || ok=no
            ids=$(timeout --foreground -k 5 15 docker ps -q --filter label=com.docker.compose.oneoff=True 2>/dev/null) || ids=unreadable
            [ -z "$ids" ] || ok=no
            if [ "$ok" = yes ]; then say "backup_cancel=confirmed_ended"; else say "backup_cancel=not_confirmed"; fi
          }
          # the hand-off with its cancel armed first (arm, then handoff): a start queued whose client errs or is cut,
          # or a TERM in the hand-off (acted on once the client has returned), is cancelled and confirmed too; only the
          # admission's own refusal (nothing handed off) disarms it. From then on every exit of this script cancels and
          # confirms (the EXIT path runs cleanup); the evidence accepted later must be newer than the hand-off
          arm bk_cancel
          t_ho=$(date +%s)
          handoff "$(( 2700 + BK_CANCEL ))" offsite_backup timeout --foreground 60 systemctl start --no-block c3po-postgres-backup.service || fail backup_start
          begun=no; waited=0
          while :; do
            # the cancel's time kept before each read (one snapshot of the unit, bounded at 10 s) and checked again after it:
            # a late read can neither eat that time nor turn into a result
            [ "$(( DEADLINE - $(date +%s) ))" -ge "$(( 10 + BK_CANCEL + 10 ))" ] || fail backup_cancelled_at_the_deadline
            props=$(timeout --foreground 10 systemctl show -p InvocationID -p ActiveState -p Job -p Result c3po-postgres-backup.service) || fail backup_unreadable
            [ "$(( DEADLINE - $(date +%s) ))" -ge "$(( BK_CANCEL + 10 ))" ] || fail backup_cancelled_at_the_deadline
            inv=$(sed -n 's/^InvocationID=//p' <<<"$props"); st=$(sed -n 's/^ActiveState=//p' <<<"$props")
            job=$(sed -n 's/^Job=//p' <<<"$props"); res=$(sed -n 's/^Result=//p' <<<"$props")
            [ -n "$st" ] || fail backup_unreadable
            if [ -n "$inv" ] && [ "$inv" != "$inv0" ]; then begun=yes; fi
            # the end is inactive or failed only; any other state (activating, active, deactivating, reloading, refreshing,
            # maintenance) is waited for, within the reserve
            if [ "$begun" = yes ]; then case "$st" in inactive|failed) break ;; esac
            # a start refused (a failed requirement) leaves no job and no new invocation: seen within a minute
            elif [ -z "$job" ] && [ "$waited" -ge 60 ]; then fail backup_not_started; fi
            sleep 10; waited=$((waited + 10))
          done
          # the result from the same snapshot that saw the end, read inside the reserve
          [ "$res" = success ] || fail "backup_result_$res"
          disarm
          say "backup=$res"
