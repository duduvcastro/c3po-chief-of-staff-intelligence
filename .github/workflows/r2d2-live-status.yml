name: Host migration to the 8 GB host (one-off branch, never merged)

# BRANCH fable/host-migration-8gb, never merged. This file REPLACES r2d2-live-status.yml on the branch only, the proven
# way to dispatch a one-off workflow (gh workflow run r2d2-live-status.yml --ref fable/host-migration-8gb -f phase=X
# -f confirm=X); main keeps its own r2d2-live-status.yml. Owner 03/11/2026: "8 GB no fim de semana"; plan v2 in #501.
# A Lightsail snapshot only creates an instance with an equal or larger disk (640 GB there, 160 GB here), so the move
# is a fresh install plus a copy of the data. One phase per dispatch, each only after the Codex's GO on this commit:
#   A    new host (temporary address): packages pinned and the six Docker ones held, the old host's image store, swap,
#        sysstat, timezone. Re-runnable: drifted Docker packages on the still empty store go back to run 1's state.
#        The holds stay after the move; a later, deliberate Docker upgrade lifts them (apt-mark unhold). No writer.
#   B    old -> new through this runner: app tree (volatile trees excluded), journald, the Day-D guard (its five drop-ins
#        and the crontab stored INERT, its helper in /usr/local/libexec copied inert), authorized_keys (the deploy key
#        itself checked), images (IDs compared). No writer.
#   BV   read-only, after B: the revision copied (.deploy-version and the backend image's label, both the named sha) and
#        every other copy of B by hash on both hosts (journald, drop-ins, crontab, authorized_keys, the deploy user's
#        ssh/git, the export log, helpers, policy), the drop-ins' references by type, mode and owner, and the new host's
#        store modes and inertness. Only "=match", counts and the revision are printed; the hashes stay in the runner.
#   C0   read-only, right before C1a and within minutes of the last scheduled summary's end: identity, C1a's own three
#        drift checks against B (app tree, reports clone, images), and that summary bound end to end by identity (its
#        cron session, its container by full ID in Docker's events and containerd's journal), with C1a's drain counts.
#   R    rehearsal of the data path on the LIVE old database (one REPEATABLE READ snapshot: dump, globals with the role
#        password hashes, exact counts), restored on a throwaway volume of the new host and compared, then removed.
#   C1a  old: crontab saved and emptied, c3po-* and apt timers masked, logs kept, ingress and writers stopped (db up),
#        final dump/globals/counts, one offsite backup. Then the restore drill is dispatched by hand.
#   C1b  old: db stopped clean; volatile trees, one-pagers and the final dump copied and compared; Docker masked; Day-D
#        unmounted; power-off. Then the console moves the disk and the static IP, and the operator puts the new host's
#        console-verified key into C3PO_AWS_KNOWN_HOSTS.
#   C2   new (static address): Day-D mounted by UUID (hash below, never formatted), guards installed (every stored unit,
#        sockets too; containerd and Docker restarted through them), legacy network
#        and containers created (not started), the database alone restored and compared. Then the production pipeline is
#        dispatched by hand with the named revision: T_WRITE starts there.
#   C3L  new: cloudflared and pluggy-webhook started (one tunnel connector). D: the old crontab installed (its first
#        runs: the 21:15 export that evening, the 03:30 prune and the 07:00 summary on Sunday). Then the host installers
#        (install-host-security-v1.yml, install-resilience-ops-v1.yml) are dispatched by hand; D2 checks what they left:
#        the backup timer waiting for Sunday 04:00 without a catch-up run, the security timers, the hold.
#   E    Sunday, after the first night is read: the hold removed (the security routine acts again).
#   R0n  back-out BEFORE T_WRITE only, on the new host at the static address: Docker stopped and masked, Day-D unmounted,
#        power-off; then the console returns disk and IP and the operator restores the old C3PO_AWS_KNOWN_HOSTS.
#   R0   then, on the old host powered on again: Docker unmasked, disk mounted, stack, timers and crontab back.
# Scripts reach the hosts base64-encoded in the ssh argument and run with stdin from /dev/null (nothing can swallow
# them). On the old host they hold the reboot controller's maintenance lease, and before C1a they write only their own
# log (/var/log/c3po-migration), the shipped script itself (/tmp/c3po-migration.*, removed on exit) and, in R, the
# rehearsal files under /var/tmp/c3po-migration (removed at the end of R). Every printed line passes an anchored
# guard plus IPv4/IPv6/host-name denies; details stay in /var/log/c3po-migration (root, 0600) on each host.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "A | B | BV | R | C0 | C1a | C1b | C2 | C3L | D | D2 | E | R0n | R0"
        required: true
        type: choice
        options: [A, B, BV, R, C0, C1a, C1b, C2, C3L, D, D2, E, R0n, R0]
      confirm:
        description: "the phase again"
        required: true
      sha:
        description: "BV and C3L: the full revision the production pipeline deployed (40 hex)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read  # the pre-flight refuses to run beside a production pipeline

concurrency:
  group: c3po-host-migration
  cancel-in-progress: false

jobs:
  phase:
    if: github.ref == 'refs/heads/fable/host-migration-8gb'  # never from main or any other branch
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    env:
      PHASE: ${{ inputs.phase }}
      CONFIRM: ${{ inputs.confirm }}
      NAMED_SHA: ${{ inputs.sha }}
      # sha256 of the Day-D filesystem UUID read on the old host (05/11/2026): the new host mounts only that filesystem
      DAY_D_UUID_SHA256: 185a4adbded91480be2236bbc4b0137793184e4311e9f9e5ccb6b725c60232cf
    steps:
      - name: Check the phase and that no production pipeline is running
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$PHASE" = "$CONFIRM" ] || { echo "phase and confirmation differ"; exit 1; }
          [[ "$PHASE" =~ ^(A|B|BV|R|C0|C1a|C1b|C2|C3L|D|D2|E|R0n|R0)$ ]] || { echo "unknown phase"; exit 1; }
          busy=$(gh run list --repo "$REPO" --workflow c3po-pipeline.yml --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          [ "$busy" = "0" ] || { echo "a production pipeline is queued or running: refusing"; exit 1; }
          state=$(gh api "repos/$REPO/actions/workflows/c3po-pipeline.yml" --jq .state)
          case "$PHASE" in
            C1a|C1b|C2|R0n|R0) [ "$state" = disabled_manually ] || { echo "the production pipeline must be disabled from C1a to C2 and for a back-out"; exit 1; } ;;
          esac
          [ -z "$NAMED_SHA" ] || [[ "$NAMED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "the revision must be 40 hex"; exit 1; }
          case "$PHASE" in BV|C3L) [[ "$NAMED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "BV and C3L need the named revision"; exit 1; } ;; esac
          echo "phase=$PHASE pipeline_busy=0 pipeline_state=$state"

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
          NEW_HOSTKEY: ${{ secrets.C3PO_AWS_NEW_HOSTKEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          # "c3po-new ssh-ed25519 <key>", read from the Lightsail console's own SSH on the new host (plan v2, F0)
          [[ "$NEW_HOSTKEY" =~ ^c3po-new\ ssh-ed25519\ [A-Za-z0-9+/]{68}$ ]] || { echo "new host key malformed"; exit 1; }
          { printf '%s\n' "$KNOWN_HOSTS"; printf '%s\n' "$NEW_HOSTKEY"; } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' 'Host *' '  BatchMode yes' '  StrictHostKeyChecking yes' '  ConnectTimeout 15' \
            '  ServerAliveInterval 10' '  ServerAliveCountMax 6' '  IdentityFile ~/.ssh/c3po_deploy' '  IdentitiesOnly yes' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keygen -y -f ~/.ssh/c3po_deploy | cut -d ' ' -f 1,2 > ~/.ssh/c3po_deploy.pub.bare
          [[ "$(cat ~/.ssh/c3po_deploy.pub.bare)" =~ ^ssh-ed25519\ [A-Za-z0-9+/]{68}$ ]] || { echo "deploy key unexpected"; exit 1; }

      - name: Run the phase
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          NEW: ${{ secrets.C3PO_AWS_NEW_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        shell: bash
        run: |
          set +e  # every failure below is handled and reported explicitly
          set -uo pipefail
          out="$RUNNER_TEMP/out.txt"; : > "$out"
          EMPTY_SHA=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          LEASE=/usr/local/lib/c3po-security/c3po_maintenance_run.py
          # before the IP moves (A, B, R, C1a, C1b) the static address is the old host; from C2 on it is the new host
          old() { ssh "$USER@$HOST" "$@"; }
          new_tmp() { ssh -o HostKeyAlias=c3po-new "$USER@$NEW" "$@"; }
          static() { ssh "$USER@$HOST" "$@"; }
          note() { printf '%s %s\n' "$PHASE" "$*" >> "$out"; }
          vcpus() { "$1" 'nproc' 2>/dev/null; }
          # remote TARGET LEASE: the script on stdin, shipped base64 in the argument, run with stdin from /dev/null; only
          # its "<PHASE> ..." lines are kept
          remote() {
            local target=$1 lease=$2 b64 wrap="" status
            b64=$(base64 -w0)
            [ "$lease" = yes ] && wrap=$LEASE
            "$target" "set -o pipefail; f=\$(mktemp /tmp/c3po-migration.XXXXXX) && printf %s '$b64' | base64 -d > \"\$f\" && PHASE=$PHASE DAY_D_UUID_SHA256=$DAY_D_UUID_SHA256 DRIVER=${DRIVER:-none} NAMED_SHA=${NAMED_SHA:-none} $wrap bash \"\$f\" < /dev/null; s=\$?; rm -f \"\$f\"; exit \$s" \
              > "$RUNNER_TEMP/remote.txt" 2>/dev/null
            status=$?
            grep -E "^$PHASE " "$RUNNER_TEMP/remote.txt" >> "$out"
            [ "$status" = 0 ] || grep -q -E "^$PHASE gate=FAIL" "$RUNNER_TEMP/remote.txt" || note "gate=FAIL reason=remote_exit_$status"
            return $status
          }
          # capture TARGET LEASE: as remote, but the script's "H key value" lines (hashes) come back to the caller and never
          # reach the output; its "<PHASE> ..." lines still do
          capture() {
            local target=$1 lease=$2 b64 wrap="" status
            b64=$(base64 -w0)
            [ "$lease" = yes ] && wrap=$LEASE
            "$target" "set -o pipefail; f=\$(mktemp /tmp/c3po-migration.XXXXXX) && printf %s '$b64' | base64 -d > \"\$f\" && PHASE=$PHASE $wrap bash \"\$f\" < /dev/null; s=\$?; rm -f \"\$f\"; exit \$s" \
              > "$RUNNER_TEMP/capture.txt" 2>/dev/null
            status=$?
            grep -E "^$PHASE " "$RUNNER_TEMP/capture.txt" >> "$out"
            [ "$status" = 0 ] || grep -q -E "^$PHASE gate=FAIL" "$RUNNER_TEMP/capture.txt" || note "gate=FAIL reason=capture_exit_$status"
            grep -E '^H [a-z_]+ ([0-9a-f]{40}|[0-9a-f]{64}|[0-9]{1,6})$' "$RUNNER_TEMP/capture.txt"
            return $status
          }
          # the same tree hash on both ends, never the hash of nothing
          same_hash() {  # same_hash LABEL "command" TARGET_A TARGET_B: both ends succeed and agree, never on nothing
            local a b sa sb
            a=$("$3" "set -o pipefail; $2" 2>/dev/null); sa=$?
            b=$("$4" "set -o pipefail; $2" 2>/dev/null); sb=$?
            if [ "$sa" = 0 ] && [ "$sb" = 0 ] && [[ "$a" =~ ^[0-9a-f]{64}$ ]] && [ "$a" != "$EMPTY_SHA" ] && [ "$a" = "$b" ]; then
              note "$1=match"; return 0
            fi
            note "gate=FAIL reason=$1"; return 1
          }
          # a tree's hash: every entry's type, numeric owner, mode, path and link target, then every regular file's
          # content (absolute paths: the same on both hosts; sudo throughout, no cd into root-only directories)
          tree_cmd() {  # tree_cmd BASE TOP [PRUNE...]
            local root="$1/$2" prune="" x; shift 2
            for x in "$@"; do prune="$prune -path $root/$x -prune -o"; done
            printf '%s' "{ sudo find $root $prune ! -type s -printf '%y %U:%G %m %p %l\n' | LC_ALL=C sort || exit 1; sudo find $root $prune -type f -print0 | LC_ALL=C sort -z | sudo xargs -0 -r sha256sum; } | sha256sum | cut -c1-64"
          }
          prelude='set -euo pipefail
          exec 3>&1
          sudo install -d -m 0700 -o root -g root /var/log/c3po-migration
          exec > >(sudo tee -a "/var/log/c3po-migration/$PHASE.log" >/dev/null) 2>&1
          say() { ( trap "" PIPE; printf "%s %s\n" "$PHASE" "$*" >&3 ) 2>/dev/null || exit 21; }
          fail() { say "gate=FAIL reason=$1"; exit 20; }
          cleanup() { :; }
          trap '"'"'s=$?; cleanup || true; [ "$s" = 0 ] || [ "$s" = 20 ] || say "gate=FAIL reason=exit_$s"'"'"' EXIT
          APP=/opt/chief-of-staff-digital
          dc() { docker compose --env-file "$APP/.env" -f "$APP/c3po/compose.yml" "$@"; }
          legacy() { docker compose --env-file "$APP/.env" -f "$APP/docker-compose.yml" "$@"; }
          count_sql="SELECT '"'"'count'"'"', format('"'"'%I.%I'"'"', schemaname, relname), (xpath('"'"'/row/c/text()'"'"', query_to_xml(format('"'"'select count(*) as c from %I.%I'"'"', schemaname, relname), false, true, '"'"''"'"')))[1]::text FROM pg_stat_user_tables ORDER BY 2;"
          '
          rc=0
          case "$PHASE" in
          A)
            [ "$(vcpus new_tmp)" = 2 ] && note "identity_new=ok" || { note "gate=FAIL reason=identity_new"; rc=1; }
            if [ "$rc" = 0 ]; then
              DRIVER=$(old "docker info --format '{{.Driver}}'" 2>/dev/null)
              [[ "$DRIVER" =~ ^(overlay2|overlayfs)$ ]] || { note "gate=FAIL reason=old_driver"; rc=1; }
            fi
            if [ "$rc" = 0 ]; then
              { printf '%s\n' "$prelude"; cat <<'REMOTE'; } | remote new_tmp no || rc=1
          [ "$(nproc)" = 2 ] || fail not_new_host
          [ "$(awk '/MemTotal/ {printf "%d", $2 / 1048576}' /proc/meminfo)" -le 8 ] || fail not_new_host_memory
          [ ! -e "$APP/.env" ] || fail app_already_present
          say "boot_age_s=$(awk '{printf "%d", $1}' /proc/uptime)"
          sudo timedatectl set-timezone America/Sao_Paulo
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /tmp/docker.asc
          gpg --show-keys --with-colons /tmp/docker.asc | grep -q '^fpr:::::::::9DC858229FC7DD38854AE2D88D81803C0EBFCD88:$' || fail docker_key
          sudo install -m 0644 /tmp/docker.asc /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          # the old host's Docker versions, held. A re-run must not move them: on 06/11 run 2 hit exit 100 because
          # dist-upgrade moved them to the repository's newest and the pinned install became a refused downgrade
          pins="docker-ce=5:29.5.3-1~ubuntu.24.04~noble docker-ce-cli=5:29.5.3-1~ubuntu.24.04~noble
            docker-ce-rootless-extras=5:29.5.3-1~ubuntu.24.04~noble containerd.io=2.2.4-1~ubuntu.24.04~noble
            docker-buildx-plugin=0.34.1-1~ubuntu.24.04~noble docker-compose-plugin=5.1.4-1~ubuntu.24.04~noble"
          names=$(for p in $pins; do printf '%s ' "${p%%=*}"; done)
          apt_get() { sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 "$@"; }
          # the last apt error an earlier A left in this host's root-only log, classified; no error text leaves the host
          last=$(sudo grep '^E: ' /var/log/c3po-migration/A.log | tail -n 1 || true)
          case "$last" in
            '') ;;
            *'Packages were downgraded and -y was used without --allow-downgrades'*) say "last_logged_apt_error=downgrade_refused" ;;
            *'Could not get lock'*) say "last_logged_apt_error=apt_lock" ;;
            *) say "last_logged_apt_error=other" ;;
          esac
          # apt-daily and unattended-upgrade take the lists and archive locks, which DPkg::Lock::Timeout does not cover;
          # both are oneshot units, "activating" while they run, so the state is read, not is-active
          apt_busy() {
            for u in apt-daily.service apt-daily-upgrade.service; do
              case "$(systemctl show -p ActiveState --value "$u" 2>/dev/null || true)" in active|activating|deactivating|reloading) return 0 ;; esac
            done
            return 1
          }
          for _ in $(seq 120); do apt_busy || break; sleep 5; done
          if apt_busy; then fail apt_daily_busy; fi
          before=$(dpkg-query -W -f='${Version}' docker-ce 2>/dev/null || true); before=${before#*:}; before=${before%%-*}
          say "docker_before=${before:-none}"
          drift=""
          for p in $pins; do
            n=${p%%=*}
            if [ "$(dpkg-query -W -f='${db:Status-Status}' "$n" 2>/dev/null || true)" = installed ] \
              && [ "$(dpkg-query -W -f='${Version}' "$n")" != "${p#*=}" ]; then drift="$drift $n"; fi
          done
          # never a downgrade in place over files the newer versions wrote: only an empty store (A refuses once B has
          # copied .env) goes back to run 1's state, the packages purged and both data trees recreated. A root-only
          # marker, written once the store is proven empty, lets a reset that died halfway resume where it stopped
          reset_mark=/var/log/c3po-migration/A.docker-reset
          reboot_owed=/var/log/c3po-migration/A.reboot-owed
          boot_id=$(cat /proc/sys/kernel/random/boot_id)
          # settled only by a readable, well-formed boot id that is not this boot's; anything else stays owed
          owed_id=$(sudo cat "$reboot_owed" 2>/dev/null || true)
          if [[ "$owed_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] && [ "$owed_id" != "$boot_id" ]; then
            sudo mv "$reboot_owed" "$reboot_owed.settled"
            say "owed_reboot=settled"
          fi
          # the whole mount table, read with its status: a failed or implausible read (no "/") is never "no mounts";
          # any mount at either root or below it, binds on the same device included, refuses the reset
          store_mounts_refuse() {
            local table line root=0
            table=$(findmnt -rn -o TARGET) || fail mount_table_unreadable
            while IFS= read -r line; do
              case "$line" in
                /) root=1 ;;
                /var/lib/docker|/var/lib/docker/*|/var/lib/containerd|/var/lib/containerd/*) fail store_has_mounts ;;
              esac
            done <<<"$table"
            [ "$root" = 1 ] || fail mount_table_unreadable
          }
          if [ -n "$drift" ] || sudo test -e "$reset_mark"; then
            if ! sudo test -e "$reset_mark"; then
              sudo docker network rm c3po-a-smoke >/dev/null 2>&1 || true
              sudo docker volume rm c3po-a-smoke >/dev/null 2>&1 || true
              ps_out=$(sudo docker ps -aq) || fail docker_unreachable
              img_out=$(sudo docker images -aq) || fail docker_unreachable
              vol_out=$(sudo docker volume ls -q) || fail docker_unreachable
              [ -z "$ps_out$img_out$vol_out" ] || fail store_not_empty
              store_mounts_refuse
              printf '%s\n' "${before:-unknown}" | sudo tee "$reset_mark" >/dev/null
            fi
            store_mounts_refuse
            for u in docker.socket docker.service containerd.service; do
              if systemctl cat "$u" >/dev/null 2>&1; then sudo systemctl stop "$u" || fail docker_stop; fi
            done
            store_mounts_refuse
            apt_get -y --allow-change-held-packages purge $names || fail apt_purge
            store_mounts_refuse
            sudo rm -rf --one-file-system /var/lib/docker /var/lib/containerd || fail store_reset
            # the reboot a reset owes survives a later failure: it is settled only by a boot after this one
            printf '%s\n' "$boot_id" | sudo tee "$reboot_owed" >/dev/null
            from=$(sudo cat "$reset_mark")
            sudo mv "$reset_mark" "$reset_mark.done"
            say "docker_reset=from_${from:-unknown}"
          fi
          installed=""
          for n in $names; do
            if [ "$(dpkg-query -W -f='${db:Status-Status}' "$n" 2>/dev/null || true)" = installed ]; then installed="$installed $n"; fi
          done
          [ -z "$installed" ] || sudo apt-mark hold $installed >/dev/null || fail apt_hold
          apt_get update || fail apt_update
          apt_get -y -o Dpkg::Options::=--force-confold dist-upgrade || fail apt_dist_upgrade
          apt_get -y -o Dpkg::Options::=--force-confold --allow-downgrades --allow-change-held-packages install \
            $pins \
            jq rsync sysstat chrony unattended-upgrades python3-apt python3-boto3 python3-botocore \
            python3-cryptography python3-requests python3-yaml || fail apt_install
          sudo apt-mark hold $names >/dev/null || fail apt_hold
          for p in $pins; do
            [ "$(dpkg-query -W -f='${Version}' "${p%%=*}")" = "${p#*=}" ] || fail "version_$(printf '%s' "${p%%=*}" | tr '.-' '__')"
          done
          [ "$(apt-mark showhold | grep -c -x -F -f <(printf '%s\n' $names))" = 6 ] || fail docker_not_held
          # the old host has exactly these six from download.docker.com; nothing else from that repository
          repo_installed=0
          for n in $(awk '$1 == "Package:" {print $2}' /var/lib/apt/lists/download.docker.com_*_Packages | sort -u); do
            if [ "$(dpkg-query -W -f='${db:Status-Status}' "$n" 2>/dev/null || true)" = installed ]; then repo_installed=$((repo_installed + 1)); fi
          done
          [ "$repo_installed" = 6 ] || fail "docker_repo_packages_$repo_installed"
          say "docker_pins=6 held=6 docker_repo_installed=$repo_installed"
          if [ "$DRIVER" = overlay2 ]; then  # the old host's image store, so image IDs compare one to one in B
            sudo install -d -m 0755 /etc/docker
            printf '{\n  "features": {"containerd-snapshotter": false}\n}\n' | sudo tee /etc/docker/daemon.json >/dev/null
            sudo systemctl restart docker
          fi
          [ "$(sudo docker info --format '{{.Driver}}')" = "$DRIVER" ] || fail driver_mismatch
          [ "$(sudo docker version --format '{{.Server.Version}}')" = 29.5.3 ] || fail docker_server_version
          cleanup() { sudo docker network rm c3po-a-smoke >/dev/null 2>&1 || true; sudo docker volume rm c3po-a-smoke >/dev/null 2>&1 || true; }
          cleanup
          { sudo docker network create c3po-a-smoke >/dev/null && sudo docker network rm c3po-a-smoke >/dev/null; } || fail docker_network_smoke
          { sudo docker volume create c3po-a-smoke >/dev/null && sudo docker volume rm c3po-a-smoke >/dev/null; } || fail docker_volume_smoke
          sudo usermod -aG docker "$(id -un)"
          if ! swapon --show=NAME --noheadings | grep -qx /swapfile; then
            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile >/dev/null
            sudo swapon /swapfile
          fi
          grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
          echo 'vm.swappiness=10' | sudo tee /etc/sysctl.d/60-c3po-swap.conf >/dev/null
          sudo sysctl -q -p /etc/sysctl.d/60-c3po-swap.conf
          sudo sed -i 's/^ENABLED=.*/ENABLED="true"/' /etc/default/sysstat
          sudo systemctl enable --now sysstat >/dev/null
          sudo install -d -o "$(id -un)" -g "$(id -gn)" -m 0775 "$APP"
          containers=$(sudo docker ps -aq | wc -l)
          units=$(systemctl list-unit-files --no-legend | awk '$1 ~ /^c3po-/' | wc -l)
          [ "$containers" = 0 ] && [ "$units" = 0 ] || fail not_empty
          say "docker=$(sudo docker version --format '{{.Server.Version}}') compose=$(sudo docker compose version --short) containerd=$(containerd --version | awk '{print $3}') driver=$(sudo docker info --format '{{.Driver}}')"
          say "tz=$(timedatectl show -p Timezone --value) swap_mb=$(free -m | awk '/^Swap:/ {print $2}') swappiness=$(cat /proc/sys/vm/swappiness) kernel=$(uname -r | tr '.-' '__')"
          say "containers=$containers c3po_units=$units"
          # a Docker reset also reboots: the newer runtime's bridge, firewall chains and AppArmor profile go with it
          if [ -e /var/run/reboot-required ] || sudo test -e "$reboot_owed"; then sudo shutdown -r +1 >/dev/null 2>&1 || fail reboot_schedule; say "reboot=scheduled_in_1_min"; else say "reboot=not_needed"; fi
          say "gate=PASS"
          REMOTE
            fi
            ;;
          B)
            { [ "$(vcpus old)" = 8 ] && [ "$(vcpus new_tmp)" = 2 ]; } && note "identity=ok" || { note "gate=FAIL reason=identity"; rc=1; }
            if [ "$rc" = 0 ]; then
              # 1. the app tree; outputs/, runtime/ and whatsapp_session/ are being written and move in C1b
              if old "$LEASE sudo tar -C /opt --numeric-owner --acls --xattrs --exclude=chief-of-staff-digital/outputs --exclude=chief-of-staff-digital/runtime --exclude=chief-of-staff-digital/whatsapp_session -cpf - chief-of-staff-digital" 2>/dev/null \
                | new_tmp "set -e; if [ -d /opt/chief-of-staff-digital ]; then sudo find /opt/chief-of-staff-digital -mindepth 1 -maxdepth 1 ! -name outputs ! -name runtime ! -name whatsapp_session -exec rm -rf {} +; fi; sudo tar -C /opt --numeric-owner --acls --xattrs -xpf - >/dev/null" > /dev/null 2>&1; then note "app_copy=ok"
              else note "gate=FAIL reason=app_copy"; rc=1; fi
            fi
            if [ "$rc" = 0 ]; then
              same_hash app_tree "$(tree_cmd /opt chief-of-staff-digital outputs runtime whatsapp_session)" old new_tmp || rc=1
            fi
            if [ "$rc" = 0 ]; then
              # 2. journald's limits, as on the old host
              if old "sudo tar -C /etc/systemd --ignore-failed-read -cpf - journald.conf journald.conf.d" 2>/dev/null \
                | new_tmp "sudo tar -C /etc/systemd -xpf - && sudo systemctl restart systemd-journald" > /dev/null 2>&1; then note "journald=copied"
              else note "gate=FAIL reason=journald"; rc=1; fi
            fi
            if [ "$rc" = 0 ]; then
              # 3. the Day-D guard drop-ins and the old crontab, stored INERT under /root (installed only in C2 and D)
              # the September guard: containerd, docker.service and docker.socket, and the two writers B's helpers serve
              if old "sudo tar -C / --ignore-failed-read -cpf - etc/systemd/system/containerd.service.d etc/systemd/system/docker.service.d etc/systemd/system/docker.socket.d etc/systemd/system/c3po-postgres-backup.service.d etc/systemd/system/c3po-host-security-snapshot.service.d" 2>/dev/null \
                | new_tmp "sudo install -d -m 0700 /root/c3po-migration/dropins && sudo tar -C /root/c3po-migration/dropins -xpf -" > /dev/null 2>&1; then note "dropins=stored_inert"
              else note "gate=FAIL reason=dropins"; rc=1; fi
              nd=$(new_tmp "set -o pipefail; sudo find /root/c3po-migration/dropins/etc/systemd/system -mindepth 1 -maxdepth 1 -type d -name '*.d' | wc -l" 2>/dev/null) || nd=unknown
              note "dropin_dirs_stored=${nd:-unknown}"
              [ "$nd" = 5 ] || { note "gate=FAIL reason=dropin_dirs"; rc=1; }
              refs=$(new_tmp "set -o pipefail; sudo sh -c 'cat /root/c3po-migration/dropins/etc/systemd/system/*.d/*.conf' | grep -o -E '/(usr|etc|opt|mnt|var)/[A-Za-z0-9_./=@-]+' | sort -u" 2>/dev/null)
              missing=0; names=""; on_day_d=0
              for p in $refs; do
                case "$p" in /mnt/day-d-data|/mnt/day-d-data/*) on_day_d=$((on_day_d + 1)); continue ;; esac  # mounted in C2
                if ! new_tmp "sudo test -e '$p'" 2>/dev/null; then
                  missing=$((missing + 1)); names="$names,$(basename "$p" | tr -dc 'A-Za-z0-9_.-' | cut -c1-40)"
                fi
              done
              names=${names#,}; [ -n "$names" ] || names=none
              note "dropin_refs=$(printf '%s\n' $refs | grep -c .) on_day_d=$on_day_d missing_on_new=$missing missing_names=$names"
              [ "$on_day_d" -ge 1 ] || { note "gate=FAIL reason=no_day_d_guard_found"; rc=1; }
              if old "crontab -l" 2>/dev/null \
                | new_tmp "sudo install -d -m 0700 /root/c3po-migration && sudo tee /root/c3po-migration/crontab.deploy >/dev/null && sudo chmod 0600 /root/c3po-migration/crontab.deploy" > /dev/null 2>&1; then note "crontab=stored_inert"
              else note "gate=FAIL reason=crontab"; rc=1; fi
            fi
            if [ "$rc" = 0 ]; then
              # 4. authorized_keys: the old file verbatim, only when it carries this runner's deploy key itself
              key=$(cat ~/.ssh/c3po_deploy.pub.bare)
              if [ "$(old "grep -c -F '$key' ~/.ssh/authorized_keys" 2>/dev/null)" != 1 ]; then
                note "gate=FAIL reason=old_keys"; rc=1
              elif old "cat ~/.ssh/authorized_keys" 2>/dev/null \
                | new_tmp "set -e; [ -e ~/.ssh/authorized_keys.pre-migration ] || cp -p ~/.ssh/authorized_keys ~/.ssh/authorized_keys.pre-migration; umask 077; cat > ~/.ssh/authorized_keys.next; grep -q -F '$key' ~/.ssh/authorized_keys.next; mv ~/.ssh/authorized_keys.next ~/.ssh/authorized_keys" > /dev/null 2>&1 \
                && [ "$(vcpus new_tmp)" = 2 ]; then note "authorized_keys=copied login=ok"
              else note "gate=FAIL reason=authorized_keys"; rc=1; fi
            fi
            if [ "$rc" = 0 ]; then
              # 5. the 21:15 daily export (scripts/r2d2-publish-daily-report.sh pushes /opt/r2d2-reports to the private
              # reports repository every day): its clone, the deploy user's ssh/git configuration (authorized_keys apart),
              # and its log, all with owners and modes kept
              if old "$LEASE sudo tar -C /opt --numeric-owner --acls --xattrs -cpf - r2d2-reports" 2>/dev/null \
                | new_tmp "set -e; sudo rm -rf /opt/r2d2-reports; sudo tar -C /opt --numeric-owner --acls --xattrs -xpf -" > /dev/null 2>&1; then note "reports_clone=copied"
              else note "gate=FAIL reason=reports_clone"; rc=1; fi
              if [ "$rc" = 0 ]; then
                same_hash reports_tree "$(tree_cmd /opt r2d2-reports)" old new_tmp || rc=1
              fi
              if [ "$rc" = 0 ] && old "cd ~ && tar --ignore-failed-read --exclude=.ssh/authorized_keys --exclude=.ssh/authorized_keys2 -cpf - .ssh .gitconfig" 2>/dev/null \
                | new_tmp "cd ~ && tar -xpf - && chmod 700 ~/.ssh" > /dev/null 2>&1; then note "user_ssh_git=copied"
              elif [ "$rc" = 0 ]; then note "gate=FAIL reason=user_ssh_git"; rc=1; fi
              if [ "$rc" = 0 ] && old "sudo tar -C /var/log --ignore-failed-read -cpf - r2d2-daily-export.log" 2>/dev/null \
                | new_tmp "sudo tar -C /var/log -xpf -" > /dev/null 2>&1; then note "export_log=copied"
              elif [ "$rc" = 0 ]; then note "gate=FAIL reason=export_log"; rc=1; fi
            fi
            if [ "$rc" = 0 ]; then
              # 6. inert host files the first deploy needs: install-security-daily.sh refuses to run without the snapshot
              # helper; the backup helper and the dead-man ping come with it. The security policy keeps the old host's
              # approval state; the explicit hold that keeps it inactive is created in C2. No unit or timer is installed.
              if old "sudo tar -C /usr/local/sbin -cpf - c3po-healthcheck-ping c3po-host-security-snapshot c3po-postgres-backup" 2>/dev/null \
                | new_tmp "sudo tar -C /usr/local/sbin -xpf -" > /dev/null 2>&1; then note "sbin_helpers=copied_inert"
              else note "gate=FAIL reason=sbin_helpers"; rc=1; fi
              if [ "$rc" = 0 ] && old "sudo tar -C /usr/local/libexec -cpf - c3po-day-d-guard" 2>/dev/null \
                | new_tmp "sudo install -d -m 0755 -o root -g root /usr/local/libexec && sudo tar -C /usr/local/libexec -xpf -" > /dev/null 2>&1; then note "guard_helper=copied_inert"
              elif [ "$rc" = 0 ]; then note "gate=FAIL reason=guard_helper"; rc=1; fi
              if [ "$rc" = 0 ] && old "sudo tar -C /etc -cpf - c3po/security-automation.json" 2>/dev/null \
                | new_tmp "sudo install -d -m 0700 -o root -g root /etc/c3po && sudo tar -C /etc -xpf -" > /dev/null 2>&1; then note "security_policy=copied"
              elif [ "$rc" = 0 ]; then note "gate=FAIL reason=security_policy"; rc=1; fi
            fi
            if [ "$rc" = 0 ]; then
              # 7. room for the images, the rehearsal and the final copy (about 30 GB at the peak) and inodes
              free_g=$(new_tmp "df -P -BG / | awk 'NR == 2 {sub(/G/, \"\", \$4); print \$4}'" 2>/dev/null) || free_g=0
              inodes_pct=$(new_tmp "df -P -i / | awk 'NR == 2 {sub(/%/, \"\", \$5); print \$5}'" 2>/dev/null) || inodes_pct=100
              note "new_free_g=$free_g new_inodes_used_pct=$inodes_pct"
              { [ "$free_g" -ge 60 ] && [ "$inodes_pct" -le 50 ]; } 2>/dev/null || { note "gate=FAIL reason=new_space"; rc=1; }
            fi
            if [ "$rc" = 0 ]; then
              # the drop-ins' references again, now that the helpers are there: every one outside Day-D must exist
              missing=0
              for p in $refs; do
                case "$p" in /mnt/day-d-data|/mnt/day-d-data/*) continue ;; esac
                new_tmp "sudo test -e '$p'" 2>/dev/null || missing=$((missing + 1))
              done
              note "dropin_refs_missing_after_helpers=$missing"
              [ "$missing" = 0 ] || { note "gate=FAIL reason=dropin_refs_missing"; rc=1; }
            fi
            if [ "$rc" = 0 ]; then
              # 8. images by docker save | docker load; IDs compared one to one
              images='c3po/database:production c3po/backend:production c3po/web:production c3po/database:rollback c3po/backend:rollback c3po/web:rollback chief-of-staff-digital-morning-summary:latest chief-of-staff-digital-whatsapp-login:latest chief-of-staff-digital-whatsapp-capture:latest chief-of-staff-digital-pluggy-webhook:latest cloudflare/cloudflared:latest'
              old "$LEASE docker save $images" 2>/dev/null | new_tmp "sudo docker load" > /dev/null 2>&1 \
                || { note "gate=FAIL reason=image_copy"; rc=1; }
              same=0; total=0
              for image in $images; do
                total=$((total + 1))
                a=$(old "docker image inspect --format '{{.Id}}' $image" 2>/dev/null)
                b=$(new_tmp "sudo docker image inspect --format '{{.Id}}' $image" 2>/dev/null)
                if [[ "$a" =~ ^sha256:[0-9a-f]{64}$ ]] && [ "$a" = "$b" ]; then same=$((same + 1)); fi
              done
              note "images_same=$same of $total"
              [ "$same" = "$total" ] || { note "gate=FAIL reason=image_ids"; rc=1; }
            fi
            if [ "$rc" = 0 ]; then
              c=$(new_tmp "set -o pipefail; sudo docker ps -aq | wc -l" 2>/dev/null) || c=unknown
              u=$(new_tmp "set -o pipefail; systemctl list-unit-files --no-legend | awk '\$1 ~ /^c3po-/' | wc -l" 2>/dev/null) || u=unknown
              note "new_containers=${c:-unknown} new_c3po_units=${u:-unknown}"
              if [ "$c" = 0 ] && [ "$u" = 0 ]; then note "gate=PASS"; else note "gate=FAIL reason=not_inert"; rc=1; fi
            fi
            ;;
          BV)
            { [ "$(vcpus old)" = 8 ] && [ "$(vcpus new_tmp)" = 2 ]; } && note "identity=ok" || { note "gate=FAIL reason=identity"; rc=1; }
            # one script, run on each host with its ROLE; every measure fails closed (v=$(...) || fail), and each value
            # goes back as an "H key value" line that only this runner sees
            cat > "$RUNNER_TEMP/bv.sh" <<'REMOTE'
          hsay() { printf 'H %s %s\n' "$1" "$2" >&3; }
          h() { sha256sum | cut -c1-64; }
          # tree_hash BASE REL...: each entry's type, numeric owner, mode, path relative to BASE and link target, then each
          # regular file's content
          tree_hash() {
            sudo env LC_ALL=C bash -c 'set -eo pipefail; cd "$1" && shift && { find "$@" ! -type s -printf "%y %U:%G %m %p %l\n" | sort && find "$@" -type f -print0 | sort -z | xargs -0 -r sha256sum; }' _ "$@" | h
          }
          present() {  # present BASE REL...: the RELs that exist under BASE
            local base=$1 r found=""; shift
            for r in "$@"; do if sudo test -e "$base/$r"; then found="$found $r"; fi; done
            printf '%s' "$found"
          }
          if [ "$ROLE" = old ]; then dropin_base=/; else dropin_base=/root/c3po-migration/dropins; fi
          # 1. the revision the copied application and its backend image carry
          rev=$(cat /opt/chief-of-staff-digital/.deploy-version) || fail app_revision_read
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || fail app_revision_read
          img=$(sudo docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' c3po/backend:production) || fail image_revision_read
          [[ "$img" =~ ^[0-9a-f]{40}$ ]] || fail image_revision_read
          hsay app_revision "$rev"
          hsay image_revision "$img"
          # 2. journald's configuration: every regular file of journald.conf and journald.conf.d, mode, owner and content
          # (an absent or empty journald.conf.d adds nothing)
          v=$(sudo env LC_ALL=C bash -c 'set -eo pipefail; cd /etc/systemd; { if [ -f journald.conf ]; then echo journald.conf; fi; if [ -d journald.conf.d ]; then find journald.conf.d ! -type d; fi; } | sort | while IFS= read -r f; do stat -c "%a %u:%g %n" "$f"; sha256sum "$f"; done' | h) || fail journald_read
          [ "$v" != "$(printf '' | h)" ] || fail journald_absent
          hsay journald "$v"
          # 3. the Day-D guard drop-ins (installed on the old host, stored inert on the new one)
          d=$(present "$dropin_base" etc/systemd/system/containerd.service.d etc/systemd/system/docker.service.d etc/systemd/system/docker.socket.d etc/systemd/system/c3po-postgres-backup.service.d etc/systemd/system/c3po-host-security-snapshot.service.d)
          [ -n "$d" ] || fail dropins_absent
          v=$(tree_hash "$dropin_base" $d) || fail dropins_read
          hsay dropins "$v"
          # 4. the crontab (live on the old host, stored inert on the new one)
          if [ "$ROLE" = old ]; then v=$(crontab -l | h) || fail crontab_read; else v=$(sudo cat /root/c3po-migration/crontab.deploy | h) || fail crontab_read; fi
          hsay crontab "$v"
          # 5. authorized_keys, mode and content
          v=$( { stat -c '%a %u:%g' "$HOME/.ssh/authorized_keys" && cat "$HOME/.ssh/authorized_keys"; } | h) || fail authorized_keys_read
          hsay authorized_keys "$v"
          # 6. the deploy user's ssh files (authorized_keys apart) and .gitconfig
          v=$(env LC_ALL=C bash -c 'set -eo pipefail; cd "$HOME" && { { find .ssh -mindepth 1 ! -name "authorized_keys*" ! -type s -printf "%y %U:%G %m %p %l\n"; if [ -e .gitconfig ]; then find .gitconfig -printf "%y %U:%G %m %p %l\n"; fi; } | sort && { find .ssh -mindepth 1 ! -name "authorized_keys*" -type f -print0; if [ -e .gitconfig ]; then printf "%s\0" .gitconfig; fi; } | sort -z | xargs -0 -r sha256sum; }' | h) || fail user_ssh_git_read
          hsay user_ssh_git "$v"
          # 7. the 21:15 export's log, mode, owner and content
          v=$( { sudo stat -c '%a %u:%g' /var/log/r2d2-daily-export.log && sudo cat /var/log/r2d2-daily-export.log; } | h) || fail export_log_read
          hsay export_log "$v"
          # 8. the inert helpers and the security policy
          v=$(tree_hash /usr/local/sbin c3po-healthcheck-ping c3po-host-security-snapshot c3po-postgres-backup) || fail sbin_helpers_read
          hsay sbin_helpers "$v"
          v=$(tree_hash /etc c3po/security-automation.json) || fail security_policy_read
          hsay security_policy "$v"
          v=$(tree_hash /usr/local/libexec c3po-day-d-guard) || fail guard_helper_read
          hsay guard_helper "$v"
          # 8b. the 11 images B loaded, each by its full ID
          v=$(for image in c3po/database:production c3po/backend:production c3po/web:production c3po/database:rollback c3po/backend:rollback c3po/web:rollback chief-of-staff-digital-morning-summary:latest chief-of-staff-digital-whatsapp-login:latest chief-of-staff-digital-whatsapp-capture:latest chief-of-staff-digital-pluggy-webhook:latest cloudflare/cloudflared:latest; do
                id=$(sudo docker image inspect --format '{{.Id}}' "$image") || exit 1
                [[ "$id" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
                printf '%s %s\n' "$image" "$id"
              done | h) || fail images_read
          hsay images "$v"
          hsay images_checked 11
          # 9. every path the drop-ins name, Day-D apart (mounted in C2): type, mode, owner, as on the old host
          refs=$(sudo bash -c 'shopt -s nullglob; cat "$1"/etc/systemd/system/containerd.service.d/*.conf "$1"/etc/systemd/system/docker.service.d/*.conf "$1"/etc/systemd/system/docker.socket.d/*.conf "$1"/etc/systemd/system/c3po-postgres-backup.service.d/*.conf "$1"/etc/systemd/system/c3po-host-security-snapshot.service.d/*.conf < /dev/null' _ "$dropin_base" | grep -o -E '/(usr|etc|opt|mnt|var)/[A-Za-z0-9_./=@-]+' | LC_ALL=C sort -u) || fail dropin_refs_read
          n=0; lines=""
          for p in $refs; do
            case "$p" in /mnt/day-d-data|/mnt/day-d-data/*) continue ;; esac
            s=$(sudo env LC_ALL=C stat -c '%F %a %u:%g %n' "$p") || fail dropin_ref_unreadable
            case "$s" in
              "regular file "*|"regular empty file "*) ;;
              *) s=$(sudo env LC_ALL=C stat -c '%F %u %n' "$p") || fail dropin_ref_unreadable ;;  # a directory or socket: type and owner
            esac
            lines="$lines$s"$'\n'; n=$((n + 1))
          done
          [ "$n" -ge 1 ] || fail dropin_refs_none
          v=$(printf '%s' "$lines" | h) || fail dropin_refs_hash
          hsay dropin_refs_modes "$v"
          hsay dropin_refs_checked "$n"
          # 10. the new host only: the stored copies' modes, the helpers executable, still inert
          if [ "$ROLE" = new ]; then
            [ "$(stat -c '%a' "$HOME/.ssh")" = 700 ] || fail new_ssh_dir_mode
            [ "$(stat -c '%a' "$HOME/.ssh/authorized_keys")" = 600 ] || fail new_authorized_keys_mode
            [ "$(sudo stat -c '%a %U' /root/c3po-migration)" = "700 root" ] || fail new_store_mode
            [ "$(sudo stat -c '%a %U' /root/c3po-migration/dropins)" = "700 root" ] || fail new_dropins_store_mode
            [ "$(sudo stat -c '%a %U' /root/c3po-migration/crontab.deploy)" = "600 root" ] || fail new_crontab_store_mode
            [ "$(sudo stat -c '%a %U' /etc/c3po)" = "700 root" ] || fail new_policy_dir_mode
            for x in c3po-healthcheck-ping c3po-host-security-snapshot c3po-postgres-backup; do
              sudo test -x "/usr/local/sbin/$x" || fail new_helper_not_executable
            done
            [ "$(sudo stat -c '%a %U' /usr/local/libexec/c3po-day-d-guard)" = "755 root" ] || fail new_guard_helper_mode
            [ "$(sudo stat -c '%a %U' /usr/local/libexec)" = "755 root" ] || fail new_libexec_mode
            # the guard runs here and refuses while Day-D is still on the old host (its reason stays in the host's log)
            if g=$(sudo /usr/local/libexec/c3po-day-d-guard 2>&1 >/dev/null); then fail new_guard_accepts_without_day_d; fi
            case "$g" in *C3PO_DAY_D_GUARD_FAIL:*) ;; *) fail new_guard_did_not_run ;; esac
            c=$(sudo docker ps -aq | wc -l) || fail new_docker_unreadable
            u=$(systemctl list-unit-files --no-legend | awk '$1 ~ /^c3po-/' | wc -l) || fail new_units_unreadable
            [ "$c" = 0 ] && [ "$u" = 0 ] || fail new_not_inert
            say "new_modes=ok new_guard=refuses_without_day_d new_containers=$c new_c3po_units=$u"
          else
            say "old_read=ok"
          fi
          REMOTE
            if [ "$rc" = 0 ]; then
              h_old=$( { printf 'ROLE=old\n%s\n' "$prelude"; cat "$RUNNER_TEMP/bv.sh"; } | capture old yes) || rc=1
            fi
            if [ "$rc" = 0 ]; then
              h_new=$( { printf 'ROLE=new\n%s\n' "$prelude"; cat "$RUNNER_TEMP/bv.sh"; } | capture new_tmp no) || rc=1
            fi
            if [ "$rc" = 0 ]; then
              for k in app_revision image_revision journald dropins crontab authorized_keys user_ssh_git export_log sbin_helpers security_policy guard_helper images images_checked dropin_refs_modes dropin_refs_checked; do
                a=$(awk -v k="$k" '$2 == k {print $3}' <<<"$h_old"); b=$(awk -v k="$k" '$2 == k {print $3}' <<<"$h_new")
                if [[ "$a" =~ ^[0-9a-f]+$ ]] && [ "$a" = "$b" ] && [ "$a" != "$EMPTY_SHA" ]; then note "$k=match"; else note "gate=FAIL reason=$k"; rc=1; fi
              done
            fi
            if [ "$rc" = 0 ]; then
              rev=$(awk '$2 == "app_revision" {print $3}' <<<"$h_old"); img=$(awk '$2 == "image_revision" {print $3}' <<<"$h_old")
              if [ "$rev" = "$NAMED_SHA" ] && [ "$img" = "$NAMED_SHA" ]; then note "named_revision=$rev app=yes image=yes"
              else note "gate=FAIL reason=not_the_named_revision"; rc=1; fi
            fi
            if [ "$rc" = 0 ]; then
              note "dropin_refs_checked=$(awk '$2 == "dropin_refs_checked" {print $3}' <<<"$h_old")"
              note "gate=PASS"
            fi
            ;;
          R)
            { [ "$(vcpus old)" = 8 ] && [ "$(vcpus new_tmp)" = 2 ]; } && note "identity=ok" || { note "gate=FAIL reason=identity"; rc=1; }
            if [ "$rc" = 0 ]; then
              # ONE session on the live old database: REPEATABLE READ READ ONLY, the snapshot exported, pg_dump run in it
              # (\! with the exported snapshot and a lock wait limit), the exact counts in the same snapshot, COMMIT
              { printf '%s\n' "$prelude"; cat <<'REMOTE'; } | remote old yes || rc=1
          W=/var/tmp/c3po-migration
          cleanup() { dc exec -T db rm -f /tmp/c3po-r.dump /tmp/c3po-r.sql /tmp/c3po-r.ok < /dev/null || true; }
          install -d -m 0700 "$W"
          rm -f "$W"/r.*
          cleanup
          cat > "$W/r.sql" <<SQL
          BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY;
          SELECT pg_export_snapshot() AS snap \gset
          \setenv SNAP :snap
          \! pg_dump -U c3po -d c3po -Fc --lock-wait-timeout=60s --snapshot="\$SNAP" -f /tmp/c3po-r.dump && touch /tmp/c3po-r.ok
          $count_sql
          COMMIT;
          SQL
          dc exec -T -e 'PGOPTIONS=-c default_transaction_read_only=on' db sh -c 'cat > /tmp/c3po-r.sql && psql -U c3po -d c3po -At -v ON_ERROR_STOP=1 -f /tmp/c3po-r.sql' \
            < "$W/r.sql" > "$W/r.out"
          dc exec -T db test -f /tmp/c3po-r.ok < /dev/null || fail pg_dump
          dc exec -T db pg_restore --list /tmp/c3po-r.dump < /dev/null > /dev/null || fail dump_unreadable
          grep '^count|' "$W/r.out" | sort > "$W/r.counts"
          dc exec -T db cat /tmp/c3po-r.dump < /dev/null > "$W/r.dump"
