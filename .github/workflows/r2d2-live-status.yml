name: R2D2 live status (read-only)

# The live R2D2 runs inside the C3PO server (service r2d2-live, owner 27/10/2026). This read-only check prints the
# container state, the engine's own summary from the database (no symbols), its count-only log lines and the NUMBER of
# error lines (this repository is public: no symbol and no error text is printed), any API token redacted. It changes
# nothing on the host.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "log window, in minutes (1-240)"
        default: "30"

permissions:
  contents: read

concurrency:
  group: r2d2-live-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    environment: production  # the host's address and known hosts are the production environment's (the repository-level ones predate the host migration)
    timeout-minutes: 10
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh || exit 1
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy || exit 1
          chmod 600 ~/.ssh/c3po_deploy || exit 1
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts || exit 1
          chmod 600 ~/.ssh/known_hosts || exit 1

      - name: Read the r2d2-live state, summary and logs
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
          MINUTES: ${{ inputs.minutes }}
        shell: bash
        run: |
          set -uo pipefail
          [[ "$MINUTES" =~ ^[0-9]{1,3}$ ]] && [ "$MINUTES" -ge 1 ] && [ "$MINUTES" -le 240 ] || { echo "minutes must be 1-240"; exit 1; }
          rc=0
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "MINUTES=$MINUTES bash -s" <<'REMOTE' > "$RUNNER_TEMP/out.txt" 2>&1 || rc=$?
          set -uo pipefail
          exec 2>/dev/null
          cd /opt/chief-of-staff-digital || exit 10
          compose=(docker compose --env-file .env -f c3po/compose.yml)
          echo "== massive snapshot: response shape and trade age, keys and numbers only"
          timeout 60 "${compose[@]}" exec -T api python - <<'PY' | grep -oE '^(status=[A-Za-z]{0,12} rows=[0-9]+|keys=[A-Za-z_,]+ last_trade_keys=[A-Za-z_,]* price_positive=(True|False) t_digits=[0-9]+ age_s=-?[0-9]+|snapshot failed=[A-Za-z]+)$' || echo "snapshot read printed nothing"
          from datetime import datetime, timezone
          from app.config import get_settings
          from app.market_data.http import JsonHttpClient
          s = get_settings()
          try:
              body = JsonHttpClient(timeout=10.0, max_retries=0).get_json(
                  s.massive_base_url.rstrip("/") + "/v2/snapshot/locale/us/markets/stocks/tickers",
                  params={"tickers": "SPY,QQQ,BRK.B", "apiKey": s.massive_api_token})
              rows = body.get("tickers") if isinstance(body, dict) else None
              rows = rows if isinstance(rows, list) else []
              print("status=%s rows=%d" % (str(body.get("status") if isinstance(body, dict) else "")[:12], len(rows)))
              now = datetime.now(timezone.utc).timestamp()
              for row in rows:
                  trade = row.get("lastTrade") if isinstance(row, dict) and isinstance(row.get("lastTrade"), dict) else {}
                  stamp = int(trade.get("t") or 0)
                  print("keys=%s last_trade_keys=%s price_positive=%s t_digits=%d age_s=%d" % (
                      ",".join(sorted(key for key in row if key != "ticker")) if isinstance(row, dict) else "", ",".join(sorted(trade)),
                      float(trade.get("p") or 0) > 0, len(str(stamp)), int(now - stamp / 1e9) if stamp else -1))
          except Exception as error:
              print("snapshot failed=%s" % type(error).__name__)
          PY
          echo "== host peaks per day (sysstat), numbers only"
          peak() {  # file, sadf report, column, max|min
            sadf -d "$1" -- "$2" | awk -F';' -v col="$3" -v mode="$4" '
              /^# hostname/ { sub(/^# /, ""); for (i = 1; i <= NF; i++) if ($i == col) c = i; next }
              c && $c ~ /^[0-9]+([.][0-9]+)?$/ { v = $c + 0; if (!n || (mode == "max" ? v > m : v < m)) m = v; n++ }
              END { if (n) printf "%.1f", m; else printf "na" }'
          }
          for f in $(ls /var/log/sysstat/sa[0-9][0-9] 2>/dev/null | sort); do
            printf 'day=%s memused_pct_max=%s kbmemused_max=%s kbcommit_max=%s cpu_idle_pct_min=%s ldavg1_max=%s\n' "$(basename "$f")" \
              "$(peak "$f" -r %memused max)" "$(peak "$f" -r kbmemused max)" "$(peak "$f" -r kbcommit max)" \
              "$(peak "$f" -u %idle min)" "$(peak "$f" -q ldavg-1 max)"
          done | grep -E '^day=sa[0-9]{2} memused_pct_max=[0-9.na]+ kbmemused_max=[0-9.na]+ kbcommit_max=[0-9.na]+ cpu_idle_pct_min=[0-9.na]+ ldavg1_max=[0-9.na]+$'
          echo "== now"
          free -m | awk '/^Mem:/ { printf "mem_mb total=%d used=%d available=%d\n", $2, $3, $7 }'
          nproc | awk '{ printf "cpus=%d\n", $1 }'
          timeout 30 docker stats --no-stream --format '{{.Name}} mem={{.MemUsage}}' | grep -E '^[a-z0-9-]+ mem=[0-9.]+[KMG]iB / [0-9.]+[KMG]iB$'
          exit 0
          REMOTE
          # every line printed is sanitized; a failed access or a failed mandatory read fails the run (Codex #500 P2-7)
          sed -E 's/(api_token=)[^&[:space:]"]+/\1[redacted]/g' "$RUNNER_TEMP/out.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "remote exit status: $rc"
          exit "$rc"
