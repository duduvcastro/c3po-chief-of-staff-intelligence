name: R2D2 live status (read-only)

# The live R2D2 runs inside the C3PO server (service r2d2-live, owner 27/10/2026). This read-only check prints the
# container state, the engine's own summary from the database (no symbols), its count-only log lines and the NUMBER of
# error lines (this repository is public: no symbol and no error text is printed), any API token redacted. It changes
# nothing on the host.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "log window, in minutes (1-240)"
        default: "30"

permissions:
  contents: read

concurrency:
  group: r2d2-live-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    environment: production  # the current host
    timeout-minutes: 10
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh || exit 1
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy || exit 1
          chmod 600 ~/.ssh/c3po_deploy || exit 1
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts || exit 1
          chmod 600 ~/.ssh/known_hosts || exit 1

      - name: Read EODHD's six cash indices and Massive's news sentiment coverage, once, read-only
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          # before FMP and Finnhub leave (owner 03/11/2026): do EODHD's .INDX codes answer, how fresh, with intraday bars; how
          # many watched US names Massive's news insights cover in 7 days. Ordinals and counts only; ssh's errors stay private
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/c3po_deploy "$USER@$HOST" "bash -s" <<'REMOTE' > "$RUNNER_TEMP/out.txt" 2> "$RUNNER_TEMP/ssh_err.txt" || rc=$?
          set -uo pipefail
          exec 2>/dev/null
          cd /opt/chief-of-staff-digital || exit 10
          timeout 240 docker compose --env-file .env -f c3po/compose.yml exec -T -e 'PGOPTIONS=-c default_transaction_read_only=on' api python - <<'PY'
          import statistics, time
          from datetime import datetime, timedelta, timezone
          import httpx
          from app.config import get_settings
          from app.database import Database
          s = get_settings()
          now = datetime.now(timezone.utc)
          base = s.eodhd_base_url.rstrip("/")
          base = base if base.endswith("/api") else base + "/api"
          codes = ["BVSP.INDX", "IXIC.INDX", "NYA.INDX", "N225.INDX", "SSEC.INDX", "GDAXI.INDX", "000001.SHG"]
          try:
              response = httpx.get(base + "/real-time/" + codes[0], params={"s": ",".join(codes[1:]), "fmt": "json", "api_token": s.eodhd_api_token}, timeout=20.0)
              print("eodhd_realtime_http=%d" % response.status_code)
              rows = response.json() if response.status_code == 200 else []
              rows = rows if isinstance(rows, list) else [rows]
              by_code = {str(row.get("code")): row for row in rows if isinstance(row, dict)}
              for index, code in enumerate(codes, 1):
                  row = by_code.get(code) or {}
                  stamp, close, previous = row.get("timestamp"), row.get("close"), row.get("previousClose")
                  ok = isinstance(stamp, (int, float)) and isinstance(close, (int, float)) and close > 0
                  age = int(now.timestamp() - stamp) if ok else -1
                  print("index_%d answered=%s age_s=%d previous_close=%s" % (index, ok, age, isinstance(previous, (int, float)) and previous > 0))
          except Exception as error:
              print("eodhd_realtime failed=%s" % type(error).__name__)
          for index, code in ((2, "IXIC.INDX"), (1, "BVSP.INDX")):
              try:
                  response = httpx.get(base + "/intraday/" + code, params={"interval": "5m", "from": int((now - timedelta(days=2)).timestamp()), "fmt": "json", "api_token": s.eodhd_api_token}, timeout=20.0)
                  bars = response.json() if response.status_code == 200 else []
                  bars = [bar for bar in bars if isinstance(bar, dict) and bar.get("timestamp")] if isinstance(bars, list) else []
                  last = max((int(bar["timestamp"]) for bar in bars), default=0)
                  print("intraday_index_%d http=%d bars=%d last_bar_age_s=%d" % (index, response.status_code, len(bars), int(now.timestamp() - last) if last else -1))
              except Exception as error:
                  print("intraday_index_%d failed=%s" % (index, type(error).__name__))
          try:
              watched = sorted({item["symbol"] for item in Database(s).ir_watch_symbols() if item["market"] == "US"})
              print("watched_us=%d" % len(watched))
              since = (now - timedelta(days=7)).strftime("%Y-%m-%dT%H:%M:%SZ")
              covered, articles, sentiments, failures, started = 0, [], {"positive": 0, "negative": 0, "neutral": 0, "other": 0}, 0, time.monotonic()
              for symbol in watched[:400]:
                  if time.monotonic() - started > 120:
                      break
                  try:
                      response = httpx.get(s.massive_base_url.rstrip("/") + "/v2/reference/news",
                                           params={"ticker": symbol.replace("-", "."), "published_utc.gte": since, "limit": 100, "apiKey": s.massive_api_token}, timeout=15.0)
                      if response.status_code != 200:
                          failures += 1
                          continue
                      results = response.json().get("results") or []
                      mine = [insight for article in results if isinstance(article, dict) for insight in (article.get("insights") or [])
                              if isinstance(insight, dict) and str(insight.get("ticker") or "").upper() == symbol.replace("-", ".").upper()]
                  except Exception:
                      failures += 1
                      continue
                  if mine:
                      covered += 1
                  articles.append(len(mine))
                  for insight in mine:
                      label = str(insight.get("sentiment") or "").lower()
                      sentiments[label if label in sentiments else "other"] += 1
              asked = len(articles)
              print("massive_news asked=%d failures=%d covered=%d five_or_more=%d median_articles=%d" % (
                  asked, failures, covered, sum(1 for count in articles if count >= 5), int(statistics.median(articles)) if articles else 0))
              print("massive_insights positive=%d negative=%d neutral=%d other=%d" % (
                  sentiments["positive"], sentiments["negative"], sentiments["neutral"], sentiments["other"]))
          except Exception as error:
              print("massive_news failed=%s" % type(error).__name__)
          PY
          exit 0
          REMOTE
          echo "ssh_rc=$rc ssh_err_lines=$(grep -c . "$RUNNER_TEMP/ssh_err.txt")"
          grep -E '^(eodhd_realtime_http=[0-9]{3}|eodhd_realtime failed=[A-Za-z]+|index_[0-9] answered=(True|False) age_s=-?[0-9]+ previous_close=(True|False)|intraday_index_[0-9] (http=[0-9]{3} bars=[0-9]+ last_bar_age_s=-?[0-9]+|failed=[A-Za-z]+)|watched_us=[0-9]+|massive_news (asked=[0-9]+ failures=[0-9]+ covered=[0-9]+ five_or_more=[0-9]+ median_articles=[0-9]+|failed=[A-Za-z]+)|massive_insights positive=[0-9]+ negative=[0-9]+ neutral=[0-9]+ other=[0-9]+)$' "$RUNNER_TEMP/out.txt" || true
          exit 0
