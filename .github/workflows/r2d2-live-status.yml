name: R2D2 live status (read-only)

# The live R2D2 runs inside the C3PO server (service r2d2-live, owner 27/10/2026). This read-only check prints the
# container state, the engine's own summary from the database (no symbols), its count-only log lines and the NUMBER of
# error lines (this repository is public: no symbol and no error text is printed), any API token redacted. It changes
# nothing on the host.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "log window, in minutes (1-240)"
        default: "30"

permissions:
  contents: read

concurrency:
  group: r2d2-live-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    # no environment: the repository-level host secrets are the PREVIOUS host's (set 17/08/2026, before the 05/09 migration)
    timeout-minutes: 10
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh || exit 1
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy || exit 1
          chmod 600 ~/.ssh/c3po_deploy || exit 1
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts || exit 1
          chmod 600 ~/.ssh/known_hosts || exit 1

      - name: Read the previous host, once, read-only
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          # ssh's own errors name the host's address: they go to a private file and only their count is printed
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "bash -s" <<'REMOTE' > "$RUNNER_TEMP/out.txt" 2> "$RUNNER_TEMP/ssh_err.txt" || rc=$?
          set -uo pipefail
          exec 2>/dev/null
          echo "== previous host"
          awk '{ printf "uptime_days=%d\n", $1 / 86400 }' /proc/uptime
          free -m | awk '/^Mem:/ { printf "mem_mb total=%d used=%d\n", $2, $3 }'
          nproc | awk '{ printf "cpus=%d\n", $1 }'
          df -BG --output=size,used / | awk 'NR == 2 { gsub("G", ""); printf "root_gb size=%d used=%d\n", $1, $2 }'
          [ -d /opt/chief-of-staff-digital ] && echo "app_dir=present" || echo "app_dir=absent"
          version=$(cut -c1-12 /opt/chief-of-staff-digital/.deploy-version)
          [[ "$version" =~ ^[0-9a-f]{12}$ ]] && echo "deploy_version=$version" || echo "deploy_version=none"
          # every count carries its command's exit status: a denied docker or systemd never reads as "nothing runs"
          ids=$(timeout 20 docker ps -q); echo "docker_rc=$? containers_running=$(printf '%s' "$ids" | grep -c .)"
          timeout 20 docker ps --format '{{.Label "com.docker.compose.service"}} up={{.RunningFor}}' | grep -E '^[a-z0-9-]+ up=[A-Za-z0-9 ]+$' | sort
          timers=$(timeout 20 systemctl list-timers --all --no-legend --full); echo "systemctl_rc=$? c3po_timers=$(printf '%s\n' "$timers" | grep -cE 'c3po|r2d2|valuation|massive|backup|f2s')"
          cron=$(crontab -l); echo "crontab_rc=$? cron_lines=$(printf '%s\n' "$cron" | grep -cvE '^(#|$)')"
          echo "cron_d_files=$(find /etc/cron.d -maxdepth 1 -type f ! -name '.placeholder' ! -name 'e2scrub_all' ! -name 'sysstat' ! -name 'popularity-contest' | wc -l)"
          # wtmp also moves on reboots: lastlog moves only on interactive logins
          echo "last_login_days=$(( ( $(date +%s) - $(stat -c %Y /var/log/lastlog) ) / 86400 ))"
          exit 0
          REMOTE
          echo "ssh_rc=$rc ssh_err_lines=$(grep -c . "$RUNNER_TEMP/ssh_err.txt")"
          grep -E '^(== previous host|uptime_days=[0-9]+|mem_mb total=[0-9]+ used=[0-9]+|cpus=[0-9]+|root_gb size=[0-9]+ used=[0-9]+|app_dir=(present|absent)|deploy_version=([0-9a-f]{12}|none)|docker_rc=[0-9]+ containers_running=[0-9]+|[a-z0-9-]+ up=[A-Za-z0-9 ]+|systemctl_rc=[0-9]+ c3po_timers=[0-9]+|crontab_rc=[0-9]+ cron_lines=[0-9]+|cron_d_files=[0-9]+|last_login_days=-?[0-9]+)$' "$RUNNER_TEMP/out.txt" | tee -a "$GITHUB_STEP_SUMMARY" || true
          exit 0
