name: Validate ENTRY_QUALITY_STUDY PR 257 on production data

# Temporary branch-only read-only follow-up for cash and frozen source diagnostics.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factual-follow-up:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure production SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read cash ledger and current frozen-source bytes
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR=/opt/chief-of-staff-digital
          OUT="/tmp/overnight-follow-up-${RUN_ID}"
          mkdir -p "$OUT"
          cd "$APP_DIR"
          compose=(docker compose --env-file .env -f c3po/compose.yml)

          "${compose[@]}" run --rm -T api python - <<'PY' > "$OUT/cash-yield.json"
          import json

          from app.config import get_settings
          from app.database import Database
          from app.r2d2_cash_yield import RUN_ANALYSIS_TYPE, RUN_ENTITY_KEY

          settings = get_settings()
          database = Database(settings)
          with database.connection() as connection:
              experiment = connection.execute(
                  "SELECT id::text, code, start_date FROM r2d2_experiments WHERE code=%s",
                  (settings.r2d2_experiment_code,),
              ).fetchone()
              rows = connection.execute(
                  """SELECT session_date, prior_session_date, base_cash_usd,
                            annual_coupon_equivalent_rate, calendar_days, daily_factor,
                            interest_income_usd, source_observation_date, source_available_at,
                            source_fetched_at, source_payload_sha256, entry_sha256, backfilled_at
                     FROM r2d2_cash_yield_ledger
                     WHERE experiment_id=%s ORDER BY session_date""",
                  (experiment[0],),
              ).fetchall()
          keys = (
              "session_date", "prior_session_date", "base_cash_usd",
              "annual_coupon_equivalent_rate", "calendar_days", "daily_factor",
              "interest_income_usd", "source_observation_date", "source_available_at",
              "source_fetched_at", "source_payload_sha256", "entry_sha256", "backfilled_at",
          )
          entries = [dict(zip(keys, row)) for row in rows]
          latest = database.latest_analysis_snapshot(RUN_ANALYSIS_TYPE, RUN_ENTITY_KEY)
          payload = {
              "experiment": {
                  "id": experiment[0], "code": experiment[1], "start_date": experiment[2],
              },
              "entry_count": len(entries),
              "session_dates": [row["session_date"] for row in entries],
              "interest_income_total_usd": sum(float(row["interest_income_usd"]) for row in entries),
              "entries": entries,
              "latest_run": latest,
          }
          print(json.dumps(payload, sort_keys=True, indent=2, default=str))
          PY

          python3 - <<'PY' > "$OUT/entry-price-sources-current.json"
          import hashlib
          import json
          from pathlib import Path

          root = Path("/mnt/day-d-data")
          expected = [
              ("provider=massive/dataset=minute_aggregates/session_date=2026-08-17/source.csv.gz", 27682206, "cbf540f80ac12f1c313e7d63b9deadf400d81a221d20d5c2a474a7926f11f17c"),
              ("provider=massive/dataset=minute_aggregates/session_date=2026-08-18/source.csv.gz", 27557649, "b667f0ac89431d3c6d14c19d03f39b4d614ada2db7269d51c0fb25cb0b1c8c1f"),
              ("provider=massive/dataset=minute_aggregates/session_date=2026-08-19/source.csv.gz", 28879665, "ddb2fd8794ac38534a31d2bfb21ba553d110e0749562dfbe2e9965facfd7044d"),
              ("provider=massive/dataset=minute_aggregates/session_date=2026-08-20/source.csv.gz", 28019112, "276e13233b9b36b0ee2bde00491a4b33e6ec67a75773e1a7c452921ad62d2703"),
              ("provider=massive/dataset=minute_aggregates/session_date=2026-08-21/source.csv.gz", 27336179, "5ba68255eb8b6b6ac73d2912dad4eb3f21bc886f2fb5e72427ee7981ff38ef17"),
              ("provider=eodhd/microstructure/raw/session_date=2026-08-24/feed=trade-part-00001.ndjson", 88661964, "2fb125c134afff86c1fc9727a42f8f64ebbcbaa4db09b74c5279b4cbed12b2d9"),
              ("provider=eodhd/microstructure/raw/session_date=2026-08-26/feed=trade-part-00001.ndjson", 67073447, "b202c4d3a6e99a9136d6a02b76e585d4ea83ba6cff56aea86a1c5875c48af2fc"),
          ]
          rows = []
          for relative, expected_size, expected_sha in expected:
              path = root / relative
              if not path.is_file():
                  rows.append({"path": relative, "missing": True})
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              observed_sha = digest.hexdigest()
              observed_size = path.stat().st_size
              rows.append({
                  "path": relative,
                  "expected_size_bytes": expected_size,
                  "observed_size_bytes": observed_size,
                  "expected_sha256": expected_sha,
                  "observed_sha256": observed_sha,
                  "size_matches": observed_size == expected_size,
                  "sha256_matches": observed_sha == expected_sha,
              })
          print(json.dumps({
              "all_match": all(row.get("sha256_matches") for row in rows),
              "sources": rows,
          }, sort_keys=True, indent=2))
          PY

          (cd "$OUT" && sha256sum cash-yield.json entry-price-sources-current.json > SHA256SUMS)
          tar -C "$OUT" -czf "/tmp/overnight-follow-up-${RUN_ID}.tgz" .
          REMOTE

      - name: Download and verify follow-up
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          mkdir -p /tmp/overnight-follow-up
          scp -i ~/.ssh/c3po_deploy \
            "$USER@$HOST:/tmp/overnight-follow-up-${GITHUB_RUN_ID}.tgz" \
            /tmp/overnight-follow-up.tgz
          tar -xzf /tmp/overnight-follow-up.tgz -C /tmp/overnight-follow-up
          (cd /tmp/overnight-follow-up && sha256sum -c SHA256SUMS)

      - name: Publish factual follow-up artifact
        uses: actions/upload-artifact@v4
        with:
          name: overnight-follow-up-2026-08-27-${{ github.run_id }}
          path: /tmp/overnight-follow-up
          if-no-files-found: error
          retention-days: 30
