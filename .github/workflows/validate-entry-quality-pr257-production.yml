name: Inventory completed MICROSTRUCTURE_TAPE_PROBE_V1 evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Configure production SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inventory factual outputs without calling providers
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          printf '%s\n' '=== evidence directories ==='
          find /mnt/day-d-data/evidence/microstructure-tape-probe-v1 \
            -maxdepth 5 -type f -printf '%p %s bytes\n' 2>/dev/null | sort || true
          printf '%s\n' '=== temporary packages ==='
          find /tmp -maxdepth 3 \( -type f -o -type d \) \
            -iname '*tape-probe*' -printf '%p %s bytes\n' 2>/dev/null | sort || true
          printf '%s\n' '=== home packages ==='
          find "$HOME" -maxdepth 2 -type f -iname '*tape-probe*' \
            -printf '%p %s bytes\n' 2>/dev/null | sort || true
          REMOTE
