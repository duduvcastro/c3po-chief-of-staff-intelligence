name: Validate ENTRY_QUALITY_STUDY PR 257 on production data

# Temporary branch-only recovery of the completed read-only audit package.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-factual-audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure production SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package the completed audit with privileged evidence reads
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
          SOURCE_RUN_ID: 33064012836
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "SOURCE_RUN_ID='$SOURCE_RUN_ID' TARGET_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          SOURCE_ROOT="/tmp/overnight-audit-${SOURCE_RUN_ID}"
          OUT="$SOURCE_ROOT/evidence"
          EXIT_SOURCE=/mnt/day-d-data/evidence/r2d2-exit-policy-study-v1-1/2026-08-27
          test -d "$OUT"

          sudo rm -rf "$OUT/exit-policy-study"
          sudo cp -a "$EXIT_SOURCE" "$OUT/exit-policy-study"
          sudo chown -R "$(id -u):$(id -g)" "$OUT/exit-policy-study"

          python3 - "$OUT" <<'PY' > "$OUT/exit-policy-summary.json"
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          study = root / "exit-policy-study"
          checked = subprocess.run(
              ["sha256sum", "-c", "SHA256SUMS"],
              cwd=study,
              text=True,
              capture_output=True,
          )
          report = json.loads((study / "report.json").read_text(encoding="utf-8"))
          encoded = json.dumps(
              {key: value for key, value in report.items() if key != "report_sha256"},
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
              allow_nan=False,
          ).encode("utf-8")
          observed = hashlib.sha256(encoded).hexdigest()
          payload = {
              "source_present": True,
              "sha256sums_passed": checked.returncode == 0,
              "sha256sums_output": (checked.stdout + checked.stderr).strip(),
              "report_sha256": report.get("report_sha256"),
              "report_self_hash_observed": observed,
              "report_self_hash_passed": report.get("report_sha256") == observed,
              "result": json.loads((study / "result.json").read_text(encoding="utf-8")),
              "postflight": json.loads((study / "postflight.json").read_text(encoding="utf-8")),
          }
          print(json.dumps(payload, sort_keys=True, indent=2))
          PY

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          tar -C "$SOURCE_ROOT" -czf "/tmp/overnight-audit-${TARGET_RUN_ID}.tgz" evidence
          test -s "/tmp/overnight-audit-${TARGET_RUN_ID}.tgz"
          ls -lh "/tmp/overnight-audit-${TARGET_RUN_ID}.tgz"
          REMOTE

      - name: Download and verify factual audit package
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          scp -i ~/.ssh/c3po_deploy \
            "$USER@$HOST:/tmp/overnight-audit-${GITHUB_RUN_ID}.tgz" \
            /tmp/overnight-audit.tgz
          mkdir -p /tmp/overnight-audit
          tar -xzf /tmp/overnight-audit.tgz -C /tmp/overnight-audit
          (cd /tmp/overnight-audit/evidence && sha256sum -c SHA256SUMS)

      - name: Publish factual audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: overnight-audit-2026-08-27-${{ github.run_id }}
          path: /tmp/overnight-audit/evidence
          if-no-files-found: error
          retention-days: 30
