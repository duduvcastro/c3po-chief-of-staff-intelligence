name: Inspect MICROSTRUCTURE_TAPE_PROBE_V1 blocked run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Configure production SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect blocked run without calling providers
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" 'bash -s' <<'REMOTE'
          ROOT=/tmp/microstructure-tape-probe-v1-33068657948
          printf 'root='; stat -c '%a %U:%G' "$ROOT" 2>/dev/null || echo missing
          find "$ROOT" -maxdepth 2 -type f -printf 'file=%f size=%s sha=%p\n' 2>/dev/null | sort || true
          for file in plan.json plan.error.txt run.stdout.json run.stderr.txt run.exit-code.txt validation.json; do
            if [ -f "$ROOT/$file" ]; then
              printf '%s\n' "--- $file ---"
              if [ "$file" = plan.json ]; then
                sha256sum "$ROOT/$file"
              fi
              sed -n '1,240p' "$ROOT/$file"
            fi
          done
          find /mnt/day-d-data/evidence/microstructure-tape-probe-v1/2026-08-27 \
            -maxdepth 4 -type f -printf 'evidence=%p size=%s\n' 2>/dev/null | sort || true
          REMOTE
