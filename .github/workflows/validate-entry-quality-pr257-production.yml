name: Recover MICROSTRUCTURE_TAPE_PROBE_V1 factual run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure production SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package existing factual bytes without provider calls
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          SOURCE_RUN=33068944847
          ROOT="/tmp/microstructure-tape-probe-v1-${SOURCE_RUN}"
          EVIDENCE="/mnt/day-d-data/evidence/microstructure-tape-probe-v1/2026-08-27/run-${SOURCE_RUN}"
          RECOVERY="/tmp/microstructure-tape-probe-recovery-${SOURCE_RUN}"
          PACKAGE="/tmp/microstructure-tape-probe-recovery-${SOURCE_RUN}.tgz"
          rm -rf "$RECOVERY"
          mkdir -p "$RECOVERY/control" "$RECOVERY/evidence"
          if [ -d "$ROOT" ]; then
            cp -a "$ROOT"/. "$RECOVERY/control"/
          fi
          if [ -d "$EVIDENCE" ]; then
            cp -a "$EVIDENCE"/. "$RECOVERY/evidence"/
          fi
          find "$RECOVERY" -type f ! -name ALL_SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > "$RECOVERY/ALL_SHA256SUMS"
          tar -C "$RECOVERY" -czf "$PACKAGE" .
          sha256sum "$PACKAGE" > "${PACKAGE}.sha256"
          REMOTE

      - name: Download recovered factual bytes
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          mkdir -p /tmp/microstructure-tape-probe-recovery
          scp -i ~/.ssh/c3po_deploy \
            "$USER@$HOST:/tmp/microstructure-tape-probe-recovery-33068944847.tgz" \
            /tmp/microstructure-tape-probe-recovery/package.tgz
          scp -i ~/.ssh/c3po_deploy \
            "$USER@$HOST:/tmp/microstructure-tape-probe-recovery-33068944847.tgz.sha256" \
            /tmp/microstructure-tape-probe-recovery/package.tgz.sha256
          (cd /tmp/microstructure-tape-probe-recovery && sha256sum -c package.tgz.sha256)
          mkdir -p /tmp/microstructure-tape-probe-recovery/recovered
          tar -xzf /tmp/microstructure-tape-probe-recovery/package.tgz \
            -C /tmp/microstructure-tape-probe-recovery/recovered

      - name: Publish recovered factual bytes
        uses: actions/upload-artifact@v4
        with:
          name: microstructure-tape-probe-recovery-33068944847
          path: /tmp/microstructure-tape-probe-recovery
          if-no-files-found: error
          retention-days: 30
