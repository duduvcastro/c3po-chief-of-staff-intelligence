name: Validate ENTRY_QUALITY_STUDY PR 257 on production data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-frozen-plan:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Configure production SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package completed frozen plan
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
          SOURCE_RUN_ID: 33064943925
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" \
            "SOURCE_RUN_ID='$SOURCE_RUN_ID' TARGET_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          ROOT="/tmp/tape-probe-plan-${SOURCE_RUN_ID}"
          test -d "$ROOT"
          find "$ROOT" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          (cd "$ROOT" && sha256sum frozen-prefix-recovery.json plan.error.txt plan.json > SHA256SUMS)
          tar -C "$ROOT" -czf "/tmp/tape-probe-plan-recovered-${TARGET_RUN_ID}.tgz" \
            frozen-prefix-recovery.json plan.error.txt plan.json SHA256SUMS
          test -s "/tmp/tape-probe-plan-recovered-${TARGET_RUN_ID}.tgz"
          REMOTE

      - name: Download and verify frozen plan
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          mkdir -p /tmp/tape-probe-plan
          scp -i ~/.ssh/c3po_deploy \
            "$USER@$HOST:/tmp/tape-probe-plan-recovered-${GITHUB_RUN_ID}.tgz" \
            /tmp/tape-probe-plan.tgz
          tar -xzf /tmp/tape-probe-plan.tgz -C /tmp/tape-probe-plan
          (cd /tmp/tape-probe-plan && sha256sum -c SHA256SUMS)

      - name: Publish frozen plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tape-probe-plan-2026-08-27-${{ github.run_id }}
          path: /tmp/tape-probe-plan
          if-no-files-found: error
          retention-days: 30
