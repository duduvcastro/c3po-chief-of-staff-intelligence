name: Inventory completed MICROSTRUCTURE_TAPE_PROBE_V1 evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Configure production SSH key
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_deploy
          chmod 600 ~/.ssh/c3po_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Diagnose preconditions without calling providers
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_deploy "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          APP_DIR=/opt/chief-of-staff-digital
          SOURCE_ROOT=/tmp/overnight-audit-33064012836
          INPUT="$SOURCE_ROOT/inputs"
          RAW=/mnt/day-d-data/provider=eodhd/microstructure/raw/session_date=2026-08-26/feed=trade-part-00001.ndjson

          printf 'app_dir='; test -d "$APP_DIR" && echo present || echo missing
          printf 'input_dir='; test -d "$INPUT" && echo present || echo missing
          find "$INPUT" -maxdepth 1 -type f -printf 'input_file=%f size=%s\n' 2>/dev/null | sort || true
          printf 'exit_report='; test -f /mnt/day-d-data/evidence/r2d2-exit-policy-study-v1-1/2026-08-27/report.json && echo present || echo missing
          printf 'raw_source='; test -f "$RAW" && stat -c 'present size=%s' "$RAW" || echo missing
          printf 'source_root_mode='; stat -c '%a %U:%G' "$SOURCE_ROOT" 2>/dev/null || echo missing
          printf 'empty_run_root_mode='; stat -c '%a %U:%G' /tmp/microstructure-tape-probe-v1-33067984482 2>/dev/null || echo missing

          cd "$APP_DIR" || exit 0
          printf 'deployed_sha='; docker compose --env-file .env -f c3po/compose.yml exec -T api printenv C3PO_BUILD_SHA 2>&1 || true
          printf 'api_runner_module='; docker compose --env-file .env -f c3po/compose.yml exec -T api \
            python -c 'import app.microstructure_tape_probe; print("present")' 2>&1 || true
          REMOTE
