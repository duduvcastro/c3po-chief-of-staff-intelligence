name: One-shot host maintenance and runtime unknown inventory

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Authorized one-shot operations revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: c3po-host-security-install
  cancel-in-progress: false

jobs:
  maintain-and-inventory:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out the authorized one-shot revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Configure production transport
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_ops
          chmod 600 ~/.ssh/c3po_ops
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run unattended-upgrades and capture before and after
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          ssh -i ~/.ssh/c3po_ops "$USER@$HOST" 'bash -s' <<'REMOTE' \
            | tee "$RUNNER_TEMP/host-maintenance.txt"
          set -euo pipefail

          pending() {
            apt list --upgradable 2>/dev/null | sed '1d' | sort
          }

          report_summary() {
            sudo python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('/opt/chief-of-staff-digital/runtime/security/host-os-vulnerability-report.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps({
              'generated_at': report.get('generated_at'),
              'updates': report.get('updates'),
              'reboot_required': report.get('reboot_required'),
              'reboot_packages': report.get('reboot_packages'),
              'report_sha256': report.get('report_sha256'),
          }, sort_keys=True))
          PY
          }

          echo '=== BEFORE_HOST_REPORT ==='
          report_summary
          echo '=== BEFORE_PENDING ==='
          pending
          echo '=== BEFORE_REBOOT ==='
          printf 'running_kernel=%s\n' "$(uname -r)"
          if test -f /var/run/reboot-required; then
            echo 'reboot_required=true'
            test ! -f /var/run/reboot-required.pkgs || sort -u /var/run/reboot-required.pkgs
          else
            echo 'reboot_required=false'
          fi

          echo '=== REFRESH_APT_METADATA ==='
          sudo apt-get update --quiet
          echo '=== REFRESHED_PENDING ==='
          pending

          echo '=== RUN_UNATTENDED_UPGRADES ==='
          sudo systemctl start apt-daily-upgrade.service
          sudo systemctl show apt-daily-upgrade.service \
            --property=Result --property=ExecMainStatus --property=InactiveExitTimestamp \
            --no-pager
          sudo systemctl start c3po-host-security-snapshot.service

          echo '=== AFTER_HOST_REPORT ==='
          report_summary
          echo '=== AFTER_PENDING ==='
          pending
          echo '=== AFTER_RETAINED_WITH_REASON ==='
          python3 - <<'PY'
          import apt
          import json
          import subprocess

          holds = set(subprocess.run(
              ['apt-mark', 'showhold'], check=False, capture_output=True, text=True
          ).stdout.splitlines())
          cache = apt.Cache()
          cache.open(None)
          cache.upgrade(dist_upgrade=True)
          retained = []
          for package in sorted(
              (item for item in cache if item.is_upgradable), key=lambda item: item.name
          ):
              origins = sorted({
                  ':'.join(filter(None, [
                      str(getattr(origin, 'origin', '')),
                      str(getattr(origin, 'archive', '')),
                      str(getattr(origin, 'component', '')),
                  ]))
                  for origin in package.candidate.origins
              })
              security_candidate = any('security' in origin.lower() for origin in origins)
              if package.name in holds:
                  reason = 'apt-hold'
              elif security_candidate:
                  reason = 'security candidate remained; dependency/phasing/manual review required'
              else:
                  reason = 'excluded by the security-only unattended-upgrades policy'
              retained.append({
                  'package': package.name,
                  'installed': package.installed.version if package.installed else None,
                  'candidate': package.candidate.version,
                  'origins': origins,
                  'reason': reason,
              })
          print(json.dumps(retained, sort_keys=True))
          PY
          echo '=== AFTER_REBOOT ==='
          printf 'running_kernel=%s\n' "$(uname -r)"
          if test -f /var/run/reboot-required; then
            echo 'reboot_required=true'
            test ! -f /var/run/reboot-required.pkgs || sort -u /var/run/reboot-required.pkgs
          else
            echo 'reboot_required=false'
          fi
          REMOTE

      - name: Export production images read-only
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          db_image_ref=$(ssh -i ~/.ssh/c3po_ops "$USER@$HOST" 'bash -s' <<'META'
          set -euo pipefail
          cd /opt/chief-of-staff-digital
          container=$(docker compose --env-file .env -f c3po/compose.yml ps -q db)
          docker inspect --format '{{.Config.Image}}' "$container"
          META
          )
          test -n "$db_image_ref"
          printf 'C3PO_DB_IMAGE_REF=%s\n' "$db_image_ref" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/c3po_ops "$USER@$HOST" 'bash -s' \
            > "$RUNNER_TEMP/c3po-production-images.tar.gz" <<'REMOTE'
          set -euo pipefail
          cd /opt/chief-of-staff-digital
          db_container=$(docker compose --env-file .env -f c3po/compose.yml ps -q db)
          db_image_ref=$(docker inspect --format '{{.Config.Image}}' "$db_container")
          docker save c3po/backend:production c3po/web:production "$db_image_ref" | gzip -1
          REMOTE
          gzip -dc "$RUNNER_TEMP/c3po-production-images.tar.gz" | docker load

      - name: Enumerate findings without severity using pinned Trivy
        run: |
          work="$RUNNER_TEMP/trivy-unknown"
          mkdir -p "$work/cache"
          scanner='aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969'
          for spec in \
            "backend=c3po/backend:production" \
            "web=c3po/web:production" \
            "database=$C3PO_DB_IMAGE_REF"; do
            label=${spec%%=*}
            reference=${spec#*=}
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$work:/reports" \
              --volume "$work/cache:/tmp/trivy-cache" \
              "$scanner" image \
              --cache-dir /tmp/trivy-cache \
              --format json \
              --output "/reports/$label.json" \
              --scanners vuln \
              --exit-code 0 \
              "$reference"
          done
          jq -s '
            [ .[] as $doc
              | $doc.Results[]? as $result
              | ($result.Vulnerabilities // [])[]
              | select(((.Severity // "") | ascii_upcase) == "UNKNOWN" or (.Severity // "") == "")
              | {
                  id: (.VulnerabilityID // "unknown"),
                  package: (.PkgName // "unknown"),
                  installed_version: (.InstalledVersion // "unknown"),
                  target: ($result.Target // "unknown"),
                  image: ($doc.ArtifactName // "unknown")
                }
            ] | sort_by(.image, .target, .package, .id)
          ' "$work/backend.json" "$work/web.json" "$work/database.json" \
            > "$RUNNER_TEMP/runtime-unknown-findings.json"
          jq -e 'length == 8' "$RUNNER_TEMP/runtime-unknown-findings.json"
          jq . "$RUNNER_TEMP/runtime-unknown-findings.json"

      - name: Publish one-shot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3po-one-shot-host-maintenance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/host-maintenance.txt
            ${{ runner.temp }}/runtime-unknown-findings.json
          if-no-files-found: error
          retention-days: 90
