name: R2D2 Chandelier probes and Candidate F backtest

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN R2D2 CHANDELIER STUDY
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: r2d2-chandelier-study
  cancel-in-progress: false

jobs:
  read-only-study:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - name: Require exact confirmation
        env:
          RECEIVED: ${{ inputs.confirmation }}
        run: |
          if [ "$RECEIVED" != 'RUN R2D2 CHANDELIER STUDY' ]; then
            echo 'Confirmation did not match the approved phrase.' >&2
            exit 2
          fi

      - name: Check out audited study revision
        uses: actions/checkout@v6

      - name: Check out frozen Candidate E policy
        uses: actions/checkout@v6
        with:
          ref: bc79ca195c19bee9b9ef18c3098d28ae6c149597
          path: frozen-candidate-e

      - name: Package frozen policy source
        run: |
          tar -C frozen-candidate-e -czf "$RUNNER_TEMP/candidate-e-source.tar.gz" c3po/backend
          (
            cd "$RUNNER_TEMP"
            sha256sum candidate-e-source.tar.gz > candidate-e-source.tar.gz.sha256
          )

      - name: Configure production transport
        env:
          DEPLOY_KEY: ${{ secrets.C3PO_AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.C3PO_AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/c3po_study
          chmod 600 ~/.ssh/c3po_study
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload frozen source
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
        run: |
          scp -i ~/.ssh/c3po_study \
            "$RUNNER_TEMP/candidate-e-source.tar.gz" \
            "$RUNNER_TEMP/candidate-e-source.tar.gz.sha256" \
            "$USER@$HOST:/tmp/"

      - name: Run production read-only probes and frozen replay
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PROBE_INPUT_CUTOFF_AT: '2026-09-03T04:58:39.183354+00:00'
          PROBE_LEDGER_ROW_COUNT: '1292'
          PROBE_LEDGER_CANONICAL_SHA256: e641371f2db261556624b57eca930f97d01e5c3951401b18dbe7b13532f01dd8
        run: |
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -i ~/.ssh/c3po_study "$USER@$HOST" \
            "REVISION='$REVISION' RUN_ID='$RUN_ID' PROBE_INPUT_CUTOFF_AT='$PROBE_INPUT_CUTOFF_AT' PROBE_LEDGER_ROW_COUNT='$PROBE_LEDGER_ROW_COUNT' PROBE_LEDGER_CANONICAL_SHA256='$PROBE_LEDGER_CANONICAL_SHA256' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          APP_DIR=/opt/chief-of-staff-digital
          HOST_OUTPUT_ROOT=/mnt/day-d-data/evidence/r2d2-chandelier-study-v1
          HOST_OUTPUT="$HOST_OUTPUT_ROOT/run-$RUN_ID"
          CONTAINER_OUTPUT="/app/day-d-data/evidence/r2d2-chandelier-study-v1/run-$RUN_ID"
          frozen_tmp=$(mktemp -d /tmp/r2d2-candidate-e.XXXXXX)
          cleanup() {
            case "$frozen_tmp" in
              /tmp/r2d2-candidate-e.*) rm -rf -- "$frozen_tmp" ;;
              *) echo 'Refusing unexpected cleanup target.' >&2 ;;
            esac
          }
          trap cleanup EXIT

          local_hour=$(TZ=America/Sao_Paulo date +%H)
          if [ "$local_hour" -ge 8 ]; then
            echo 'Heavy study is restricted to 00:00-08:00 America/Sao_Paulo.' >&2
            exit 10
          fi
          cd "$APP_DIR"
          if [ "$(cat .deploy-version 2>/dev/null || true)" != "$REVISION" ]; then
            echo 'Audited revision is not the live deployed revision.' >&2
            exit 11
          fi
          if ! mountpoint -q /mnt/day-d-data; then
            echo '/mnt/day-d-data is not mounted.' >&2
            exit 12
          fi
          mkdir -p "$HOST_OUTPUT"
          (cd /tmp && sha256sum -c candidate-e-source.tar.gz.sha256)
          frozen_source_sha256=$(awk 'NR == 1 {print $1}' /tmp/candidate-e-source.tar.gz.sha256)
          tar -C "$frozen_tmp" -xzf /tmp/candidate-e-source.tar.gz
          cp /tmp/candidate-e-source.tar.gz.sha256 \
            "$HOST_OUTPUT/frozen-candidate-e-source.tar.gz.sha256"

          compose=(docker compose --env-file .env -f c3po/compose.yml)
          active_api_oneoffs=$(
            docker ps \
              --filter label=com.docker.compose.project=c3po \
              --filter label=com.docker.compose.oneoff=True \
              --filter label=com.docker.compose.service=api \
              --format '{{.ID}}'
          )
          if [ -n "$active_api_oneoffs" ]; then
            echo 'Another API one-off container is active; refusing overlapping study.' >&2
            exit 13
          fi
          host_identity="$(id -u):$(id -g)"
          "${compose[@]}" run --rm -T --user "$host_identity" \
            -e EXPECTED_IDENTITY="$host_identity" \
            -e STUDY_OUTPUT="$CONTAINER_OUTPUT" \
            api sh -eu -c '
              test "$(id -u):$(id -g)" = "$EXPECTED_IDENTITY"
              test -w "$STUDY_OUTPUT"
            ' </dev/null

          "${compose[@]}" run --rm -T --user "$host_identity" api \
            python -m app.r2d2_chandelier_probe \
            --output "$CONTAINER_OUTPUT/probes-a-b.json" \
            --query-output "$CONTAINER_OUTPUT/query.sql" \
            --cutoff-at "$PROBE_INPUT_CUTOFF_AT" \
            </dev/null

          set +e
          "${compose[@]}" run --rm -T --user "$host_identity" \
            -v "$frozen_tmp:/frozen:ro" \
            -e PYTHONPATH=/frozen/c3po/backend \
            api python /app/app/r2d2_candidate_f_backtest.py \
            --data-root /app/day-d-data \
            --frozen-source-sha256 "$frozen_source_sha256" \
            --output "$CONTAINER_OUTPUT/backtest-e-f.json" \
            </dev/null
          backtest_exit=$?
          set -e
          case "$backtest_exit" in
            0|2) ;;
            *) echo "Candidate E/F replay failed unexpectedly with exit $backtest_exit." >&2; exit "$backtest_exit" ;;
          esac

          python3 - \
            "$HOST_OUTPUT" \
            "$PROBE_INPUT_CUTOFF_AT" \
            "$PROBE_LEDGER_ROW_COUNT" \
            "$PROBE_LEDGER_CANONICAL_SHA256" \
            "$backtest_exit" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          expected_cutoff = sys.argv[2]
          expected_ledger_rows = int(sys.argv[3])
          expected_ledger_sha256 = sys.argv[4]
          expected_backtest_exit = int(sys.argv[5])
          for name in ("probes-a-b.json", "backtest-e-f.json"):
              payload = json.loads((root / name).read_text(encoding="utf-8"))
              expected = payload.pop("report_sha256")
              encoded = json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
                  default=str,
              ).encode("utf-8")
              observed = hashlib.sha256(encoded).hexdigest()
              if observed != expected:
                  raise SystemExit(f"self-hash mismatch for {name}: {observed} != {expected}")
          query = root / "query.sql"
          query_sha = hashlib.sha256(query.read_bytes()).hexdigest()
          probe = json.loads((root / "probes-a-b.json").read_text(encoding="utf-8"))
          if query_sha != probe["governance"]["query_sha256"]:
              raise SystemExit("query hash mismatch")
          if probe.get("input_cutoff_at") != expected_cutoff:
              raise SystemExit("probe input cutoff mismatch")
          if probe.get("inputs", {}).get("ledger_row_count") != expected_ledger_rows:
              raise SystemExit("probe ledger row count mismatch")
          if probe.get("inputs", {}).get("ledger_canonical_sha256") != expected_ledger_sha256:
              raise SystemExit("probe ledger canonical hash mismatch")
          frozen_sha = (
              root / "frozen-candidate-e-source.tar.gz.sha256"
          ).read_text(encoding="utf-8").split()[0]
          backtest = json.loads((root / "backtest-e-f.json").read_text(encoding="utf-8"))
          if frozen_sha != backtest["frozen_harness"]["source_package_sha256"]:
              raise SystemExit("frozen source provenance mismatch")
          status = backtest.get("study_status")
          if status == "COMPLETE":
              if expected_backtest_exit != 0:
                  raise SystemExit("complete E/F report did not return exit 0")
              if any(backtest.get(key) is None for key in (
                  "candidate_e", "candidate_f", "paired_delta_f_minus_e",
              )):
                  raise SystemExit("complete E/F report omitted metrics")
          elif status == "PARTIAL/BLOCKED":
              if expected_backtest_exit != 2:
                  raise SystemExit("blocked E/F report did not return exit 2")
              if any(backtest.get(key) is not None for key in (
                  "candidate_e", "candidate_f", "paired_delta_f_minus_e",
              )):
                  raise SystemExit("blocked E/F report emitted prohibited metrics")
              gate = dict(backtest.get("coverage_gate") or {})
              diagnostic_sha256 = gate.pop("diagnostic_sha256", None)
              diagnostic_observed = hashlib.sha256(json.dumps(
                  gate,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
                  default=str,
              ).encode("utf-8")).hexdigest()
              if diagnostic_sha256 != diagnostic_observed:
                  raise SystemExit("blocked E/F coverage diagnostic self-hash mismatch")
              if gate.get("classification") != "BLOCKED_BY_MINIMUM_FIVE_MINUTE_BAR_GATE":
                  raise SystemExit("blocked E/F report has unexpected classification")
              if gate.get("minimum_formed_five_minute_bars_per_symbol_session") != 70:
                  raise SystemExit("blocked E/F report changed the formed-bar gate")
          else:
              raise SystemExit(f"unexpected E/F study status: {status}")
          PY

          (
            cd "$HOST_OUTPUT"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          chmod 0444 "$HOST_OUTPUT"/*
          REMOTE

      - name: Download reduced artifact
        env:
          HOST: ${{ secrets.C3PO_AWS_HOST }}
          USER: ${{ secrets.C3PO_AWS_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/r2d2-chandelier-study"
          scp -i ~/.ssh/c3po_study \
            "$USER@$HOST:/mnt/day-d-data/evidence/r2d2-chandelier-study-v1/run-$RUN_ID/probes-a-b.json" \
            "$USER@$HOST:/mnt/day-d-data/evidence/r2d2-chandelier-study-v1/run-$RUN_ID/backtest-e-f.json" \
            "$USER@$HOST:/mnt/day-d-data/evidence/r2d2-chandelier-study-v1/run-$RUN_ID/query.sql" \
            "$USER@$HOST:/mnt/day-d-data/evidence/r2d2-chandelier-study-v1/run-$RUN_ID/frozen-candidate-e-source.tar.gz.sha256" \
            "$USER@$HOST:/mnt/day-d-data/evidence/r2d2-chandelier-study-v1/run-$RUN_ID/SHA256SUMS" \
            "$RUNNER_TEMP/r2d2-chandelier-study/"
          (cd "$RUNNER_TEMP/r2d2-chandelier-study" && sha256sum -c SHA256SUMS)

      - name: Publish reduced evidence for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: r2d2-chandelier-study-${{ github.run_id }}
          path: ${{ runner.temp }}/r2d2-chandelier-study
          if-no-files-found: error
          retention-days: 30

      - name: Annex factual summary to gate agenda
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ runner.temp }}/r2d2-chandelier-study
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - "$ROOT" "$RUN_URL" > "$RUNNER_TEMP/gate-annex.md" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          run_url = sys.argv[2]
          probe = json.loads((root / "probes-a-b.json").read_text(encoding="utf-8"))
          backtest = json.loads((root / "backtest-e-f.json").read_text(encoding="utf-8"))
          a = probe["probe_a"]
          b = probe["probe_b"]
          print("## Anexo factual — Chandelier E×F")
          print()
          print(f"- [run e artefato reduzido]({run_url}) — retenção 30 dias")
          print(f"- Corte de entrada congelado: `{probe['input_cutoff_at']}`; "
                f"ledger `{probe['inputs']['ledger_row_count']}` linhas / "
                f"`{probe['inputs']['ledger_canonical_sha256']}`.")
          print(f"- Sonda A: {a['eligible_episode_count']} vencedores elegíveis; "
                f"{a['ratchet_only_exit_count']} cruzamentos exclusivos da catraca.")
          if b["eligible_stop_out_count"]:
              print(f"- Sonda B: {b['eligible_stop_out_count']} stop-outs elegíveis; "
                    f"{b['recovered_above_entry_percent']}% voltaram acima da entrada e "
                    f"{b['reached_plus_1r_percent']}% chegaram a +1R na mesma sessão.")
          else:
              print(f"- Sonda B: {b['observed_stop_out_count']} stop-outs observados; "
                    "0 elegíveis; recuperação N/D (denominador vazio).")
          if backtest["study_status"] == "COMPLETE":
              e = backtest["candidate_e"]
              f = backtest["candidate_f"]
              print(f"- Backtest E→F: payoff {e['payoff_ratio']}→{f['payoff_ratio']}; "
                    f"drawdown {e['max_drawdown_percent']}%→{f['max_drawdown_percent']}%; "
                    f"retorno {e['total_return_percent']}%→{f['total_return_percent']}%.")
              print(f"- Saída precipitada E→F: "
                    f"{e['premature_exit']['premature_exit_percent']}%→"
                    f"{f['premature_exit']['premature_exit_percent']}% "
                    f"(denominadores {e['premature_exit']['eligible_stop_exit_leg_count']}→"
                    f"{f['premature_exit']['eligible_stop_exit_leg_count']}).")
          elif backtest["study_status"] == "PARTIAL/BLOCKED":
              gate = backtest["coverage_gate"]
              print("- Backtest E×F: **PARTIAL/BLOCKED** pelo piso inalterado de 70 "
                    "barras formadas por símbolo/sessão; zero métricas E×F emitidas.")
              print(f"- Diagnóstico de cobertura: `{gate['diagnostic_sha256']}`; "
                    f"shortfalls `{json.dumps(gate['shortfalls'], sort_keys=True, separators=(',', ':'))}`.")
          else:
              raise SystemExit(f"unexpected E/F study status: {backtest['study_status']}")
          print(f"- Hashes: probes `{probe['report_sha256']}`; backtest `{backtest['report_sha256']}`.")
          print("- Este novo hash das Sondas A/B supersede os resultados N/D do erratum "
                "`c36ad4fce26c6f681b44c6f86046e2f1c2472da7258c402d947a2785fcae9bab`.")
          disclosure = backtest["bar_construction_disclosure"]
          print("- Comparabilidade: a montagem corrigida pode alterar os números absolutos de E "
                "contra 20/08; E e F usam as mesmas barras formadas, preservando a comparação "
                "pareada quando completa; divergência material exige re-atestação de E antes "
                "de qualquer conclusão.")
          if not disclosure["material_divergence_requires_candidate_e_reattestation"]:
              raise SystemExit("E/F comparability disclosure lost the re-attestation gate")
          print(f"- Política E congelada: commit `{backtest['frozen_harness']['policy_commit']}`; "
                f"pacote `{backtest['frozen_harness']['source_package_sha256']}`.")
          print("- Evidência apenas: nenhuma mudança de política ou produção foi autorizada.")
          PY
          gh pr comment 348 --body-file "$RUNNER_TEMP/gate-annex.md"

      - name: Fail closed after publishing blocked E/F diagnosis
        env:
          ROOT: ${{ runner.temp }}/r2d2-chandelier-study
        run: |
          python3 - "$ROOT" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          backtest = json.loads((root / "backtest-e-f.json").read_text(encoding="utf-8"))
          status = backtest.get("study_status")
          if status == "PARTIAL/BLOCKED":
              raise SystemExit(
                  "Candidate E/F remains PARTIAL/BLOCKED; evidence was published before this failure."
              )
          if status != "COMPLETE":
              raise SystemExit(f"Unexpected Candidate E/F study status: {status}")
          PY
