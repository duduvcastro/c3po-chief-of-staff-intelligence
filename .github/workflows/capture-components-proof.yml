# Prova Linux dos dois componentes da captura sem o Mac (sem segredos, sem host, ramo descartável).
name: capture-components-proof
on:
  push:
    branches: [ops/capture-components-proof-20261007]
permissions:
  contents: read
jobs:
  owner-response:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: componente de resposta do dono (09e4250a)
        working-directory: capture-owner-response
        run: python -I -B run_offline_tests.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-response-proof
          path: capture-owner-response/COMPONENT_TEST_RESULT.json
          retention-days: 30
  capture-channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: componente do canal da captura (c77abf1e)
        working-directory: capture-channel
        run: python -I -B test_capture_channel.py 2>&1 | tee channel-test.log; exit ${PIPESTATUS[0]}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capture-channel-proof
          path: capture-channel/
          retention-days: 30
